:"لغة Pascal فقط"},{"l":"C","e":"C++","a":"لغة C++"},{"l":"D","e":"Only Python","a":"لغة Python فقط"}],"c":"C","xe":"Structured programming is a paradigm, not a language-specific feature. Many languages, including C, Pascal, C++, and Python, support structured programming. C++ is a multi-paradigm language that supports structured, procedural, and object-oriented programming . The options claiming \"only\" a specific language are incorrect.","xa":"البرمجة المهيكلة هي نمط برمجي وليست ميزة خاصة بلغة واحدة. العديد من اللغات، بما في ذلك C وPascal وC++ وPython، تدعم البرمجة المهيكلة. ولغة C++ هي لغة متعددة الأنماط تدعم البرمجة المهيكلة والإجرائية والكائنية . الخيارات التي تدعي حصرها بلغة واحدة غير صحيحة."},{"n":11,"ch":9,"qe":"The act of designing a program from the top-level task down to sub-tasks is called:","qa":"عملية تصميم برنامج من المهمة العليا نزولاً إلى المهام الفرعية تسمى:","o":[{"l":"A","e":"Top-Down Design","a":"التصميم من الأعلى إلى الأسفل (Top-Down Design)"},{"l":"B","e":"Bottom-Up Implementation","a":"التنفيذ من الأسفل إلى الأعلى (Bottom-Up Implementation)"},{"l":"C","e":"Debugging","a":"تصحيح الأخطاء (Debugging)"},{"l":"D","e":"OOP","a":"البرمجة الكائنية التوجه (OOP)"}],"c":"A","xe":"Top-down design is a problem-solving strategy where you start by defining the overall, top-level task and then progressively break it down into smaller and smaller sub-tasks until each piece is simple enough to be coded .","xa":"التصميم من الأعلى إلى الأسفل (Top-Down Design) هو استراتيجية لحل المشكلات تبدأ فيها بتحديد المهمة الكلية العليا، ثم تقسمها تدريجياً إلى مهام فرعية أصغر وأصغر حتى تصبح كل قطعة بسيطة بما يكفي لبرمجتها ."},{"n":12,"ch":9,"qe":"In the grade-calculation example, \"input → process → output\" illustrates:","qa":"في مثال حساب الدرجات، \"الإدخال ← المعالجة ← الإخراج\" يوضح:","o":[{"l":"A","e":"Sequence","a":"التتابع (Sequence)"},{"l":"B","e":"Selection","a":"الاختيار (Selection)"},{"l":"C","e":"Polymorphism","a":"تعدد الأشكال (Polymorphism)"},{"l":"D","e":"Exception handling","a":"معالجة الاستثناءات (Exception Handling)"}],"c":"A","xe":"The \"input → process → output\" pattern is a classic example of the sequence control structure, where steps are executed one after another in a linear, predetermined order.","xa":"نمط \"الإدخال ← المعالجة ← الإخراج\" هو مثال كلاسيكي على هيكل التتابع (Sequence)، حيث تُنفذ الخطوات واحدة تلو الأخرى بترتيب خطي ومحدد مسبقاً."},{"n":13,"ch":9,"qe":"Each function or module should do:","qa":"يجب أن تقوم كل دالة أو وحدة بـ:","o":[{"l":"A","e":"Many jobs to save time","a":"مهام كثيرة لتوفير الوقت"},{"l":"B","e":"Exactly one job well","a":"مهمة واحدة فقط وبإتقان"},{"l":"C","e":"No specific job","a":"لا مهمة محددة"},{"l":"D","e":"Hardware management","a":"إدارة العتاد"}],"c":"B","xe":"A key principle of good modular and structured design is the Single Responsibility Principle: each function or module should have one clear, well-defined purpose. This makes the code easier to understand, test, and reuse .","xa":"من مبادئ التصميم الجيد القائم على الوحدات والبرمجة المهيكلة هو مبدأ المسؤولية الواحدة (Single Responsibility): يجب أن يكون لكل دالة أو وحدة غرض واحد واضح ومحدد. وهذا يجعل الكود أسهل في الفهم والاختبار وإعادة الاستخدام ."},{"n":14,"ch":9,"qe":"C++ is a ______ programming language.","qa":"لغة C++ هي لغة برمجة ______.","o":[{"l":"A","e":"Procedural only","a":"إجرائية فقط"},{"l":"B","e":"Object-Oriented only","a":"كائنية التوجه فقط"},{"l":"C","e":"Multi-paradigm","a":"متعددة الأنماط (Multi-paradigm)"},{"l":"D","e":"Assembly","a":"تجميع (Assembly)"}],"c":"C","xe":"C++ is a multi-paradigm language, meaning it supports multiple programming styles, including procedural, object-oriented, and generic programming. It is not limited to a single paradigm.","xa":"لغة C++ هي لغة متعددة الأنماط (Multi-paradigm)، أي أنها تدعم أساليب برمجة متعددة، بما في ذلك البرمجة الإجرائية والكائنية التوجه والبرمجة العامة (Generic). وهي ليست مقصورة على نمط واحد."},{"n":15,"ch":9,"qe":"C++ bridges the gap between:","qa":"تسد لغة C++ الفجوة بين:","o":[{"l":"A","e":"HTML and CSS","a":"HTML وCSS"},{"l":"B","e":"Low-level and high-level programming","a":"البرمجة منخفضة المستوى والبرمجة عالية المستوى"},{"l":"C","e":"Java and Python","a":"Java وPython"},{"l":"D","e":"Operating systems and networks","a":"أنظمة التشغيل والشبكات"}],"c":"B","xe":"C++ is often described as a middle-level language because it combines high-level abstractions (like classes and functions) with low-level features (like direct memory manipulation through pointers), effectively bridging the two levels.","xa":"غالباً ما توصف C++ بأنها لغة متوسطة المستوى لأنها تجمع بين تجريدات عالية المستوى (مثل الفئات والدوال) وميزات منخفضة المستوى (مثل التعامل المباشر مع الذاكرة عبر المؤشرات)، مما يسد الفجوة بين المستويين."},{"n":16,"ch":9,"qe":"Which of the following is NOT listed as a reason for using C++ for structured programming?","qa":"أي مما يلي ليس مذكوراً كسبب لاستخدام C++ للبرمجة المهيكلة؟","o":[{"l":"A","e":"Close to hardware","a":"قريبة من العتاد"},{"l":"B","e":"Speed and efficiency","a":"السرعة والكفاءة"},{"l":"C","e":"Strong syntax","a":"صياغة قوية"},{"l":"D","e":"Automatic garbage collection","a":"جمع القمامة التلقائي (Automatic Garbage Collection)"}],"c":"D","xe":"C++ is valued for its performance, efficiency, and close-to-hardware nature. However, unlike languages such as Java or Python, standard C++ does not provide automatic garbage collection; memory management is largely manual.","xa":"تُقدَّر C++ لأدائها وكفاءتها وقربها من العتاد. لكن على عكس لغات مثل Java أو Python، لا توفر C++ القياسية جمع القمامة التلقائي (Automatic Garbage Collection)؛ فإدارة الذاكرة تتم يدوياً إلى حد كبير."},{"n":17,"ch":9,"qe":"The standard entry point of a C++ program is:","qa":"نقطة الدخول القياسية لبرنامج C++ هي:","o":[{"l":"A","e":"start()","a":"الدالة start()"},{"l":"B","e":"execute()","a":"الدالة execute()"},{"l":"C","e":"main()","a":"الدالة main()"},{"l":"D","e":"init()","a":"الدالة init()"}],"c":"C","xe":"Every C++ program must have exactly one `main` function. It is the designated starting point from which program execution begins .","xa":"يجب أن يحتوي كل برنامج C++ على دالة `main` واحدة فقط. وهي نقطة البداية المحددة التي يبدأ منها تنفيذ البرنامج ."},{"n":18,"ch":9,"qe":"In C++ structured style, the primary means of modularizing code is:","qa":"في أسلوب C++ المهيكل، الوسيلة الأساسية لتقسيم الكود إلى وحدات هي:","o":[{"l":"A","e":"Macros","a":"وحدات الماكرو (Macros)"},{"l":"B","e":"Functions","a":"الدوال (Functions)"},{"l":"C","e":"Classes","a":"الفئات (Classes)"},{"l":"D","e":"Namespaces","a":"مساحات الأسماء (Namespaces)"}],"c":"B","xe":"In structured (procedural) programming with C++, the primary tool for modularization is the function. Functions are used to break a program into smaller, independent, and reusable blocks of code .","xa":"في البرمجة المهيكلة (الإجرائية) باستخدام C++، الأداة الأساسية للتقسيم إلى وحدات هي الدالة (Function). تُستخدم الدوال لتقسيم البرنامج إلى كتل برمجية أصغر ومستقلة وقابلة لإعادة الاستخدام ."},{"n":19,"ch":9,"qe":"\"Plan the solution → Write the code → Compile → Test\" describes the:","qa":"\"خطط للحل ← اكتب الكود ← ترجم ← اختبر\" يصف:","o":[{"l":"A","e":"C++ syntax rules","a":"قواعد صياغة C++"},{"l":"B","e":"Development process for structured programming","a":"عملية تطوير البرمجة المهيكلة"},{"l":"C","e":"Debugging only","a":"تصحيح الأخطاء فقط"},{"l":"D","e":"Runtime environment","a":"بيئة وقت التشغيل"}],"c":"B","xe":"This sequence outlines the fundamental software development lifecycle for structured programming: first design the algorithm, then implement it in code, compile it into an executable, and finally test it to ensure correctness.","xa":"يوضح هذا التسلسل دورة حياة تطوير البرمجيات الأساسية للبرمجة المهيكلة: أولاً تصميم الخوارزمية، ثم تنفيذها في الكود، ثم ترجمتها إلى ملف تنفيذي، وأخيراً اختبارها للتأكد من صحتها."},{"n":20,"ch":9,"qe":"Which tool is NOT needed to start structured programming in C++?","qa":"أي أداة ليست ضرورية لبدء البرمجة المهيكلة بلغة C++؟","o":[{"l":"A","e":"Compiler","a":"المترجم (Compiler)"},{"l":"B","e":"Text Editor","a":"محرر النصوص (Text Editor)"},{"l":"C","e":"Web Server","a":"خادم الويب (Web Server)"}],"c":"C","xe":"To write and run a C++ program, you need a text editor (to write the code) and a compiler (to translate it into machine code). A web server is irrelevant for developing standalone structured programs.","xa":"لكتابة وتشغيل برنامج C++، تحتاج إلى محرر نصوص (لكتابة الكود) ومترجم (لترجمته إلى لغة الآلة). أما خادم الويب (Web Server) فلا علاقة له بتطوير البرامج المهيكلة المستقلة."},{"n":21,"ch":9,"qe":"A common beginner mistake is:","qa":"من الأخطاء الشائعة للمبتدئين:","o":[{"l":"A","e":"Using indentation","a":"استخدام الإزاحة (Indentation)"},{"l":"B","e":"Skipping comments","a":"إهمال التعليقات (Skipping Comments)"},{"l":"C","e":"Planning first","a":"التخطيط أولاً"},{"l":"D","e":"Using functions","a":"استخدام الدوال"}],"c":"B","xe":"While not using comments won't break a program, it severely harms readability and maintainability, which are key goals of structured programming. Beginners often neglect to document their code, making it harder for themselves and others to understand later.","xa":"رغم أن عدم استخدام التعليقات لن يعطل البرنامج، إلا أنه يضر بشدة بقابلية القراءة والصيانة، وهما هدفان أساسيان للبرمجة المهيكلة. غالباً ما يهمل المبتدئون توثيق الكود، مما يجعل فهمه أصعب عليهم وعلى الآخرين لاحقاً."},{"n":22,"ch":9,"qe":"Overusing ______ variables can lead to unexpected behavior.","qa":"الإفراط في استخدام المتغيرات ______ يمكن أن يؤدي إلى سلوك غير متوقع.","o":[{"l":"A","e":"Local","a":"المحلية (Local)"},{"l":"B","e":"Global","a":"العامة (Global)"},{"l":"C","e":"Static","a":"الساكنة (Static)"},{"l":"D","e":"Reference","a":"المرجعية (Reference)"}],"c":"B","xe":"Global variables are accessible from any part of the program, so they can be modified unexpectedly by different functions. Overusing them makes it difficult to track data changes and debug errors, leading to unpredictable behavior.","xa":"المتغيرات العامة (Global Variables) يمكن الوصول إليها من أي جزء في البرنامج، لذا يمكن تعديلها بشكل غير متوقع بواسطة دوال مختلفة. الإفراط في استخدامها يجعل تتبع تغيرات البيانات وتصحيح الأخطاء صعباً، مما يؤدي إلى سلوك غير متوقع."},{"n":23,"ch":9,"qe":"The program segment: input → process → output shows which principle?","qa":"مقطع البرنامج: الإدخال ← المعالجة ← الإخراج يوضح أي مبدأ؟","o":[{"l":"A","e":"Sequence","a":"التتابع (Sequence)"},{"l":"B","e":"Selection","a":"الاختيار (Selection)"},{"l":"C","e":"Iteration","a":"التكرار (Iteration)"},{"l":"D","e":"Recursion","a":"الاستدعاء الذاتي (Recursion)"}],"c":"A","xe":"This three-step pattern is the classic illustration of the sequence control structure, where each step is executed in a fixed, linear order: first get the input, then process it, and finally produce the output.","xa":"هذا النمط الثلاثي هو التوضيح الكلاسيكي لهيكل التتابع (Sequence)، حيث تُنفذ كل خطوة بترتيب خطي وثابت: أولاً الحصول على الإدخال، ثم معالجته، وأخيراً إنتاج الإخراج."},{"n":24,"ch":9,"qe":"Structured programming emerged widely in which decade?","qa":"ظهرت البرمجة المهيكلة على نطاق واسع في أي عقد؟","o":[{"l":"A","e":"1950s","a":"الخمسينيات"},{"l":"B","e":"1960s","a":"الستينيات"},{"l":"C","e":"1970s","a":"السبعينيات"},{"l":"D","e":"1990s","a":"التسعينيات"}],"c":"C","xe":"The structured programming movement gained significant traction in the 1970s, largely due to influential work by Edsger Dijkstra and others who advocated for abandoning unstructured `goto`-based code in favor of logical control structures.","xa":"اكتسبت حركة البرمجة المهيكلة زخماً كبيراً في السبعينيات (1970s)، وذلك بفضل أعمال مؤثرة مثل أعمال إدسجر ديكسترا وغيره ممن دعوا إلى التخلي عن الكود غير المهيكل القائم على `goto` لصالح هياكل التحكم المنطقية."},{"n":25,"ch":9,"qe":"Which is an IDE for C++?","qa":"أي مما يلي يُعد بيئة تطوير متكاملة (IDE) للغة C++؟","o":[{"l":"A","e":"Visual Studio","a":"فيجوال ستوديو (Visual Studio)"},{"l":"B","e":"Photoshop","a":"فوتوشوب (Photoshop)"},{"l":"C","e":"Blender","a":"بليندر (Blender)"},{"l":"D","e":"PowerPoint","a":"باوربوينت (PowerPoint)"}],"c":"A","xe":"Visual Studio is a comprehensive Integrated Development Environment (IDE) that provides tools for writing, compiling, and debugging C++ code. Photoshop, Blender, and PowerPoint are applications for graphics, 3D modeling, and presentations, respectively.","xa":"فيجوال ستوديو (Visual Studio) هي بيئة تطوير متكاملة (IDE) شاملة توفر أدوات لكتابة وترجمة وتصحيح كود C++. أما فوتوشوب وبليندر وباوربوينت فهي تطبيقات للرسوميات والنمذجة ثلاثية الأبعاد والعروض التقديمية على التوالي."},{"n":26,"ch":9,"qe":"\"Reusability\" in structured programming means:","qa":"\"قابلية إعادة الاستخدام\" (Reusability) في البرمجة المهيكلة تعني:","o":[{"l":"A","e":"Code can only run once","a":"يمكن تشغيل الكود مرة واحدة فقط"},{"l":"B","e":"Code can be reused in different projects","a":"يمكن إعادة استخدام الكود في مشاريع مختلفة"},{"l":"C","e":"Variables can be global","a":"يمكن أن تكون المتغيرات عامة"},{"l":"D","e":"Memory is automatically reused","a":"يتم إعادة استخدام الذاكرة تلقائياً"}],"c":"B","xe":"Reusability refers to the ability to use existing code (like functions or modules) in new contexts or projects without having to rewrite it from scratch. This is a major benefit of modular, structured design.","xa":"تشير قابلية إعادة الاستخدام (Reusability) إلى القدرة على استخدام كود موجود (مثل الدوال أو الوحدات) في سياقات أو مشاريع جديدة دون الحاجة إلى إعادة كتابته من الصفر. وهذا ميزة رئيسية للتصميم المهيكل القائم على الوحدات."},{"n":27,"ch":9,"qe":"Which control structure repeats a block until a condition is met?","qa":"أي هيكل تحكم يكرر كتلة حتى يتم استيفاء شرط؟","o":[{"l":"A","e":"Selection","a":"الاختيار (Selection)"},{"l":"B","e":"Iteration","a":"التكرار (Iteration)"},{"l":"C","e":"Sequence","a":"التتابع (Sequence)"},{"l":"D","e":"Encapsulation","a":"التغليف (Encapsulation)"}],"c":"B","xe":"Iteration (or repetition) is the control structure that allows a block of code to be executed repeatedly as long as a specified condition remains true, or until a condition is met.","xa":"التكرار (Iteration) هو هيكل التحكم الذي يسمح بتنفيذ كتلة من الكود بشكل متكرر طالما ظل شرط معين صحيحاً، أو حتى يتم استيفاء شرط معين."},{"n":28,"ch":9,"qe":"Breaking a problem into input, process, and output steps is an example of:","qa":"تقسيم مشكلة إلى خطوات الإدخال والمعالجة والإخراج هو مثال على:","o":[{"l":"A","e":"Top-Down Design","a":"التصميم من الأعلى إلى الأسفل (Top-Down Design)"},{"l":"B","e":"Bottom-Up Implementation","a":"التنفيذ من الأسفل إلى الأعلى (Bottom-Up Implementation)"},{"l":"C","e":"Debugging","a":"تصحيح الأخطاء (Debugging)"},{"l":"D","e":"OOP","a":"البرمجة الكائنية التوجه (OOP)"}],"c":"A","xe":"Top-down design involves breaking a problem into major logical components. The input-process-output (IPO) model is a classic top-down approach for structuring a program's overall logic.","xa":"يتضمن التصميم من الأعلى إلى الأسفل (Top-Down Design) تقسيم المشكلة إلى مكونات منطقية رئيسية. ويُعد نموذج الإدخال-المعالجة-الإخراج (IPO) نهجاً كلاسيكياً من الأعلى إلى الأسفل لهيكلة المنطق العام للبرنامج."},{"n":29,"ch":9,"qe":"Using indentation and formatting makes code:","qa":"استخدام الإزاحة والتنسيق يجعل الكود:","o":[{"l":"A","e":"Slower","a":"أبطأ"},{"l":"B","e":"More readable","a":"أكثر قابلية للقراءة"},{"l":"C","e":"Random","a":"عشوائياً"},{"l":"D","e":"Encrypted","a":"مشفراً"}],"c":"B","xe":"Indentation and consistent formatting visually organize the code's structure, making it significantly easier for humans to read and understand. They have no effect on the program's execution speed.","xa":"الإزاحة (Indentation) والتنسيق المتسق ينظمان بنية الكود بصرياً، مما يجعله أسهل بكثير للقراءة والفهم من قبل البشر. وليس لهما أي تأثير على سرعة تنفيذ البرنامج."},{"n":30,"ch":9,"qe":"C++ allows structured programming primarily by supporting:","qa":"تسمح C++ بالبرمجة المهيكلة بشكل أساسي من خلال دعمها لـ:","o":[{"l":"A","e":"Functions, control statements, loops, arrays","a":"الدوال وعبارات التحكم والحلقات والمصفوفات"},{"l":"B","e":"Only classes","a":"الفئات فقط"},{"l":"C","e":"Only macros","a":"وحدات الماكرو فقط"},{"l":"D","e":"Only assembly-level instructions","a":"تعليمات مستوى التجميع فقط"}],"c":"A","xe":"C++ provides all the necessary constructs for structured programming: functions for modularity, control statements (if, switch) for selection, loops (for, while, do-while) for iteration, and arrays for organizing data.","xa":"توفر C++ جميع البُنى اللازمة للبرمجة المهيكلة: الدوال (Functions) للتقسيم إلى وحدات، وعبارات التحكم (مثل if وswitch) للاختيار، والحلقات (مثل for وwhile وdo-while) للتكرار، والمصفوفات (Arrays) لتنظيم البيانات."},{"n":1,"ch":10,"qe":"What is C++ syntax comparable to in human language?","qa":"بماذا تُقارن صياغة C++ (C++ Syntax) في اللغة البشرية؟","o":[{"l":"A","e":"Vocabulary","a":"المفردات"},{"l":"B","e":"Grammar","a":"القواعد النحوية (Grammar)"},{"l":"C","e":"Spelling","a":"التهجئة"},{"l":"D","e":"Accent","a":"اللكنة"}],"c":"B","xe":"Just as grammar rules define how words are combined to form correct sentences, C++ syntax is the set of rules that defines how code must be structured to be valid and understood by the compiler.","xa":"كما تحدد القواعد النحوية كيفية دمج الكلمات لتكوين جمل صحيحة، فإن صياغة C++ (Syntax) هي مجموعة القواعد التي تحدد كيفية هيكلة الكود ليكون صالحاً ومفهوماً بواسطة المترجم (Compiler)."},{"n":2,"ch":10,"qe":"A missing semicolon in C++ usually causes:","qa":"عادةً ما يؤدي فقدان الفاصلة المنقوطة (Semicolon) في C++ إلى:","o":[{"l":"A","e":"Warning only","a":"تحذير فقط"},{"l":"B","e":"Compilation error","a":"خطأ في الترجمة (Compilation Error)"},{"l":"C","e":"No problem","a":"لا مشكلة"},{"l":"D","e":"Program crash at runtime","a":"انهيار البرنامج أثناء التشغيل"}],"c":"B","xe":"In C++, most statements must end with a semicolon. A missing semicolon violates the language's syntax rules, causing the compiler to generate an error and fail to produce an executable.","xa":"في C++، يجب أن تنتهي معظم العبارات بفاصلة منقوطة (Semicolon). وفقدانها ينتهك قواعد الصياغة، مما يجعل المترجم (Compiler) يُصدر خطأً ويفشل في إنتاج ملف تنفيذي."},{"n":3,"ch":10,"qe":"Which of these is the correct structure of a basic C++ program?","qa":"أي من هذه يمثل الهيكل الصحيح لبرنامج C++ أساسي؟","o":[{"l":"A","e":"main(); {return 0;}","a":"main(); {return 0;}"},{"l":"B","e":"#include ... int main() { ... }","a":"#include ... int main() { ... }"},{"l":"C","e":"include(iostream) main() { ... }","a":"include(iostream) main() { ... }"},{"l":"D","e":"int main;","a":"int main;"}],"c":"B","xe":"A basic C++ program typically includes header files (like `<iostream>`), defines the `main` function as the entry point, and encloses the program body in curly braces `{}`.","xa":"يتضمن برنامج C++ الأساسي عادةً ملفات رأس (Header Files) مثل `<iostream>`، ويُعرّف دالة `main` كنقطة دخول، ويضع جسم البرنامج بين أقواس معقوفة `{}`."},{"n":4,"ch":10,"qe":"The directive #include <iostream> tells the compiler to:","qa":"توجيه `#include <iostream>` يخبر المترجم بـ:","o":[{"l":"A","e":"Skip standard input/output","a":"تخطي الإدخال/الإخراج القياسي"},{"l":"B","e":"Include the Input/Output Stream library","a":"تضمين مكتبة تدفقات الإدخال/الإخراج"},{"l":"C","e":"Run the program","a":"تشغيل البرنامج"},{"l":"D","e":"Compile faster","a":"الترجمة بشكل أسرع"}],"c":"B","xe":"The `#include` directive is a preprocessor command that includes the contents of another file. `<iostream>` is the standard library header for input/output streams, necessary for using `cin` and `cout`.","xa":"توجيه `#include` هو أمر معالج أولي (Preprocessor) يضم محتويات ملف آخر. و`<iostream>` هو ملف الرأس للمكتبة القياسية لتدفقات الإدخال/الإخراج، وهو ضروري لاستخدام `cin` و`cout`."},{"n":5,"ch":10,"qe":"The line using namespace std; allows you to:","qa":"السطر `using namespace std;` يسمح لك بـ:","o":[{"l":"A","e":"Avoid writing std:: before standard objects","a":"تجنب كتابة `std::` قبل الكائنات القياسية"},{"l":"B","e":"Create your own library","a":"إنشاء مكتبتك الخاصة"},{"l":"C","e":"Skip the main function","a":"تخطي دالة main"},{"l":"D","e":"End the program","a":"إنهاء البرنامج"}],"c":"A","xe":"The `std` namespace contains all the standard library features. The `using namespace std;` statement brings these names into the current scope, so you can write `cout` instead of `std::cout`.","xa":"تحتوي مساحة الأسماء `std` على جميع ميزات المكتبة القياسية. وعبارة `using namespace std;` تُدخل هذه الأسماء إلى النطاق الحالي، مما يسمح لك بكتابة `cout` بدلاً من `std::cout`."},{"n":6,"ch":10,"qe":"Every C++ program must have exactly one:","qa":"يجب أن يحتوي كل برنامج C++ على واحد بالضبط من:","o":[{"l":"A","e":"Class","a":"فئة (Class)"},{"l":"B","e":"main() function","a":"دالة main()"},{"l":"C","e":"Header file","a":"ملف رأس (Header File)"},{"l":"D","e":"Using statement","a":"عبارة using"}],"c":"B","xe":"The `main` function is the designated entry point for every C++ program. Execution always begins here, and a program cannot run without it.","xa":"دالة `main` هي نقطة الدخول المحددة لكل برنامج C++. يبدأ التنفيذ دائماً من هنا، ولا يمكن للبرنامج أن يعمل بدونها."},{"n":7,"ch":10,"qe":"The curly braces {} in C++ are used to:","qa":"الأقواس المعقوفة `{}` في C++ تُستخدم لـ:","o":[{"l":"A","e":"Group a block of code","a":"تجميع كتلة من الكود"},{"l":"B","e":"Comment a section","a":"التعليق على قسم"},{"l":"C","e":"Denote a string","a":"الإشارة إلى سلسلة نصية"},{"l":"D","e":"Denote a header","a":"الإشارة إلى ملف رأس"}],"c":"A","xe":"Curly braces `{}` define a block or scope. They group a sequence of statements together, such as the body of a function, a loop, or a conditional statement.","xa":"تُعرّف الأقواس المعقوفة `{}` كتلة أو نطاقاً (Scope). وهي تجمع تسلسلًا من العبارات معاً، مثل جسم دالة أو حلقة أو عبارة شرطية."},{"n":8,"ch":10,"qe":"Which of the following prints \"Hello\" on the screen?","qa":"أي مما يلي يطبع \"Hello\" على الشاشة؟","o":[{"l":"A","e":"cout << Hello;","a":"cout << Hello;"},{"l":"B","e":"cout << \"Hello\";","a":"cout << \"Hello\";"},{"l":"C","e":"cout(Hello);","a":"cout(Hello);"},{"l":"D","e":"echo \"Hello\";","a":"echo \"Hello\";"}],"c":"B","xe":"`cout` is the standard output stream. The `<<` operator is used to insert data. String literals must be enclosed in double quotes, so `\"Hello\"` is correct.","xa":"`cout` هو تدفق الإخراج القياسي. ويُستخدم المعامل `<<` لإدراج البيانات. يجب وضع السلاسل النصية (String Literals) بين علامتي تنصيص مزدوجتين، لذا `\"Hello\"` هو الصحيح."},{"n":9,"ch":10,"qe":"The endl manipulator in C++ is used for:","qa":"يُستخدم المُعالج `endl` في C++ لـ:","o":[{"l":"A","e":"Ending the program","a":"إنهاء البرنامج"},{"l":"B","e":"Starting a new line","a":"بدء سطر جديد"},{"l":"C","e":"Erasing data","a":"مسح البيانات"},{"l":"D","e":"Ending a loop","a":"إنهاء حلقة"}],"c":"B","xe":"`endl` is a manipulator that inserts a newline character into the output stream and flushes the stream. It does not end the program or a loop.","xa":"`endl` هو مُعالج (Manipulator) يُدرج حرف سطر جديد في تدفق الإخراج ويُفرّغ التدفق. وهو لا ينهي البرنامج ولا الحلقة."},{"n":10,"ch":10,"qe":"C++ is case-sensitive. This means:","qa":"C++ حساسة لحالة الأحرف (Case-Sensitive). هذا يعني:","o":[{"l":"A","e":"MAIN and main are same","a":"MAIN وmain نفس الشيء"},{"l":"B","e":"main and Main are different","a":"main وMain مختلفان"},{"l":"C","e":"Keywords can be written in any case","a":"يمكن كتابة الكلمات المفتاحية بأي حالة"},{"l":"D","e":"Only variables are case-insensitive","a":"المتغيرات فقط غير حساسة لحالة الأحرف"}],"c":"B","xe":"C++ is case-sensitive, meaning uppercase and lowercase letters are considered distinct. Therefore, `main` and `Main` are different identifiers.","xa":"C++ حساسة لحالة الأحرف، مما يعني أن الأحرف الكبيرة والصغيرة تُعتبر مختلفة. لذلك، `main` و`Main` هما معرفان مختلفان."},{"n":11,"ch":10,"qe":"Most C++ statements must end with:","qa":"يجب أن تنتهي معظم عبارات C++ بـ:","o":[{"l":"A","e":":","a":"النقطتان (:)"},{"l":"B","e":";","a":"الفاصلة المنقوطة (;)"},{"l":"C","e":"//","a":"الشرطة المائلة المزدوجة (//)"},{"l":"D","e":".","a":"النقطة (.)"}],"c":"B","xe":"In C++, a semicolon `;` is used to terminate most statements. It is a fundamental part of the syntax that tells the compiler where one statement ends and the next begins.","xa":"في C++، تُستخدم الفاصلة المنقوطة `;` لإنهاء معظم العبارات. وهي جزء أساسي من الصياغة يخبر المترجم أين تنتهي عبارة وتبدأ أخرى."},{"n":12,"ch":10,"qe":"Which of the following is ignored by the compiler?","qa":"أي مما يلي يتم تجاهله بواسطة المترجم (Compiler)؟","o":[{"l":"A","e":"Keywords","a":"الكلمات المفتاحية (Keywords)"},{"l":"B","e":"Semicolons","a":"الفواصل المنقوطة (Semicolons)"},{"l":"C","e":"Comments","a":"التعليقات (Comments)"},{"l":"D","e":"Curly braces","a":"الأقواس المعقوفة (Curly Braces)"}],"c":"C","xe":"Comments are for human readers to understand the code. The compiler ignores them completely during compilation, so they do not affect the program's behavior.","xa":"التعليقات (Comments) مخصصة للقراء البشر لفهم الكود. يتجاهلها المترجم تماماً أثناء الترجمة، لذا فهي لا تؤثر على سلوك البرنامج."},{"n":13,"ch":10,"qe":"Which symbol is used for a single-line comment in C++?","qa":"أي رمز يُستخدم لتعليق من سطر واحد في C++؟","o":[{"l":"A","e":"//","a":"الشرطة المائلة المزدوجة (//)"},{"l":"B","e":"/* */","a":"الشرطة المائلة والنجمة (/* */)"},{"l":"C","e":"#","a":"علامة المربع (#)"},{"l":"D","e":"-","a":"الشرطة (-)"}],"c":"A","xe":"The `//` symbol begins a single-line comment, which extends to the end of the line. The `/* */` syntax is used for multi-line comments.","xa":"يبدأ الرمز `//` تعليقاً من سطر واحد، يمتد إلى نهاية السطر. أما الصياغة `/* */` فتُستخدم للتعليقات متعددة الأسطر."},{"n":14,"ch":10,"qe":"A multi-line comment begins and ends with:","qa":"يبدأ وينتهي التعليق متعدد الأسطر بـ:","o":[{"l":"A","e":"/* and */","a":"/* و */"},{"l":"B","e":"// and //","a":"// و //"},{"l":"C","e":"<< and >>","a":"<< و >>"},{"l":"D","e":"{{ and }}","a":"{{ و }}"}],"c":"A","xe":"A multi-line comment starts with `/*` and ends with `*/`. Everything between these delimiters is ignored by the compiler.","xa":"يبدأ التعليق متعدد الأسطر بـ `/*` وينتهي بـ `*/`. يتم تجاهل كل شيء بين هذين المحددين بواسطة المترجم."},{"n":15,"ch":10,"qe":"A variable in C++ is:","qa":"المتغير في C++ هو:","o":[{"l":"A","e":"A container for data","a":"حاوية للبيانات"},{"l":"B","e":"A keyword","a":"كلمة مفتاحية"},{"l":"C","e":"A header file","a":"ملف رأس"},{"l":"D","e":"A comment","a":"تعليق"}],"c":"A","xe":"A variable is a named storage location in memory that holds a value of a specific data type. It acts as a container for data that can be changed during program execution.","xa":"المتغير (Variable) هو موقع تخزين مسمى في الذاكرة يحمل قيمة من نوع بيانات معين. وهو يعمل كحاوية للبيانات التي يمكن تغييرها أثناء تنفيذ البرنامج."},{"n":16,"ch":10,"qe":"Which of these is a valid identifier?","qa":"أي من هذه يُعد معرفاً (Identifier) صالحاً؟","o":[{"l":"A","e":"2value","a":"2value"},{"l":"B","e":"total_price","a":"total_price"},{"l":"C","e":"price$","a":"price$"},{"l":"D","e":"while","a":"while"}],"c":"B","xe":"A valid C++ identifier must start with a letter or underscore and can contain letters, digits, and underscores. `2value` starts with a digit, `price$` contains an invalid character `$`, and `while` is a reserved keyword.","xa":"يجب أن يبدأ المعرف (Identifier) الصالح في C++ بحرف أو شرطة سفلية ويمكن أن يحتوي على حروف وأرقام وشرطات سفلية. `2value` يبدأ برقم، و`price$` يحتوي على رمز غير صالح `$`، و`while` كلمة مفتاحية محجوزة."},{"n":17,"ch":10,"qe":"Which of these is NOT a valid identifier?","qa":"أي من هذه ليس معرفاً (Identifier) صالحاً؟","o":[{"l":"A","e":"myValue","a":"myValue"},{"l":"B","e":"_count","a":"_count"},{"l":"C","e":"total2","a":"total2"},{"l":"D","e":"for","a":"for"}],"c":"D","xe":"`for` is a reserved keyword in C++ used to define a loop. Keywords cannot be used as identifiers for variables, functions, or other entities.","xa":"`for` هي كلمة مفتاحية محجوزة في C++ تُستخدم لتعريف حلقة. لا يمكن استخدام الكلمات المفتاحية كمعرفات للمتغيرات أو الدوال أو غيرها."},{"n":18,"ch":10,"qe":"Choose the correct declaration of an integer variable named age:","qa":"اختر التعريف الصحيح لمتغير صحيح (Integer) اسمه age:","o":[{"l":"A","e":"age int;","a":"age int;"},{"l":"B","e":"int age;","a":"int age;"},{"l":"C","e":"integer age;","a":"integer age;"},{"l":"D","e":"var age;","a":"var age;"}],"c":"B","xe":"The correct syntax for declaring a variable in C++ is to write the data type first, followed by the variable name. `int age;` declares an integer variable named `age`.","xa":"الصياغة الصحيحة لتعريف متغير في C++ هي كتابة نوع البيانات أولاً، يليه اسم المتغير. `int age;` تعرّف متغيراً صحيحاً اسمه `age`."},{"n":19,"ch":10,"qe":"Which of these is the correct declaration and initialization of a float variable?","qa":"أي من هذه يمثل التعريف والتهيئة الصحيحين لمتغير عشري (Float)؟","o":[{"l":"A","e":"float price = 4.99;","a":"float price = 4.99;"},{"l":"B","e":"price float = 4.99;","a":"price float = 4.99;"},{"l":"C","e":"float = price 4.99;","a":"float = price 4.99;"},{"l":"D","e":"price = float 4.99;","a":"price = float 4.99;"}],"c":"A","xe":"The correct syntax is `data_type variable_name = initial_value;`. Therefore, `float price = 4.99;` correctly declares a float variable named `price` and initializes it with `4.99`.","xa":"الصياغة الصحيحة هي `نوع_البيانات اسم_المتغير = القيمة_الأولية;`. لذلك، `float price = 4.99;` تعرّف بشكل صحيح متغيراً عشرياً اسمه `price` وتهيئته بالقيمة `4.99`."},{"n":20,"ch":10,"qe":"The size of an int on most systems is typically:","qa":"حجم النوع `int` على معظم الأنظمة يكون عادةً:","o":[{"l":"A","e":"1 byte","a":"1 بايت"},{"l":"B","e":"2 bytes","a":"2 بايت"},{"l":"C","e":"4 bytes","a":"4 بايت"},{"l":"D","e":"8 bytes","a":"8 بايت"}],"c":"C","xe":"On most modern systems, an `int` is 4 bytes (32 bits). This is the standard size for the default integer type in C++.","xa":"على معظم الأنظمة الحديثة، يكون النوع `int` بحجم 4 بايت (32 بت). وهذا هو الحجم القياسي لنوع العدد الصحيح الافتراضي في C++."},{"n":21,"ch":10,"qe":"Which data type holds single characters?","qa":"أي نوع بيانات يحمل أحرفاً مفردة؟","o":[{"l":"A","e":"char","a":"حرف (char)"},{"l":"B","e":"bool","a":"منطقي (bool)"},{"l":"C","e":"string","a":"سلسلة نصية (string)"},{"l":"D","e":"int","a":"عدد صحيح (int)"}],"c":"A","xe":"The `char` data type is used to store a single character, such as a letter or a symbol. It typically occupies 1 byte of memory.","xa":"يُستخدم نوع البيانات `char` لتخزين حرف واحد، مثل حرف أو رمز. ويشغل عادةً بايت واحد من الذاكرة."},{"n":22,"ch":10,"qe":"The bool data type stores:","qa":"نوع البيانات `bool` يخزن:","o":[{"l":"A","e":"Text","a":"نص"},{"l":"B","e":"Decimal numbers","a":"أعداد عشرية"},{"l":"C","e":"True or false values","a":"قيم صحيح أو خطأ"},{"l":"D","e":"Characters","a":"أحرف"}],"c":"C","xe":"The `bool` data type is a logical type that can hold only one of two possible values: `true` or `false`. It is used for conditional expressions and logical operations.","xa":"نوع البيانات `bool` هو نوع منطقي يمكنه حمل واحدة من قيمتين محتملتين فقط: `true` أو `false`. ويُستخدم للتعبيرات الشرطية والعمليات المنطقية."},{"n":23,"ch":10,"qe":"To use the string class, you must include which header?","qa":"لاستخدام فئة `string`، يجب تضمين أي ملف رأس؟","o":[{"l":"A","e":"<string>","a":"<string>"},{"l":"B","e":"<iostream>","a":"<iostream>"},{"l":"C","e":"<cmath>","a":"<cmath>"},{"l":"D","e":"<cstdlib>","a":"<cstdlib>"}],"c":"A","xe":"The `std::string` class is defined in the `<string>` header file. To use string objects, you must include this header.","xa":"يتم تعريف فئة `std::string` في ملف الرأس `<string>`. لاستخدام كائنات السلسلة النصية، يجب تضمين ملف الرأس هذا."},{"n":24,"ch":10,"qe":"Which statement correctly takes input for a variable named age?","qa":"أي عبارة تأخذ الإدخال بشكل صحيح لمتغير اسمه age؟","o":[{"l":"A","e":"cin << age;","a":"cin << age;"},{"l":"B","e":"cin >> age;","a":"cin >> age;"},{"l":"C","e":"cin = age;","a":"cin = age;"},{"l":"D","e":"input age;","a":"input age;"}],"c":"B","xe":"The `cin` object is the standard input stream. The `>>` operator is used to extract data from `cin` and store it in a variable, so `cin >> age;` is correct.","xa":"الكائن `cin` هو تدفق الإدخال القياسي. ويُستخدم المعامل `>>` لاستخراج البيانات من `cin` وتخزينها في متغير، لذا `cin >> age;` هو الصحيح."},{"n":25,"ch":10,"qe":"Which of these declares a constant named PI with value 3.14159?","qa":"أي من هذه يعرّف ثابتاً (Constant) اسمه PI بالقيمة 3.14159؟","o":[{"l":"A","e":"double PI = 3.14159","a":"double PI = 3.14159"},{"l":"B","e":"const double PI = 3.14159","a":"const double PI = 3.14159"},{"l":"C","e":"#include PI 3.14159;","a":"#include PI 3.14159;"},{"l":"D","e":"PI = 3.14159 const;","a":"PI = 3.14159 const;"}],"c":"B","xe":"The `const` keyword is used to declare a variable whose value cannot be changed after initialization. `const double PI = 3.14159;` correctly declares a constant.","xa":"تُستخدم الكلمة المفتاحية `const` لتعريف متغير لا يمكن تغيير قيمته بعد التهيئة. `const double PI = 3.14159;` تعرّف ثابتاً بشكل صحيح."},{"n":26,"ch":10,"qe":"If you try to reassign a const variable, the compiler will:","qa":"إذا حاولت إعادة تعيين قيمة لمتغير `const`، فإن المترجم سـ:","o":[{"l":"A","e":"Allow it","a":"يسمح بذلك"},{"l":"B","e":"Throw an error","a":"يُصدر خطأً"},{"l":"C","e":"Ignore the change","a":"يتجاهل التغيير"},{"l":"D","e":"Reset the variable","a":"يعيد تعيين المتغير"}],"c":"B","xe":"The `const` qualifier makes a variable read-only. Any attempt to modify it after initialization results in a compilation error.","xa":"المُحدد `const` يجعل المتغير للقراءة فقط. أي محاولة لتعديله بعد التهيئة تؤدي إلى خطأ في الترجمة."},{"n":27,"ch":10,"qe":"Which operator is used to output data to the screen?","qa":"أي معامل يُستخدم لإخراج البيانات إلى الشاشة؟","o":[{"l":"A","e":">>","a":">>"},{"l":"B","e":"<<","a":"<<"},{"l":"C","e":"==","a":"=="},{"l":"D","e":"=","a":"="}],"c":"B","xe":"The `<<` operator is the stream insertion operator, used with `cout` to send data to the standard output (screen).","xa":"المعامل `<<` هو معامل إدراج التدفق (Stream Insertion Operator)، ويُستخدم مع `cout` لإرسال البيانات إلى الإخراج القياسي (الشاشة)."},{"n":28,"ch":10,"qe":"Which operator is used to input data from the keyboard?","qa":"أي معامل يُستخدم لإدخال البيانات من لوحة المفاتيح؟","o":[{"l":"A","e":"<<","a":"<<"},{"l":"B","e":">>","a":">>"},{"l":"C","e":"==","a":"=="},{"l":"D","e":"=","a":"="}],"c":"B","xe":"The `>>` operator is the stream extraction operator, used with `cin` to read data from the standard input (keyboard).","xa":"المعامل `>>` هو معامل استخراج التدفق (Stream Extraction Operator)، ويُستخدم مع `cin` لقراءة البيانات من الإدخال القياسي (لوحة المفاتيح)."},{"n":29,"ch":10,"qe":"A string literal in C++ is enclosed in:","qa":"تُحاط السلسلة النصية (String Literal) في C++ بـ:","o":[{"l":"A","e":"'","a":"' (علامة تنصيص مفردة)"},{"l":"B","e":"\"","a":"\" (علامة تنصيص مزدوجة)"},{"l":"C","e":"{}","a":"{} (أقواس معقوفة)"},{"l":"D","e":"< >","a":"< > (أقواس زاوية)"}],"c":"B","xe":"String literals, such as \"Hello\", are enclosed in double quotes. Single quotes are used for character literals, like 'A'.","xa":"تُحاط السلاسل النصية (String Literals)، مثل \"Hello\"، بعلامات تنصيص مزدوجة. أما علامات التنصيص المفردة فتُستخدم للأحرف (Character Literals)، مثل 'A'."},{"n":30,"ch":10,"qe":"Which of these is NOT covered in this chapter?","qa":"أي من هذه لم يتم تناوله في هذا الفصل؟","o":[{"l":"A","e":"Variables","a":"المتغيرات"},{"l":"B","e":"Comments","a":"التعليقات"},{"l":"C","e":"Polymorphism","a":"تعدد الأشكال (Polymorphism)"},{"l":"D","e":"Input/Output","a":"الإدخال/الإخراج"}],"c":"C","xe":"The basic C++ syntax topics cover fundamental concepts like variables, comments, and input/output. Polymorphism is an advanced concept associated with object-oriented programming, not basic syntax.","xa":"تغطي أساسيات هذا الفصل مفاهيم أساسية مثل المتغيرات والتعليقات والإدخال/الإخراج. أما تعدد الأشكال (Polymorphism) فهو مفهوم متقدم يرتبط بالبرمجة الكائنية التوجه وليس بالصياغة الأساسية."},{"n":1,"ch":11,"qe":"A data type in C++ tells the compiler:","qa":"نوع البيانات في C++ يخبر المترجم:","o":[{"l":"A","e":"How fast to run the program","a":"مدى سرعة تشغيل البرنامج"},{"l":"B","e":"What kind of data a variable stores","a":"نوع البيانات التي يخزنها المتغير"},{"l":"C","e":"Which header file to include","a":"أي ملف رأس يجب تضمينه"},{"l":"D","e":"How to name a variable","a":"كيفية تسمية المتغير"}],"c":"B","xe":"A data type specifies the kind of data a variable can hold (e.g., integer, floating-point, character) and determines how much memory is allocated and what operations are valid.","xa":"يحدد نوع البيانات نوع البيانات التي يمكن للمتغير حملها (مثل عدد صحيح، عدد عشري، حرف)، ويحدد مقدار الذاكرة المخصصة والعمليات الصالحة."},{"n":2,"ch":11,"qe":"Which of the following is NOT a fundamental (primitive) data type in C++?","qa":"أي مما يلي ليس نوع بيانات أساسي (Primitive) في C++؟","o":[{"l":"A","e":"int","a":"int"},{"l":"B","e":"float","a":"float"},{"l":"C","e":"string","a":"string"},{"l":"D","e":"char","a":"char"}],"c":"C","xe":"`int`, `float`, and `char` are fundamental built-in types. `string` is not a primitive type; it is a class provided by the Standard Library (`std::string`).","xa":"`int` و`float` و`char` هي أنواع أساسية مدمجة. أما `string` فليست نوعاً أساسياً؛ بل هي فئة (Class) توفرها المكتبة القياسية (`std::string`)."},{"n":3,"ch":11,"qe":"The size of a double on most systems is typically:","qa":"حجم النوع `double` على معظم الأنظمة يكون عادةً:","o":[{"l":"A","e":"2 bytes","a":"2 بايت"},{"l":"B","e":"4 bytes","a":"4 بايت"},{"l":"C","e":"8 bytes","a":"8 بايت"},{"l":"D","e":"16 bytes","a":"16 بايت"}],"c":"C","xe":"On most modern systems, a `double` (double-precision floating-point) is 8 bytes (64 bits), providing greater precision than a `float`.","xa":"على معظم الأنظمة الحديثة، يكون النوع `double` (عدد عشري مزدوج الدقة) بحجم 8 بايت (64 بت)، مما يوفر دقة أكبر من `float`."},{"n":4,"ch":11,"qe":"The void type is used for:","qa":"يُستخدم النوع `void` لـ:","o":[{"l":"A","e":"Storing decimal numbers","a":"تخزين الأعداد العشرية"},{"l":"B","e":"Functions that don't return values","a":"الدوال التي لا تُرجع قيماً"},{"l":"C","e":"Arrays only","a":"المصفوفات فقط"},{"l":"D","e":"Comments","a":"التعليقات"}],"c":"B","xe":"The `void` keyword indicates the absence of a value. It is used as the return type for functions that do not return any value to the caller.","xa":"تشير الكلمة المفتاحية `void` إلى غياب القيمة. وتُستخدم كنوع إرجاع للدوال التي لا تُرجع أي قيمة للمستدعي."},{"n":5,"ch":11,"qe":"Which of these is a derived data type?","qa":"أي من هذه يُعد نوع بيانات مشتقاً (Derived)؟","o":[{"l":"A","e":"int","a":"int"},{"l":"B","e":"float","a":"float"},{"l":"C","e":"Array","a":"المصفوفة (Array)"},{"l":"D","e":"char","a":"char"}],"c":"C","xe":"A derived data type is built from fundamental types. Arrays, pointers, references and functions are derived types, while `int`, `float` and `char` are fundamental (built-in) types. So Array is the derived type.","xa":"نوع البيانات المشتق (Derived) يُبنى من الأنواع الأساسية، ومنه المصفوفات (Arrays) والمؤشرات (Pointers) والمراجع (References) والدوال (Functions). أما `int` و`float` و`char` فهي أنواع أساسية (Fundamental). لذلك الإجابة الصحيحة هي المصفوفة."},{"n":6,"ch":11,"qe":"User-defined data types include:","qa":"تشمل أنواع البيانات المعرفة من قبل المستخدم (User-defined):","o":[{"l":"A","e":"Structures, Classes, Enumerations","a":"الهياكل (Structures) والفئات (Classes) والتعدادات (Enumerations)"},{"l":"B","e":"int, float, double","a":"int وfloat وdouble"},{"l":"C","e":"Arrays, Pointers","a":"المصفوفات (Arrays) والمؤشرات (Pointers)"},{"l":"D","e":"Comments","a":"التعليقات"}],"c":"A","xe":"User-defined data types are created by the programmer and include `struct`, `class`, `enum`, and `union`. These are not built-in to the language.","xa":"أنواع البيانات المعرفة من قبل المستخدم (User-defined) ينشئها المبرمج وتشمل `struct` و`class` و`enum` و`union`. وهذه ليست مدمجة في اللغة."},{"n":7,"ch":11,"qe":"A variable is:","qa":"المتغير هو:","o":[{"l":"A","e":"A fixed constant value","a":"قيمة ثابتة غير قابلة للتغيير"},{"l":"B","e":"A named storage location in memory","a":"موقع تخزين مسمى في الذاكرة"},{"l":"C","e":"A keyword","a":"كلمة مفتاحية"},{"l":"D","e":"A compiler directive","a":"توجيه للمترجم"}],"c":"B","xe":"A variable is a symbolic name for a memory location whose value can be changed during program execution.","xa":"المتغير (Variable) هو اسم رمزي لموقع في الذاكرة يمكن تغيير قيمته أثناء تنفيذ البرنامج."},{"n":8,"ch":11,"qe":"Correct format to declare an integer variable named score:","qa":"الصيغة الصحيحة لتعريف متغير صحيح اسمه score:","o":[{"l":"A","e":"score int;","a":"score int;"},{"l":"B","e":"int score;","a":"int score;"},{"l":"C","e":"integer score;","a":"integer score;"},{"l":"D","e":"var score;","a":"var score;"}],"c":"B","xe":"The correct syntax is to write the data type (`int`) first, followed by the variable name (`score`).","xa":"الصياغة الصحيحة هي كتابة نوع البيانات (`int`) أولاً، يليه اسم المتغير (`score`)."},{"n":9,"ch":11,"qe":"Multiple variables of the same type can be declared in one statement. This is:","qa":"يمكن تعريف متغيرات متعددة من نفس النوع في عبارة واحدة. هذا هو:","o":[{"l":"A","e":"Not allowed","a":"غير مسموح"},{"l":"B","e":"Allowed","a":"مسموح"},{"l":"C","e":"Error at runtime","a":"خطأ أثناء التشغيل"},{"l":"D","e":"Obsolete","a":"قديم"}],"c":"B","xe":"C++ allows multiple variable declarations in a single statement, separated by commas, such as `int x = 5, y = 10, z = 15;`.","xa":"تسمح C++ بتعريف متغيرات متعددة في عبارة واحدة، مفصولة بفواصل، مثل `int x = 5, y = 10, z = 15;`."},{"n":10,"ch":11,"qe":"Which is a valid multiple declaration?","qa":"أي مما يلي يُعد تعريفاً متعدداً صالحاً؟","o":[{"l":"A","e":"int x = 5 y = 10 z = 15","a":"int x = 5 y = 10 z = 15"},{"l":"B","e":"int x = 5 y = 10 z = 15;","a":"int x = 5 y = 10 z = 15;"},{"l":"C","e":"int x; int y; int z;","a":"int x; int y; int z;"},{"l":"D","e":"x int, y int, z int;","a":"x int, y int, z int;"}],"c":"C","xe":"Option C correctly declares three separate integer variables. Option A is missing commas and semicolons. Option B is missing commas. Option D has incorrect syntax.","xa":"الخيار C يعرّف بشكل صحيح ثلاثة متغيرات صحيحة منفصلة. الخيار A يفتقد الفواصل والفواصل المنقوطة. الخيار B يفتقد الفواصل. الخيار D له صياغة غير صحيحة."},{"n":11,"ch":11,"qe":"Which variable name is invalid?","qa":"أي اسم متغير غير صالح؟","o":[{"l":"A","e":"totalCount","a":"totalCount"},{"l":"B","e":"index","a":"index"},{"l":"C","e":"2value","a":"2value"},{"l":"D","e":"priceTotal","a":"priceTotal"}],"c":"C","xe":"A valid identifier cannot start with a digit. `2value` begins with the digit '2', making it an invalid variable name.","xa":"لا يمكن للمعرف الصالح أن يبدأ برقم. `2value` يبدأ بالرقم '2'، مما يجعله اسم متغير غير صالح."},{"n":12,"ch":11,"qe":"Which statement about C++ variable names is true?","qa":"أي عبارة عن أسماء المتغيرات في C++ صحيحة؟","o":[{"l":"A","e":"They can start with a digit","a":"يمكن أن تبدأ برقم"},{"l":"B","e":"They cannot use reserved keywords","a":"لا يمكنها استخدام الكلمات المفتاحية المحجوزة"},{"l":"C","e":"They may include $","a":"يمكن أن تتضمن $"},{"l":"D","e":"They may have spaces","a":"يمكن أن تحتوي على مسافات"}],"c":"B","xe":"Variable names (identifiers) cannot be C++ keywords (like `int`, `for`, `while`) because those words are reserved for special purposes in the language.","xa":"لا يمكن أن تكون أسماء المتغيرات (المعرفات) كلمات مفتاحية في C++ (مثل `int` و`for` و`while`) لأن هذه الكلمات محجوزة لأغراض خاصة في اللغة."},{"n":13,"ch":11,"qe":"Variables declared inside a function are:","qa":"المتغيرات المعرفة داخل دالة تكون:","o":[{"l":"A","e":"Global variables","a":"متغيرات عامة (Global)"},{"l":"B","e":"Local variables","a":"متغيرات محلية (Local)"},{"l":"C","e":"Static variables","a":"متغيرات ساكنة (Static)"},{"l":"D","e":"Global constants","a":"ثوابت عامة"}],"c":"B","xe":"Variables declared inside a function have local scope, meaning they are only accessible within that function and exist only while the function is executing.","xa":"المتغيرات المعرفة داخل دالة لها نطاق محلي (Local Scope)، مما يعني أنه يمكن الوصول إليها فقط داخل تلك الدالة وتوجد فقط أثناء تنفيذ الدالة."},{"n":14,"ch":11,"qe":"Variables declared outside all functions are:","qa":"المتغيرات المعرفة خارج جميع الدوال تكون:","o":[{"l":"A","e":"Local variables","a":"متغيرات محلية (Local)"},{"l":"B","e":"Global variables","a":"متغيرات عامة (Global)"},{"l":"C","e":"Static variables","a":"متغيرات ساكنة (Static)"},{"l":"D","e":"Constants","a":"ثوابت (Constants)"}],"c":"B","xe":"Variables declared outside any function have global scope, meaning they are accessible from any part of the program after their declaration.","xa":"المتغيرات المعرفة خارج أي دالة لها نطاق عام (Global Scope)، مما يعني أنه يمكن الوصول إليها من أي جزء في البرنامج بعد تعريفها."},{"n":15,"ch":11,"qe":"Static variables preserve their value:","qa":"المتغيرات الساكنة (Static) تحافظ على قيمتها:","o":[{"l":"A","e":"Between function calls","a":"بين استدعاءات الدالة"},{"l":"B","e":"Once","a":"مرة واحدة"},{"l":"C","e":"Until the program ends","a":"حتى ينتهي البرنامج"},{"l":"D","e":"Only in main()","a":"فقط في main()"}],"c":"A","xe":"A static local variable is initialized only once and retains its value between function calls. Its lifetime is the entire program execution.","xa":"يتم تهيئة المتغير المحلي الساكن (Static Local Variable) مرة واحدة فقط ويحتفظ بقيمته بين استدعاءات الدالة. وعمره هو فترة تنفيذ البرنامج بأكملها."},{"n":16,"ch":11,"qe":"Which keyword creates a constant variable?","qa":"أي كلمة مفتاحية تنشئ متغيراً ثابتاً؟","o":[{"l":"A","e":"#define","a":"#define"},{"l":"B","e":"const","a":"const"},{"l":"C","e":"static","a":"static"},{"l":"D","e":"default","a":"default"}],"c":"B","xe":"The `const` keyword is used to declare a variable whose value cannot be modified after initialization.","xa":"تُستخدم الكلمة المفتاحية `const` لتعريف متغير لا يمكن تعديل قيمته بعد التهيئة."},{"n":17,"ch":11,"qe":"The #define directive for constants:","qa":"توجيه `#define` للثوابت:","o":[{"l":"A","e":"Is evaluated at runtime","a":"يتم تقييمه في وقت التشغيل"},{"l":"B","e":"Replaces text before compilation","a":"يستبدل النص قبل الترجمة"},{"l":"C","e":"Requires a data type","a":"يتطلب نوع بيانات"},{"l":"D","e":"Can be changed later","a":"يمكن تغييره لاحقاً"}],"c":"B","xe":"`#define` is a preprocessor directive that performs text substitution before the compiler processes the code. It does not involve runtime evaluation or data types.","xa":"`#define` هو توجيه معالج أولي (Preprocessor Directive) يقوم باستبدال النص قبل أن يعالج المترجم الكود. وهو لا يتضمن تقييماً في وقت التشغيل أو أنواع بيانات."},{"n":18,"ch":11,"qe":"Which is preferred in modern C++ for constants?","qa":"أي مما يلي يُفضل في C++ الحديثة للثوابت؟","o":[{"l":"A","e":"const","a":"const"},{"l":"B","e":"#define","a":"#define"},{"l":"C","e":"static","a":"static"},{"l":"D","e":"var","a":"var"}],"c":"A","xe":"In modern C++, `const` (and `constexpr`) is preferred over `#define` for defining constants because it provides type safety and scoping.","xa":"في C++ الحديثة، يُفضل `const` (و`constexpr`) على `#define` لتعريف الثوابت لأنه يوفر أمان النوع (Type Safety) والنطاق (Scoping)."},{"n":19,"ch":11,"qe":"An integer literal example is:","qa":"مثال على حرفي صحيح (Integer Literal) هو:","o":[{"l":"A","e":"42","a":"42"},{"l":"B","e":"'A'","a":"'A'"},{"l":"C","e":"\"Hello\"","a":"\"Hello\""},{"l":"D","e":"true","a":"true"}],"c":"A","xe":"An integer literal is a direct representation of a whole number in the code, such as `42`. `'A'` is a character literal, `\"Hello\"` is a string literal, and `true` is a boolean literal.","xa":"الحرفي الصحيح (Integer Literal) هو تمثيل مباشر لعدد صحيح في الكود، مثل `42`. أما `'A'` فهو حرفي حرف (Character Literal)، و`\"Hello\"` حرفي سلسلة نصية (String Literal)، و`true` حرفي منطقي (Boolean Literal)."},{"n":20,"ch":11,"qe":"A floating-point literal example is:","qa":"مثال على حرفي عشري (Floating-point Literal) هو:","o":[{"l":"A","e":"\"3.14\"","a":"\"3.14\""},{"l":"B","e":"3.14","a":"3.14"},{"l":"C","e":"'3.14'","a":"'3.14'"},{"l":"D","e":"double pi","a":"double pi"}],"c":"B","xe":"A floating-point literal represents a decimal number directly in the code, such as `3.14`. `\"3.14\"` is a string, and `'3.14'` is invalid (character literal with multiple characters).","xa":"الحرفي العشري (Floating-point Literal) يمثل عدداً عشرياً مباشرةً في الكود، مثل `3.14`. أما `\"3.14\"` فهي سلسلة نصية، و`'3.14'` غير صالحة (حرفي حرف متعدد الأحرف)."},{"n":21,"ch":11,"qe":"A character literal example is:","qa":"مثال على حرفي حرف (Character Literal) هو:","o":[{"l":"A","e":"'A'","a":"'A'"},{"l":"B","e":"\"A\"","a":"\"A\""},{"l":"C","e":"A","a":"A"},{"l":"D","e":"65","a":"65"}],"c":"A","xe":"A character literal is a single character enclosed in single quotes, such as `'A'`. `\"A\"` is a string literal, and `65` is an integer literal.","xa":"حرفي الحرف (Character Literal) هو حرف واحد محاط بعلامات تنصيص مفردة، مثل `'A'`. أما `\"A\"` فهو حرفي سلسلة نصية، و`65` حرفي صحيح."},{"n":22,"ch":11,"qe":"A string literal example is:","qa":"مثال على حرفي سلسلة نصية (String Literal) هو:","o":[{"l":"A","e":"'Hello'","a":"'Hello'"},{"l":"B","e":"\"Hello\"","a":"\"Hello\""},{"l":"C","e":"Hello","a":"Hello"},{"l":"D","e":"#Hello","a":"#Hello"}],"c":"B","xe":"A string literal is a sequence of characters enclosed in double quotes, such as `\"Hello\"`.","xa":"حرفي السلسلة النصية (String Literal) هو تسلسل من الأحرف محاط بعلامات تنصيص مزدوجة، مثل `\"Hello\"`."},{"n":23,"ch":11,"qe":"Boolean literals are:","qa":"الحرفيات المنطقية (Boolean Literals) هي:","o":[{"l":"A","e":"yes/no","a":"نعم/لا"},{"l":"B","e":"true/false","a":"صحيح/خطأ"},{"l":"C","e":"1/2","a":"1/2"},{"l":"D","e":"A/B","a":"A/B"}],"c":"B","xe":"The only boolean literals in C++ are `true` and `false`.","xa":"الحرفيات المنطقية الوحيدة في C++ هي `true` و`false`."},{"n":24,"ch":11,"qe":"Which type modifier doubles the max positive range but disallows negatives?","qa":"أي معدل نوع (Type Modifier) يضاعف الحد الأقصى للنطاق الموجب لكنه يمنع القيم السالبة؟","o":[{"l":"A","e":"signed","a":"signed"},{"l":"B","e":"unsigned","a":"unsigned"},{"l":"C","e":"short","a":"short"},{"l":"D","e":"long","a":"long"}],"c":"B","xe":"The `unsigned` modifier makes a type non-negative, effectively doubling its maximum positive range by reallocating the sign bit for magnitude.","xa":"المعدل `unsigned` يجعل النوع غير سالب، مما يضاعف نطاقه الموجب الأقصى بشكل فعال عن طريق إعادة تخصيص بت الإشارة للمقدار."},{"n":25,"ch":11,"qe":"Which type modifier uses less memory?","qa":"أي معدل نوع يستخدم ذاكرة أقل؟","o":[{"l":"A","e":"short","a":"short"},{"l":"B","e":"long","a":"long"},{"l":"C","e":"signed","a":"signed"},{"l":"D","e":"unsigned","a":"unsigned"}],"c":"A","xe":"The `short` modifier typically reduces the size of an integer type to 2 bytes (16 bits), using less memory than a standard `int` (usually 4 bytes).","xa":"المعدل `short` عادةً يقلل حجم نوع العدد الصحيح إلى 2 بايت (16 بت)، مما يستخدم ذاكرة أقل من `int` القياسي (عادةً 4 بايت)."},{"n":26,"ch":11,"qe":"Casting that is automatically done by the compiler is:","qa":"التحويل الذي يقوم به المترجم تلقائياً هو:","o":[{"l":"A","e":"Explicit casting","a":"التحويل الصريح (Explicit Casting)"},{"l":"B","e":"Implicit type casting","a":"تحويل النوع الضمني (Implicit Type Casting)"},{"l":"C","e":"Manual type conversion","a":"تحويل النوع اليدوي"},{"l":"D","e":"Dynamic binding","a":"الارتباط الديناميكي (Dynamic Binding)"}],"c":"B","xe":"Implicit type casting (or coercion) is automatically performed by the compiler when a value of one type is assigned to a variable of another compatible type.","xa":"تحويل النوع الضمني (Implicit Type Casting) أو الإكراه (Coercion) يتم تلقائياً بواسطة المترجم عندما يتم تعيين قيمة من نوع ما إلى متغير من نوع آخر متوافق."},{"n":27,"ch":11,"qe":"Casting done manually by the programmer is:","qa":"التحويل الذي يقوم به المبرمج يدوياً هو:","o":[{"l":"A","e":"Explicit type casting","a":"التحويل الصريح (Explicit Type Casting)"},{"l":"B","e":"Implicit casting","a":"التحويل الضمني (Implicit Casting)"},{"l":"C","e":"Automatic casting","a":"التحويل التلقائي"},{"l":"D","e":"Derived casting","a":"التحويل المشتق"}],"c":"A","xe":"Explicit type casting is when the programmer explicitly specifies the target type using a cast operator, such as `(int)pi` or `static_cast<int>(pi)`.","xa":"التحويل الصريح (Explicit Type Casting) هو عندما يحدد المبرمج نوع الهدف بشكل صريح باستخدام معامل التحويل، مثل `(int)pi` أو `static_cast<int>(pi)`."},{"n":28,"ch":11,"qe":"Correct C-style explicit cast from double to int:","qa":"التحويل الصريح الصحيح بأسلوب C من double إلى int هو:","o":[{"l":"A","e":"int approx = (int)pi;","a":"int approx = (int)pi;"},{"l":"B","e":"int approx = pi;","a":"int approx = pi;"},{"l":"C","e":"int approx = static_cast;","a":"int approx = static_cast;"},{"l":"D","e":"int approx = pi(int);","a":"int approx = pi(int);"}],"c":"A","xe":"The C-style cast syntax is `(type)expression`. Therefore, `(int)pi` is the correct way to explicitly cast a `double` to an `int`.","xa":"صياغة التحويل بأسلوب C هي `(النوع)التعبير`. لذلك، `(int)pi` هي الطريقة الصحيحة لتحويل `double` إلى `int` بشكل صريح."},{"n":29,"ch":11,"qe":"Correct modern C++ style explicit cast from double to int:","qa":"التحويل الصريح الصحيح بأسلوب C++ الحديث من double إلى int هو:","o":[{"l":"A","e":"int approx = (int)pi;","a":"int approx = (int)pi;"},{"l":"B","e":"int approx = static_cast<int>(pi);","a":"int approx = static_cast<int>(pi);"},{"l":"C","e":"int approx = pi;","a":"int approx = pi;"},{"l":"D","e":"int approx = cast(pi);","a":"int approx = cast(pi);"}],"c":"B","xe":"The modern C++ style uses `static_cast<type>(expression)`. Therefore, `static_cast<int>(pi)` is the correct form.","xa":"يستخدم أسلوب C++ الحديث `static_cast<النوع>(التعبير)`. لذلك، `static_cast<int>(pi)` هي الصيغة الصحيحة."},{"n":30,"ch":11,"qe":"Which is NOT mentioned as a common mistake?","qa":"أي مما يلي لم يُذكر كخطأ شائع؟","o":[{"l":"A","e":"Forgetting to initialize variables","a":"نسيان تهيئة المتغيرات"},{"l":"B","e":"Using incorrect data types","a":"استخدام أنواع بيانات غير صحيحة"},{"l":"C","e":"Confusing = with ==","a":"الخلط بين = و =="},{"l":"D","e":"Overloading operators","a":"حمل المعاملات الزائد (Overloading Operators)"}],"c":"D","xe":"Common beginner mistakes include forgetting to initialize variables, using wrong data types, and confusing assignment (`=`) with equality comparison (`==`). Operator overloading is an advanced feature, not a common beginner mistake.","xa":"تشمل أخطاء المبتدئين الشائعة نسيان تهيئة المتغيرات واستخدام أنواع بيانات خاطئة والخلط بين التعيين (`=`) والمقارنة للمساواة (`==`). أما حمل المعاملات الزائد (Operator Overloading) فهو ميزة متقدمة وليس خطأً شائعاً للمبتدئين."},{"n":1,"ch":12,"qe":"An expression in C++ is:","qa":"التعبير (Expression) في C++ هو:","o":[{"l":"A","e":"A group of variables only","a":"مجموعة من المتغيرات فقط"},{"l":"B","e":"Something that evaluates to a value","a":"شيء يتم تقييمه إلى قيمة"},{"l":"C","e":"Only a statement","a":"عبارة فقط"},{"l":"D","e":"A comment","a":"تعليق"}],"c":"B","xe":"An expression is a combination of variables, literals, and operators that produces a value. A statement is a complete instruction, while an expression is a component that evaluates to a result.","xa":"التعبير (Expression) هو مزيج من المتغيرات والثوابت والمعاملات ينتج قيمة. أما العبارة (Statement) فهي تعليمة كاملة، بينما التعبير هو مكون يتم تقييمه للحصول على نتيجة."},{"n":2,"ch":12,"qe":"In the expression int x = 5 + 3;, the operator is:","qa":"في التعبير `int x = 5 + 3;`، المعامل (Operator) هو:","o":[{"l":"A","e":"5","a":"5"},{"l":"B","e":"3","a":"3"},{"l":"C","e":"+","a":"+"},{"l":"D","e":"x","a":"x"}],"c":"C","xe":"The operator is the symbol that performs an operation. In `5 + 3`, the `+` symbol is the operator, while `5` and `3` are operands.","xa":"المعامل (Operator) هو الرمز الذي يقوم بعملية. في `5 + 3`، الرمز `+` هو المعامل، بينما `5` و`3` هما المعاملان (Operands)."},{"n":3,"ch":12,"qe":"Arithmetic operators are used for:","qa":"تُستخدم المعاملات الحسابية (Arithmetic Operators) لـ:","o":[{"l":"A","e":"Logical decisions","a":"القرارات المنطقية"},{"l":"B","e":"Mathematical calculations","a":"العمليات الحسابية"},{"l":"C","e":"Input/output","a":"الإدخال/الإخراج"},{"l":"D","e":"Type casting","a":"تحويل النوع"}],"c":"B","xe":"Arithmetic operators, such as `+`, `-`, `*`, `/`, and `%`, are used to perform mathematical calculations on numeric values.","xa":"تُستخدم المعاملات الحسابية (Arithmetic Operators)، مثل `+` و`-` و`*` و`/` و`%`، لإجراء عمليات حسابية على القيم الرقمية."},{"n":4,"ch":12,"qe":"Which operator finds the remainder of division?","qa":"أي معامل يجد باقي القسمة؟","o":[{"l":"A","e":"/","a":"/"},{"l":"B","e":"%","a":"%"},{"l":"C","e":"*","a":"*"},{"l":"D","e":"&&","a":"&&"}],"c":"B","xe":"The modulus operator `%` returns the remainder of an integer division. For example, `5 % 2` evaluates to `1`.","xa":"معامل باقي القسمة (Modulus Operator) `%` يُرجع باقي قسمة الأعداد الصحيحة. على سبيل المثال، `5 % 2` تساوي `1`."},{"n":5,"ch":12,"qe":"The expression 6 / 3 gives:","qa":"التعبير `6 / 3` يعطي:","o":[{"l":"A","e":"1","a":"1"},{"l":"B","e":"2","a":"2"},{"l":"C","e":"0.5","a":"0.5"},{"l":"D","e":"3","a":"3"}],"c":"B","xe":"When both operands are integers, `/` performs integer division. `6 / 3` equals `2` exactly. The other options are incorrect results for this operation.","xa":"عندما يكون كلا المعاملين أعداداً صحيحة، يقوم المعامل `/` بالقسمة الصحيحة (Integer Division). `6 / 3` تساوي `2` بالضبط. الخيارات الأخرى غير صحيحة لهذه العملية."},{"n":6,"ch":12,"qe":"The expression 5 % 2 gives:","qa":"التعبير `5 % 2` يعطي:","o":[{"l":"A","e":"2","a":"2"},{"l":"B","e":"2.5","a":"2.5"},{"l":"C","e":"1","a":"1"},{"l":"D","e":"0","a":"0"}],"c":"C","xe":"The modulus operator `%` returns the remainder of `5` divided by `2`. Since `2` goes into `5` twice (4) with a remainder of `1`, the result is `1`.","xa":"معامل باقي القسمة `%` يُرجع باقي قسمة `5` على `2`. بما أن `2` تدخل في `5` مرتين (4) ويتبقى `1`، فإن النتيجة هي `1`."},{"n":7,"ch":12,"qe":"Assignment operator += does:","qa":"معامل التعيين `+=` يقوم بـ:","o":[{"l":"A","e":"Adds and assigns","a":"الجمع والتعيين"},{"l":"B","e":"Subtracts and assigns","a":"الطرح والتعيين"},{"l":"C","e":"Multiplies and assigns","a":"الضرب والتعيين"},{"l":"D","e":"Divides and assigns","a":"القسمة والتعيين"}],"c":"A","xe":"The `+=` operator is a compound assignment operator. `x += 3` is equivalent to `x = x + 3`, meaning it adds the right operand to the left operand and assigns the result to the left operand.","xa":"المعامل `+=` هو معامل تعيين مركب (Compound Assignment Operator). `x += 3` تعادل `x = x + 3`، أي أنه يجمع المعامل الأيمن مع الأيسر ويعين النتيجة للمعامل الأيسر."},{"n":8,"ch":12,"qe":"Correct equivalent of x += 3 is:","qa":"المكافئ الصحيح لـ `x += 3` هو:","o":[{"l":"A","e":"x = x - 3","a":"x = x - 3"},{"l":"B","e":"x = x + 3","a":"x = x + 3"},{"l":"C","e":"x = x * 3","a":"x = x * 3"},{"l":"D","e":"x = 3 + 3","a":"x = 3 + 3"}],"c":"B","xe":"The expression `x += 3` is a shorthand for `x = x + 3`. It adds `3` to the current value of `x` and stores the result back in `x`.","xa":"التعبير `x += 3` هو اختصار لـ `x = x + 3`. فهو يضيف `3` إلى القيمة الحالية لـ `x` ويخزن النتيجة مرة أخرى في `x`."},{"n":9,"ch":12,"qe":"Relational operators return:","qa":"المعاملات العلائقية (Relational Operators) تُرجع:","o":[{"l":"A","e":"Numbers","a":"أرقام"},{"l":"B","e":"Booleans (true/false)","a":"قيم منطقية (صحيح/خطأ)"},{"l":"C","e":"Characters","a":"أحرف"},{"l":"D","e":"Arrays","a":"مصفوفات"}],"c":"B","xe":"Relational operators, such as `==`, `!=`, `<`, `>`, `<=`, and `>=`, compare two values and return a boolean result: `true` if the condition holds, and `false` otherwise.","xa":"المعاملات العلائقية (Relational Operators)، مثل `==` و`!=` و`<` و`>` و`<=` و`>=`، تقارن قيمتين وتُرجع نتيجة منطقية: `true` إذا تحقق الشرط، و`false` خلاف ذلك."},{"n":10,"ch":12,"qe":"The operator != means:","qa":"المعامل `!=` يعني:","o":[{"l":"A","e":"Not equals","a":"لا يساوي"},{"l":"B","e":"Equals","a":"يساوي"},{"l":"C","e":"Assignment","a":"تعيين"},{"l":"D","e":"Bitwise NOT","a":"NOT على مستوى البت"}],"c":"A","xe":"The `!=` operator is the \"not equal to\" relational operator. It evaluates to `true` if the two operands are not equal.","xa":"المعامل `!=` هو المعامل العلائقي \"لا يساوي\". ويُقيَّم إلى `true` إذا كان المعاملان غير متساويين."},{"n":11,"ch":12,"qe":"Which is the logical AND operator?","qa":"أي مما يلي هو المعامل المنطقي AND؟","o":[{"l":"A","e":"||","a":"||"},{"l":"B","e":"&&","a":"&&"},{"l":"C","e":"&","a":"&"},{"l":"D","e":"!","a":"!"}],"c":"B","xe":"The `&&` operator is the logical AND operator. It returns `true` only if both operands are `true`. The `&` symbol is the bitwise AND operator.","xa":"المعامل `&&` هو المعامل المنطقي AND (Logical AND). ويُرجع `true` فقط إذا كان كلا المعاملين `true`. أما الرمز `&` فهو المعامل AND على مستوى البت (Bitwise AND)."},{"n":12,"ch":12,"qe":"Which is the logical OR operator?","qa":"أي مما يلي هو المعامل المنطقي OR؟","o":[{"l":"A","e":"||","a":"||"},{"l":"B","e":"&&","a":"&&"},{"l":"C","e":"|","a":"|"},{"l":"D","e":"!=","a":"!="}],"c":"A","xe":"The `||` operator is the logical OR operator. It returns `true` if at least one of the operands is `true`. The other options are not the correct logical OR operator.","xa":"المعامل `||` هو المعامل المنطقي OR (Logical OR). ويُرجع `true` إذا كان أحد المعاملين على الأقل `true`. الخيارات الأخرى ليست المعامل المنطقي OR الصحيح."},{"n":13,"ch":12,"qe":"Which is the logical NOT operator?","qa":"أي مما يلي هو المعامل المنطقي NOT؟","o":[{"l":"A","e":"!","a":"!"},{"l":"B","e":"&&","a":"&&"},{"l":"C","e":"||","a":"||"},{"l":"D","e":"^","a":"^"}],"c":"A","xe":"The `!` operator is the logical NOT operator. It negates a boolean value: `!true` is `false`, and `!false` is `true`.","xa":"المعامل `!` هو المعامل المنطقي NOT (Logical NOT). وهو ينفي القيمة المنطقية: `!true` هي `false`، و`!false` هي `true`."},{"n":14,"ch":12,"qe":"Pre-increment ++x increases the value:","qa":"الزيادة المسبقة `++x` تزيد القيمة:","o":[{"l":"A","e":"After it's used","a":"بعد استخدامها"},{"l":"B","e":"Before it's used","a":"قبل استخدامها"},{"l":"C","e":"Does not increase","a":"لا تزيد"},{"l":"D","e":"Doubles it","a":"تضاعفها"}],"c":"B","xe":"The pre-increment operator `++x` increments the value of `x` first, and then the expression evaluates to the new value. So the increment happens before the value is used.","xa":"معامل الزيادة المسبقة `++x` يزيد قيمة `x` أولاً، ثم يتم تقييم التعبير إلى القيمة الجديدة. لذا تحدث الزيادة قبل استخدام القيمة."},{"n":15,"ch":12,"qe":"Post-increment x++ increases the value:","qa":"الزيادة اللاحقة `x++` تزيد القيمة:","o":[{"l":"A","e":"Before it's used","a":"قبل استخدامها"},{"l":"B","e":"After it's used","a":"بعد استخدامها"},{"l":"C","e":"Doubles it","a":"تضاعفها"},{"l":"D","e":"Resets it","a":"تعيد تعيينها"}],"c":"B","xe":"The post-increment operator `x++` evaluates to the original value of `x` first, and then increments `x`. So the increment happens after the current value is used.","xa":"معامل الزيادة اللاحقة `x++` يتم تقييمه إلى القيمة الأصلية لـ `x` أولاً، ثم يزيد `x`. لذا تحدث الزيادة بعد استخدام القيمة الحالية."},{"n":16,"ch":12,"qe":"Bitwise operators work on:","qa":"المعاملات على مستوى البت (Bitwise Operators) تعمل على:","o":[{"l":"A","e":"Individual bits","a":"البتات الفردية"},{"l":"B","e":"Whole numbers only","a":"الأعداد الصحيحة فقط"},{"l":"C","e":"Strings","a":"السلاسل النصية"},{"l":"D","e":"Classes","a":"الفئات"}],"c":"A","xe":"Bitwise operators, such as `&`, `|`, `^`, `~`, `<<`, and `>>`, perform operations on the individual bits of integer operands.","xa":"المعاملات على مستوى البت (Bitwise Operators)، مثل `&` و`|` و`^` و`~` و`<<` و`>>`، تُجري عمليات على البتات الفردية للمعاملات الصحيحة."},{"n":17,"ch":12,"qe":"The bitwise AND operator is:","qa":"المعامل AND على مستوى البت هو:","o":[{"l":"A","e":"&&","a":"&&"},{"l":"B","e":"&","a":"&"},{"l":"C","e":"|","a":"|"},{"l":"D","e":"^","a":"^"}],"c":"B","xe":"The single ampersand `&` is the bitwise AND operator. It compares each bit of two operands and returns a new value where each bit is `1` only if both corresponding bits are `1`.","xa":"الرمز `&` (علامة العطف المفردة) هو المعامل AND على مستوى البت (Bitwise AND). وهو يقارن كل بت من معاملين ويُرجع قيمة جديدة حيث يكون كل بت `1` فقط إذا كان البتان المتناظران `1`."},{"n":18,"ch":12,"qe":"The bitwise OR operator is:","qa":"المعامل OR على مستوى البت هو:","o":[{"l":"A","e":"&&","a":"&&"},{"l":"B","e":"||","a":"||"},{"l":"C","e":"|","a":"|"},{"l":"D","e":"^","a":"^"}],"c":"C","xe":"The single pipe `|` is the bitwise OR operator. It compares each bit of two operands and returns a new value where each bit is `1` if at least one of the corresponding bits is `1`.","xa":"الرمز `|` (الخط العمودي المفرد) هو المعامل OR على مستوى البت (Bitwise OR). وهو يقارن كل بت من معاملين ويُرجع قيمة جديدة حيث يكون كل بت `1` إذا كان أحد البتين المتناظرين على الأقل `1`."},{"n":19,"ch":12,"qe":"The bitwise XOR operator is:","qa":"المعامل XOR على مستوى البت هو:","o":[{"l":"A","e":"^","a":"^"},{"l":"B","e":"&","a":"&"},{"l":"C","e":"|","a":"|"},{"l":"D","e":"~","a":"~"}],"c":"A","xe":"The caret `^` symbol represents the bitwise XOR (exclusive OR) operator. It returns `1` for each bit position where the corresponding bits of the operands differ.","xa":"الرمز `^` (علامة الإقحام) يمثل المعامل XOR (حصري أو) على مستوى البت. ويُرجع `1` لكل موضع بت تختلف فيه البتات المتناظرة للمعاملات."},{"n":20,"ch":12,"qe":"The bitwise NOT operator is:","qa":"المعامل NOT على مستوى البت هو:","o":[{"l":"A","e":"!","a":"!"},{"l":"B","e":"^","a":"^"},{"l":"C","e":"~","a":"~"},{"l":"D","e":"&","a":"&"}],"c":"C","xe":"The tilde `~` is the bitwise NOT operator. It inverts all the bits of its operand (each `0` becomes `1`, and each `1` becomes `0`).","xa":"الرمز `~` (المدّة) هو المعامل NOT على مستوى البت (Bitwise NOT). وهو يعكس جميع بتات معامله (كل `0` تصبح `1`، وكل `1` تصبح `0`)."},{"n":21,"ch":12,"qe":"The left shift operator is:","qa":"معامل الإزاحة اليسرى (Left Shift) هو:","o":[{"l":"A","e":"<<","a":"<<"},{"l":"B","e":">>","a":">>"},{"l":"C","e":"<","a":"<"},{"l":"D","e":">","a":">"}],"c":"A","xe":"The `<<` operator shifts the bits of its left operand to the left by the number of positions specified by the right operand.","xa":"المعامل `<<` يزحزح بتات معامله الأيسر إلى اليسار بعدد المواضع المحدد بواسطة المعامل الأيمن."},{"n":22,"ch":12,"qe":"The right shift operator is:","qa":"معامل الإزاحة اليمنى (Right Shift) هو:","o":[{"l":"A","e":"<<","a":"<<"},{"l":"B","e":">>","a":">>"},{"l":"C","e":"<","a":"<"},{"l":"D","e":">","a":">"}],"c":"B","xe":"The `>>` operator shifts the bits of its left operand to the right by the number of positions specified by the right operand.","xa":"المعامل `>>` يزحزح بتات معامله الأيسر إلى اليمين بعدد المواضع المحدد بواسطة المعامل الأيمن."},{"n":23,"ch":12,"qe":"The conditional (ternary) operator syntax is:","qa":"صياغة المعامل الشرطي (Ternary Operator) هي:","o":[{"l":"A","e":"condition : expression1 ? expression2","a":"condition : expression1 ? expression2"},{"l":"B","e":"condition ? expression1 : expression2","a":"condition ? expression1 : expression2"},{"l":"C","e":"? condition : expression1 : expression2","a":"? condition : expression1 : expression2"},{"l":"D","e":"expression1 ? expression2 : condition","a":"expression1 ? expression2 : condition"}],"c":"B","xe":"The ternary operator takes three operands. The syntax is `condition ? value_if_true : value_if_false`. If the condition is true, it evaluates to `expression1`; otherwise, it evaluates to `expression2`.","xa":"المعامل الثلاثي (Ternary Operator) يأخذ ثلاثة معاملات. الصياغة هي `الشرط ? القيمة_إذا_صح : القيمة_إذا_خطأ`. إذا كان الشرط صحيحاً، فإنه يُقيَّم إلى `expression1`؛ وإلا، فإنه يُقيَّم إلى `expression2`."},{"n":24,"ch":12,"qe":"Example of a ternary operator usage:","qa":"مثال على استخدام المعامل الثلاثي:","o":[{"l":"A","e":"string result = (age >= 18) ? \"Adult\" : \"Minor\";","a":"string result = (age >= 18) ? \"Adult\" : \"Minor\";"},{"l":"B","e":"string result = age >= 18;","a":"string result = age >= 18;"},{"l":"C","e":"if(age >= 18) Adult;","a":"if(age >= 18) Adult;"},{"l":"D","e":"result = if-else;","a":"result = if-else;"}],"c":"A","xe":"Option A correctly demonstrates the ternary operator: if `age >= 18` is true, `result` is assigned `\"Adult\"`; otherwise, it is assigned `\"Minor\"`.","xa":"الخيار A يوضح بشكل صحيح المعامل الثلاثي: إذا كان `age >= 18` صحيحاً، يتم تعيين `\"Adult\"` إلى `result`؛ وإلا، يتم تعيين `\"Minor\"`."},{"n":25,"ch":12,"qe":"The sizeof operator returns:","qa":"معامل `sizeof` يُرجع:","o":[{"l":"A","e":"Number of elements","a":"عدد العناصر"},{"l":"B","e":"Size of a data type or variable in bytes","a":"حجم نوع البيانات أو المتغير بالبايت"},{"l":"C","e":"Memory address","a":"عنوان الذاكرة"},{"l":"D","e":"Range of a type","a":"نطاق النوع"}],"c":"B","xe":"The `sizeof` operator is a compile-time operator that returns the size, in bytes, of a data type or a variable.","xa":"معامل `sizeof` هو معامل وقت ترجمة (Compile-time Operator) يُرجع الحجم، بالبايت، لنوع بيانات أو متغير."},{"n":26,"ch":12,"qe":"Comma operator allows:","qa":"المعامل الفاصلة (Comma Operator) يسمح بـ:","o":[{"l":"A","e":"Multiple expressions in one statement, returning the last","a":"تعبيرات متعددة في عبارة واحدة، مع إرجاع الأخير"},{"l":"B","e":"Only two variables to be declared","a":"تعريف متغيرين فقط"},{"l":"C","e":"String concatenation","a":"دمج السلاسل النصية"},{"l":"D","e":"Ending a program","a":"إنهاء البرنامج"}],"c":"A","xe":"The comma operator `,` evaluates a list of expressions from left to right and returns the value of the rightmost expression. It is often used in `for` loops to combine multiple expressions.","xa":"المعامل الفاصلة `,` يُقيّم قائمة من التعبيرات من اليسار إلى اليمين ويُرجع قيمة التعبير الموجود في أقصى اليمين. ويُستخدم غالباً في حلقات `for` لدمج تعبيرات متعددة."},{"n":27,"ch":12,"qe":"Operator precedence determines:","qa":"أسبقية المعاملات (Operator Precedence) تحدد:","o":[{"l":"A","e":"Which operator is evaluated first","a":"أي معامل يتم تقييمه أولاً"},{"l":"B","e":"Variable naming rules","a":"قواعد تسمية المتغيرات"},{"l":"C","e":"Data type conversion","a":"تحويل نوع البيانات"},{"l":"D","e":"Loop execution order","a":"ترتيب تنفيذ الحلقة"}],"c":"A","xe":"Operator precedence defines the order in which operators are evaluated in an expression. For example, multiplication `*` has higher precedence than addition `+`, so `5 + 2 * 3` evaluates as `5 + (2 * 3)`.","xa":"تحدد أسبقية المعاملات (Operator Precedence) الترتيب الذي يتم به تقييم المعاملات في تعبير ما. على سبيل المثال، الضرب `*` له أسبقية أعلى من الجمع `+`، لذا `5 + 2 * 3` يتم تقييمه كـ `5 + (2 * 3)`."},{"n":28,"ch":12,"qe":"In 5 + 2*3, which operation is done first?","qa":"في `5 + 2*3`، أي عملية تتم أولاً؟","o":[{"l":"A","e":"5 + 2","a":"5 + 2"},{"l":"B","e":"2*3","a":"2*3"},{"l":"C","e":"5 + (2*3) at once","a":"5 + (2*3) في وقت واحد"},{"l":"D","e":"(5 + 2)*3","a":"(5 + 2)*3"}],"c":"B","xe":"Due to operator precedence, multiplication `*` has higher precedence than addition `+`. Therefore, `2 * 3` is evaluated first, resulting in `6`, and then `5 + 6` gives `11`.","xa":"بسبب أسبقية المعاملات، الضرب `*` له أسبقية أعلى من الجمع `+`. لذلك، يتم تقييم `2 * 3` أولاً، مما ينتج `6`، ثم `5 + 6` يعطي `11`."},{"n":29,"ch":12,"qe":"Parentheses in an expression:","qa":"الأقواس في التعبير:","o":[{"l":"A","e":"Lower precedence","a":"تقلل الأسبقية"},{"l":"B","e":"Override normal precedence","a":"تتجاوز الأسبقية العادية"},{"l":"C","e":"Have no effect","a":"ليس لها تأثير"},{"l":"D","e":"Cause an error","a":"تسبب خطأ"}],"c":"B","xe":"Parentheses `()` have the highest precedence and are used to explicitly override the normal operator precedence, forcing the evaluation of the enclosed expression first.","xa":"الأقواس `()` لها أعلى أسبقية وتُستخدم لتجاوز أسبقية المعاملات العادية بشكل صريح، مما يفرض تقييم التعبير المحاط بها أولاً."},{"n":30,"ch":12,"qe":"Common mistake with integer division:","qa":"الخطأ الشائع مع القسمة الصحيحة (Integer Division):","o":[{"l":"A","e":"Dividing two ints gives a floating result","a":"قسمة عددين صحيحين تعطي نتيجة عشرية"},{"l":"B","e":"Dividing two ints results in an int","a":"قسمة عددين صحيحين تؤدي إلى عدد صحيح"},{"l":"C","e":"Dividing int by float causes error","a":"قسمة int على float تسبب خطأ"},{"l":"D","e":"Division not allowed","a":"القسمة غير مسموحة"}],"c":"B","xe":"A common mistake is expecting a decimal result when dividing two integers. In C++, integer division truncates the fractional part, so `5 / 2` results in `2`, not `2.5`.","xa":"الخطأ الشائع هو توقع نتيجة عشرية عند قسمة عددين صحيحين. في C++، تقوم القسمة الصحيحة باقتطاع الجزء الكسري، لذا `5 / 2` تنتج `2`، وليس `2.5`."}];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st=store.get('eb_state',{a:{},m:[],th:'light'});
let ch='all',q='',onlySaved=false,focus=false,idx=0,order=DATA.map((_,i)=>i);

// chips

$('#chips').innerHTML=`<button class="chip on" data-ch="all">All</button>`+chs.map(c=>`<button class="chip" data-ch="${c}">Ch ${c}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$$('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');ch=b.dataset.ch;idx=0;render()};
$('#search').oninput=e=>{q=e.target.value.toLowerCase();idx=0;render()};
$$('.l').forEach(b=>b.onclick=()=>{$$('.l').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.body.className=document.body.className.replace(/l-\w+/,'l-'+b.dataset.l)});
$('#th').onclick=()=>{st.th=st.th==='dark'?'light':'dark';document.documentElement.dataset.theme=st.th;save()};
