<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++ Exam Bank · بنك الأسئلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf5ea;--bg2:#f3ead6;--card:#fffdf8;--ink:#2b2418;--mut:#7d705a;--gold:#b8893a;--gold2:#e2bd6d;--line:#e6d9bb;--ok:#3f8f5f;--okbg:#e6f4ea;--no:#c0504a;--nobg:#fbe9e7;--sh:0 10px 30px -12px rgba(120,90,30,.28)}
:root[data-theme=dark]{--bg:#17130c;--bg2:#1f1a10;--card:#241e12;--ink:#f1e8d2;--mut:#a89a7d;--gold:#d9a94c;--gold2:#f0cf86;--line:#3a3220;--okbg:#18301f;--nobg:#381d1a;--sh:0 10px 30px -12px #000}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Inter,'Amiri',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;transition:background .5s,color .5s;overflow-x:hidden;min-height:100vh}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.ar{font-family:'Amiri','Traditional Arabic',serif;direction:rtl;text-align:right;font-size:1.08em}
/* animated backdrop */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38;animation:float 18s ease-in-out infinite}
.b1{width:420px;height:420px;background:var(--gold2);top:-120px;left:-100px}
.b2{width:360px;height:360px;background:#e9cfa0;bottom:-100px;right:-80px;animation-delay:-6s}
.b3{width:260px;height:260px;background:#f0dcb0;top:40%;left:55%;animation-delay:-11s}
:root[data-theme=dark] .blob{opacity:.14}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.12)}66%{transform:translate(-40px,70px) scale(.92)}}
.sym{position:absolute;font-family:monospace;color:var(--gold);opacity:.14;font-size:22px;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(25deg)}}
.pbar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:50;transition:width .15s}
/* header */
header{text-align:center;padding:64px 20px 26px}
.badge{display:inline-block;padding:5px 16px;border:1px solid var(--gold);color:var(--gold);border-radius:30px;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;animation:pop .9s both}
h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:700;margin:14px 0 4px;line-height:1.1;background:linear-gradient(100deg,var(--ink) 30%,var(--gold) 50%,var(--ink) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite,pop 1s .15s both}
@keyframes shine{to{background-position:-250% 0}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.sub{font-family:'Amiri',serif;font-size:1.5rem;color:var(--mut);animation:pop 1s .3s both}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:30px auto 0;max-width:900px;padding:0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 26px;min-width:130px;box-shadow:var(--sh);animation:pop .9s both;transition:transform .3s}
.stat:hover{transform:translateY(-6px) rotate(-1deg)}
.stat:nth-child(2){animation-delay:.1s}.stat:nth-child(3){animation-delay:.2s}.stat:nth-child(4){animation-delay:.3s}
.stat b{display:block;font-size:2.1rem;font-family:'Cormorant Garamond',serif;color:var(--gold)}
.stat span{font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
/* toolbar */
.tools{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 14px}
.row{max-width:980px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.chip,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 15px;border-radius:30px;cursor:pointer;font:500 .85rem Inter,sans-serif;transition:all .25s;position:relative;overflow:hidden}
.chip:hover,.btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.chip.on,.btn.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2b2418;border-color:transparent;box-shadow:0 6px 16px -6px var(--gold)}
.search{flex:1;min-width:200px;max-width:320px;padding:8px 16px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none;transition:.3s}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}
.sep{width:1px;height:22px;background:var(--line)}
/* list */
main{max-width:900px;margin:30px auto 120px;padding:0 14px}
.chhead{display:flex;align-items:center;gap:16px;margin:46px 0 18px}
.chhead h2{font-size:2.1rem;white-space:nowrap}
.chhead .ln{flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent);transform-origin:left;animation:grow 1.2s both}
.chhead small{color:var(--mut);white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}}
.q{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 26px;margin-bottom:18px;box-shadow:var(--sh);opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1),border-color .3s}
.q.in{opacity:1;transform:none}
.q:hover{border-color:var(--gold)}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.num{font:700 .8rem Inter;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.mark{cursor:pointer;font-size:1.25rem;transition:transform .3s;filter:grayscale(1);opacity:.5;background:none;border:0}
.mark.on{filter:none;opacity:1;transform:scale(1.25) rotate(-12deg)}
.qe{font:600 1.35rem/1.45 'Cormorant Garamond',serif}
.qa{margin-top:2px;color:var(--mut)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:start;width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:14px;background:transparent;color:inherit;cursor:pointer;font:inherit;transition:all .3s;position:relative;overflow:hidden}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(6px);background:var(--bg2)}
.opt .l{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--gold);color:var(--gold);font-weight:600;transition:.3s}
.opt .t{flex:1}.opt .t .e{display:block}.opt .t .a{display:block}
.opt.ok{background:var(--okbg);border-color:var(--ok);animation:bump .6s}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:var(--no);animation:shake .5s}
.opt.no .l{background:var(--no);border-color:var(--no);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.opt::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),color-mix(in srgb,var(--gold) 30%,transparent),transparent 55%);opacity:0;transform:scale(0);transition:.6s}
.opt:active::after{opacity:1;transform:scale(2.4);transition:0s}
@keyframes bump{40%{transform:scale(1.025)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s cubic-bezier(.2,.8,.2,1)}
.reveal.open{grid-template-rows:1fr}
.reveal>div{overflow:hidden}
.ans{margin-top:18px;padding:18px 20px;border-radius:16px;background:linear-gradient(135deg,var(--bg2),var(--card));border:1px dashed var(--gold)}
.ans .ok-line{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--ok);margin-bottom:8px}
.ans h4{font:600 1.05rem 'Cormorant Garamond',serif;color:var(--gold);margin:10px 0 2px;letter-spacing:.04em}
.ans p.ar{margin:2px 0}
.showbtn{margin-top:16px}
.warn{margin-top:10px;font-size:.85rem;color:var(--no)}
/* focus mode */
#focus{display:none;max-width:860px;margin:30px auto 120px;padding:0 14px}
body.fm #list{display:none}body.fm #focus{display:block}
.fnav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}
.dots{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:18px}
.dots i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.slide{animation:slide .55s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:0;transform:translateX(60px) scale(.98)}to{opacity:1;transform:none}}
body.back .slide{animation-name:slideb}
@keyframes slideb{from{opacity:0;transform:translateX(-60px) scale(.98)}to{opacity:1;transform:none}}
/* hud */
.hud{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--gold);border-radius:40px;padding:8px 22px;box-shadow:var(--sh);z-index:45;font-weight:600}
.ring{width:44px;height:44px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.7rem}
.score{color:var(--ok)}.wrong{color:var(--no)}
.top{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:var(--card);color:var(--gold);cursor:pointer;z-index:45;font-size:1.2rem;transition:.3s}
.top:hover{transform:translateY(-4px)}
.empty{text-align:center;padding:60px;color:var(--mut);font-size:1.2rem}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:99}
body.l-en .ar:not(.keep),body.l-en .opt .a{display:none}
body.l-ar .qe,body.l-ar .opt .e,body.l-ar .ans .en{display:none}
body.l-ar .qa{color:var(--ink);font-size:1.3em}
@media(max-width:600px){.q{padding:18px}.qe{font-size:1.15rem}.hud{gap:10px;padding:6px 14px;font-size:.85rem}.sep{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* exam mode */
#exam{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:none}
#exam.on{display:block;animation:pop .5s both}
.xw{max-width:860px;margin:auto;padding:30px 16px 90px}
.xh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);padding:12px 0;z-index:3;border-bottom:1px solid var(--line)}
.timer{font:700 1.8rem 'Cormorant Garamond',serif;color:var(--gold);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--no);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.tbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 18px}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 1s linear}
.setup{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--sh);margin-top:30px}
.setup h2{font-size:2.2rem}.setup h3{margin:22px 0 8px;font:600 .9rem Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:16px 0}
.nb{height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:600 .85rem Inter;transition:.25s}
.nb:hover{border-color:var(--gold);transform:translateY(-2px)}
.nb.done{background:var(--bg2);border-color:var(--gold)}.nb.cur{background:var(--gold);color:#2b2418;border-color:var(--gold)}.nb.flag{box-shadow:0 0 0 2px var(--no)}
.opt.sel{border-color:var(--gold);background:var(--bg2)}.opt.sel .l{background:var(--gold);color:#2b2418}
.res{text-align:center;padding:30px 0}
.big{width:200px;height:200px;margin:auto;position:relative}
.big svg{transform:rotate(-90deg)}.big circle{fill:none;stroke-width:12}
.big .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 2s cubic-bezier(.2,.8,.2,1)}
.big span{position:absolute;inset:0;display:grid;place-items:center;font:700 3rem 'Cormorant Garamond',serif;color:var(--gold)}
.bk{display:flex;align-items:center;gap:10px;margin:8px 0;text-align:start}.bk b{width:70px}.bk .bb{flex:1;height:10px;background:var(--line);border-radius:10px;overflow:hidden}.bk .bb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 1.5s .3s}
.rv{margin-top:24px;text-align:start}
</style>
</head>
<body class="l-both">
<div class="pbar" id="pbar"></div>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div id="syms"></div></div>
<canvas id="fx"></canvas>
<div id="exam"><div class="xw" id="xw"></div></div>

<header>
  <div class="badge">Exam Bank · C++ &amp; Computer Science</div>
  <h1 class="serif">Master the Questions</h1>
  <div class="sub">بنك الأسئلة التفاعلي · اختر الإجابة وشاهد الشرح</div>
  <div class="stats">
    <div class="stat"><b data-c="300">0</b><span>Questions</span></div>
    <div class="stat"><b data-c="10">0</b><span>Chapters</span></div>
    <div class="stat"><b id="sAns">0</b><span>Answered</span></div>
    <div class="stat"><b id="sAcc">0%</b><span>Accuracy</span></div>
  </div>
</header>

<div class="tools"><div class="row">
  <input class="search" id="search" placeholder="Search · بحث…">
  <div class="row" id="chips" style="gap:6px"></div>
  <span class="sep"></span>
  <button class="btn l on" data-l="both">EN + AR</button><button class="btn l" data-l="en">EN</button><button class="btn l" data-l="ar">عربي</button>
  <span class="sep"></span>
  <button class="btn on" id="xm" style="animation:pulse 2s 3">⏱ Exam Mode</button>
  <button class="btn" id="vm">▶ Focus Mode</button>
  <button class="btn" id="saved">★ Saved</button>
  <button class="btn" id="shuf">⤮ Shuffle</button>
  <button class="btn" id="rst">↺ Reset</button>
  <button class="btn" id="th">◐</button>
</div></div>

<main id="list"></main>
<section id="focus"></section>

<div class="hud">
  <div class="ring"><svg width="44" height="44"><circle class="bgc" cx="22" cy="22" r="18"/><circle class="fg" id="rg" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="113.1"/></svg><span id="rp">0%</span></div>
  <span class="score">✓ <span id="hOk">0</span></span><span class="wrong">✗ <span id="hNo">0</span></span>
</div>
<button class="top" onclick="scrollTo({top:0})">↑</button>

<script>
const DATA=[{"n":1,"ch":1,"qe":"What is the primary subject of computer science?","qa":"ما هو الموضوع الأساسي لعلم الحاسوب؟","o":[{"l":"A","e":"The physical construction of computers","a":"البناء المادي للحواسيب"},{"l":"B","e":"The study of computation, information, algorithms, and computational systems","a":"دراسة الحوسبة والمعلومات والخوارزميات والأنظمة الحاسوبية"},{"l":"C","e":"The use of social media","a":"استخدام وسائل التواصل الاجتماعي"},{"l":"D","e":"The repair of electronic devices","a":"إصلاح الأجهزة الإلكترونية"}],"c":"B","xe":"Computer science is fundamentally the study of computation and information, encompassing algorithms, computational systems, and the principles that underlie them. The other options describe hardware assembly, social media usage, or device repair, which are not the core subject of the discipline.","xa":"علم الحاسوب هو في جوهره دراسة الحوسبة (Computation) والمعلومات، ويشمل الخوارزميات (Algorithms) والأنظمة الحاسوبية (Computational Systems) والمبادئ التي تقوم عليها. الخيارات الأخرى تصف تجميع العتاد أو استخدام وسائل التواصل أو إصلاح الأجهزة، وهي ليست الموضوع الأساسي للتخصص."},{"n":2,"ch":1,"qe":"Why is computer science broader than simply learning how to use computers?","qa":"لماذا يُعد علم الحاسوب أوسع من مجرد تعلم كيفية استخدام الحواسيب؟","o":[{"l":"A","e":"Computers are not used in computer science","a":"لا تُستخدم الحواسيب في علم الحاسوب"},{"l":"B","e":"Computer science studies fundamental principles of computation and information","a":"يدرس علم الحاسوب المبادئ الأساسية للحوسبة والمعلومات"},{"l":"C","e":"Computer science only studies mathematics","a":"يدرس علم الحاسوب الرياضيات فقط"},{"l":"D","e":"Computer science focuses exclusively on hardware","a":"يركز علم الحاسوب على العتاد حصراً"}],"c":"B","xe":"Using a computer is a practical skill, but computer science goes further by studying the theoretical and conceptual foundations of computation, information representation, and algorithmic problem-solving. This distinguishes it from mere computer literacy.","xa":"استخدام الحاسوب مهارة عملية، لكن علم الحاسوب يتجاوز ذلك إلى دراسة الأسس النظرية والمفاهيمية للحوسبة (Computation) وتمثيل المعلومات (Information Representation) وحل المشكلات خوارزمياً. هذا ما يميزه عن مجرد الإلمام باستخدام الحاسوب."},{"n":3,"ch":1,"qe":"What is computation?","qa":"ما هي الحوسبة؟","o":[{"l":"A","e":"The physical movement of a computer","a":"الحركة المادية للحاسوب"},{"l":"B","e":"The process of transforming input into output according to rules","a":"عملية تحويل المدخلات إلى مخرجات وفقاً لقواعد"},{"l":"C","e":"The design of computer cases","a":"تصميم صناديق الحاسوب"},{"l":"D","e":"The process of connecting a keyboard","a":"عملية توصيل لوحة المفاتيح"}],"c":"B","xe":"Computation is the systematic process of taking input data, applying a set of rules or instructions, and producing output. It is not about physical movement or hardware design.","xa":"الحوسبة (Computation) هي العملية المنهجية التي تأخذ بيانات مدخلة (Input)، وتطبق عليها مجموعة من القواعد أو التعليمات، لتنتج مخرجات (Output). وهي ليست حركة مادية أو تصميماً للعتاد."},{"n":4,"ch":1,"qe":"Which of the following is an example of computation?","qa":"أي مما يلي يُعد مثالاً على الحوسبة؟","o":[{"l":"A","e":"A calculator adding two numbers","a":"آلة حاسبة تجمع رقمين"},{"l":"B","e":"Turning off a monitor","a":"إيقاف تشغيل الشاشة"},{"l":"C","e":"Cleaning a keyboard","a":"تنظيف لوحة المفاتيح"},{"l":"D","e":"Carrying a laptop","a":"حمل حاسوب محمول"}],"c":"A","xe":"Adding two numbers involves taking inputs, applying a rule (addition), and producing an output, which is the essence of computation. The other actions are physical operations that do not involve rule-based transformation of information.","xa":"جمع رقمين يتضمن أخذ مدخلات وتطبيق قاعدة (الجمع) وإنتاج مخرجات، وهذا هو جوهر الحوسبة. أما الإجراءات الأخرى فهي عمليات مادية لا تتضمن تحويلاً للمعلومات وفق قواعد."},{"n":5,"ch":1,"qe":"What is an algorithm?","qa":"ما هي الخوارزمية؟","o":[{"l":"A","e":"A physical component of a computer","a":"مكون مادي في الحاسوب"},{"l":"B","e":"A programming language","a":"لغة برمجة"},{"l":"C","e":"A precise procedure for solving a problem or completing a task","a":"إجراء دقيق لحل مشكلة أو إنجاز مهمة"},{"l":"D","e":"A type of computer memory","a":"نوع من ذاكرة الحاسوب"}],"c":"C","xe":"An algorithm is a finite, well-defined sequence of steps that specifies how to solve a problem or perform a task. It is a conceptual procedure, not a physical component, language, or memory type.","xa":"الخوارزمية (Algorithm) هي تسلسل محدد ومنتهٍ من الخطوات يوضح كيفية حل مشكلة أو أداء مهمة. وهي إجراء مفاهيمي، وليست مكوناً مادياً أو لغة برمجة أو نوعاً من الذاكرة."},{"n":6,"ch":1,"qe":"Why are algorithms important in computer science?","qa":"لماذا تُعد الخوارزميات مهمة في علم الحاسوب؟","o":[{"l":"A","e":"They make computers physically smaller","a":"تجعل الحواسيب أصغر حجماً"},{"l":"B","e":"They provide systematic procedures for solving problems","a":"توفر إجراءات منهجية لحل المشكلات"},{"l":"C","e":"They replace computer hardware","a":"تحل محل عتاد الحاسوب"},{"l":"D","e":"They eliminate the need for data","a":"تلغي الحاجة إلى البيانات"}],"c":"B","xe":"Algorithms are the core of computer science because they offer systematic, step-by-step methods for solving computational problems. They do not affect physical size, replace hardware, or eliminate data.","xa":"الخوارزميات هي جوهر علم الحاسوب لأنها تقدم طرقاً منهجية خطوة بخطوة لحل المشكلات الحاسوبية. وهي لا تؤثر على الحجم المادي ولا تحل محل العتاد ولا تلغي الحاجة إلى البيانات."},{"n":7,"ch":1,"qe":"What does computational thinking involve?","qa":"ماذا يتضمن التفكير الحاسوبي؟","o":[{"l":"A","e":"Memorizing computer brands","a":"حفظ ماركات الحواسيب"},{"l":"B","e":"Breaking problems down and developing systematic solutions","a":"تقسيم المشكلات وتطوير حلول منهجية"},{"l":"C","e":"Learning how to repair monitors","a":"تعلم كيفية إصلاح الشاشات"},{"l":"D","e":"Purchasing faster computers","a":"شراء حواسيب أسرع"}],"c":"B","xe":"Computational thinking (التفكير الحاسوبي) is a problem-solving approach that involves decomposition, pattern recognition, abstraction, and algorithmic design. It is a mental framework, not a physical or purchasing activity.","xa":"التفكير الحاسوبي (Computational Thinking) هو نهج لحل المشكلات يتضمن التفكيك (Decomposition) والتعرف على الأنماط (Pattern Recognition) والتجريد (Abstraction) والتصميم الخوارزمي (Algorithmic Design). وهو إطار ذهني وليس نشاطاً مادياً أو شرائياً."},{"n":8,"ch":1,"qe":"Which of the following is an example of decomposition?","qa":"أي مما يلي يُعد مثالاً على التفكيك (Decomposition)؟","o":[{"l":"A","e":"Ignoring a problem","a":"تجاهل مشكلة"},{"l":"B","e":"Dividing a large software project into smaller components","a":"تقسيم مشروع برمجي كبير إلى مكونات أصغر"},{"l":"C","e":"Buying additional hardware","a":"شراء عتاد إضافي"},{"l":"D","e":"Deleting a program","a":"حذف برنامج"}],"c":"B","xe":"Decomposition is the process of breaking a complex problem or system into smaller, more manageable parts. Dividing a large project into components is a classic example of this computational thinking technique.","xa":"التفكيك (Decomposition) هو عملية تقسيم مشكلة أو نظام معقد إلى أجزاء أصغر وأسهل في الإدارة. تقسيم مشروع كبير إلى مكونات هو مثال كلاسيكي على هذه التقنية من التفكير الحاسوبي."},{"n":9,"ch":1,"qe":"What is pattern recognition?","qa":"ما هو التعرف على الأنماط؟","o":[{"l":"A","e":"Identifying similarities or recurring structures in problems","a":"تحديد أوجه التشابه أو الهياكل المتكررة في المشكلات"},{"l":"B","e":"Designing computer hardware","a":"تصميم عتاد الحاسوب"},{"l":"C","e":"Writing passwords","a":"كتابة كلمات المرور"},{"l":"D","e":"Installing an operating system","a":"تثبيت نظام تشغيل"}],"c":"A","xe":"Pattern recognition (التعرف على الأنماط) is a component of computational thinking that involves spotting similarities, trends, or recurring structures across different problems to find general solutions.","xa":"التعرف على الأنماط (Pattern Recognition) هو مكون من مكونات التفكير الحاسوبي يتضمن اكتشاف أوجه التشابه أو الاتجاهات أو الهياكل المتكررة عبر مشكلات مختلفة لإيجاد حلول عامة."},{"n":10,"ch":1,"qe":"What does abstraction mean in computer science?","qa":"ماذا يعني التجريد (Abstraction) في علم الحاسوب؟","o":[{"l":"A","e":"Making a problem more complicated","a":"جعل المشكلة أكثر تعقيداً"},{"l":"B","e":"Focusing on important characteristics while ignoring unnecessary details","a":"التركيز على الخصائص المهمة مع تجاهل التفاصيل غير الضرورية"},{"l":"C","e":"Removing all information from a system","a":"إزالة كل المعلومات من النظام"},{"l":"D","e":"Converting software into hardware","a":"تحويل البرمجيات إلى عتاد"}],"c":"B","xe":"Abstraction is a fundamental concept that involves simplifying a system by concentrating on its essential features and hiding or ignoring low-level or irrelevant details. It does not mean making things more complicated or deleting information.","xa":"التجريد (Abstraction) مفهوم أساسي يتضمن تبسيط نظام من خلال التركيز على خصائصه الجوهرية وإخفاء أو تجاهل التفاصيل منخفضة المستوى أو غير الضرورية. وهو لا يعني جعل الأمور أكثر تعقيداً أو حذف المعلومات."},{"n":11,"ch":1,"qe":"Why is programming considered part of computer science?","qa":"لماذا تُعد البرمجة جزءاً من علم الحاسوب؟","o":[{"l":"A","e":"Programming allows humans to express computational instructions","a":"البرمجة تسمح للبشر بالتعبير عن التعليمات الحاسوبية"},{"l":"B","e":"Programming only involves repairing computers","a":"البرمجة تتضمن إصلاح الحواسيب فقط"},{"l":"C","e":"Programming eliminates algorithms","a":"البرمجة تلغي الخوارزميات"},{"l":"D","e":"Programming is unrelated to computation","a":"البرمجة غير مرتبطة بالحوسبة"}],"c":"A","xe":"Programming is the primary means by which humans express algorithms and computational instructions in a form that computers can execute. It is deeply connected to computation and algorithms, not hardware repair.","xa":"البرمجة هي الوسيلة الأساسية التي يعبر بها البشر عن الخوارزميات والتعليمات الحاسوبية بشكل يمكن للحاسوب تنفيذه. وهي مرتبطة ارتباطاً وثيقاً بالحوسبة والخوارزميات، وليست إصلاحاً للعتاد."},{"n":12,"ch":1,"qe":"Why must instructions given to computers be precise?","qa":"لماذا يجب أن تكون التعليمات المعطاة للحواسيب دقيقة؟","o":[{"l":"A","e":"Computers cannot make assumptions in the same way humans can","a":"لا تستطيع الحواسيب افتراض الأشياء بنفس الطريقة التي يفعلها البشر"},{"l":"B","e":"Computers cannot store information","a":"لا تستطيع الحواسيب تخزين المعلومات"},{"l":"C","e":"Computers cannot perform calculations","a":"لا تستطيع الحواسيب إجراء العمليات الحسابية"},{"l":"D","e":"Computers do not use software","a":"لا تستخدم الحواسيب البرمجيات"}],"c":"A","xe":"Computers execute instructions literally and lack the common-sense reasoning or contextual understanding that humans use to fill in gaps. Therefore, instructions must be unambiguous and precise.","xa":"تنفذ الحواسيب التعليمات حرفياً وتفتقر إلى التفكير المنطقي العفوي أو الفهم السياقي الذي يستخدمه البشر لملء الفراغات. لذلك، يجب أن تكون التعليمات واضحة ودقيقة وغير قابلة للتفسير الخاطئ."},{"n":13,"ch":1,"qe":"Which of the following is a programming language?","qa":"أي مما يلي يُعد لغة برمجة؟","o":[{"l":"A","e":"Python","a":"بايثون"},{"l":"B","e":"Algorithm","a":"خوارزمية"},{"l":"C","e":"Database","a":"قاعدة بيانات"},{"l":"D","e":"Keyboard","a":"لوحة مفاتيح"}],"c":"A","xe":"Python is a high-level programming language used to write instructions for computers. An algorithm is a procedure, a database is a structured collection of data, and a keyboard is a hardware input device.","xa":"بايثون (Python) هي لغة برمجة عالية المستوى تُستخدم لكتابة تعليمات للحواسيب. أما الخوارزمية فهي إجراء، وقاعدة البيانات هي مجموعة منظمة من البيانات، ولوحة المفاتيح هي جهاز إدخال مادي."},{"n":14,"ch":1,"qe":"Which area of computer science studies mathematical foundations and computational complexity?","qa":"أي مجال في علم الحاسوب يدرس الأسس الرياضية والتعقيد الحسابي؟","o":[{"l":"A","e":"Web design","a":"تصميم الويب"},{"l":"B","e":"Theoretical computer science","a":"علم الحاسوب النظري"},{"l":"C","e":"Computer graphics","a":"الرسوميات الحاسوبية"},{"l":"D","e":"Technical support","a":"الدعم الفني"}],"c":"B","xe":"Theoretical computer science focuses on the mathematical and logical foundations of computation, including complexity theory, which studies the resources required to solve computational problems.","xa":"يركز علم الحاسوب النظري (Theoretical Computer Science) على الأسس الرياضية والمنطقية للحوسبة، بما في ذلك نظرية التعقيد (Complexity Theory) التي تدرس الموارد اللازمة لحل المشكلات الحاسوبية."},{"n":15,"ch":1,"qe":"What is the main focus of software engineering?","qa":"ما هو التركيز الرئيسي لهندسة البرمجيات؟","o":[{"l":"A","e":"Designing and maintaining software systems","a":"تصميم وصيانة أنظمة البرمجيات"},{"l":"B","e":"Manufacturing computer screens","a":"تصنيع شاشات الحاسوب"},{"l":"C","e":"Building electrical circuits only","a":"بناء الدوائر الكهربائية فقط"},{"l":"D","e":"Selling computers","a":"بيع الحواسيب"}],"c":"A","xe":"Software engineering is the discipline concerned with the systematic design, development, testing, and maintenance of software systems. It is not about manufacturing hardware or selling computers.","xa":"هندسة البرمجيات (Software Engineering) هي التخصص المعني بالتصميم والتطوير والاختبار والصيانة المنهجية لأنظمة البرمجيات. وهي لا تتعلق بتصنيع العتاد أو بيع الحواسيب."},{"n":16,"ch":1,"qe":"Which field focuses on protecting systems, networks, software, and information?","qa":"أي مجال يركز على حماية الأنظمة والشبكات والبرمجيات والمعلومات؟","o":[{"l":"A","e":"Computer graphics","a":"الرسوميات الحاسوبية"},{"l":"B","e":"Cybersecurity","a":"الأمن السيبراني"},{"l":"C","e":"Database design","a":"تصميم قواعد البيانات"},{"l":"D","e":"Human-computer interaction","a":"التفاعل بين الإنسان والحاسوب"}],"c":"B","xe":"Cybersecurity is the practice of protecting systems, networks, programs, and data from digital attacks, unauthorized access, and damage.","xa":"الأمن السيبراني (Cybersecurity) هو ممارسة حماية الأنظمة والشبكات والبرامج والبيانات من الهجمات الرقمية والوصول غير المصرح به والأضرار."},{"n":17,"ch":1,"qe":"What does a database primarily help with?","qa":"بماذا تساعد قاعدة البيانات بشكل أساسي؟","o":[{"l":"A","e":"Storing and managing information","a":"تخزين وإدارة المعلومات"},{"l":"B","e":"Increasing monitor brightness","a":"زيادة سطوع الشاشة"},{"l":"C","e":"Cooling a processor","a":"تبريد المعالج"},{"l":"D","e":"Connecting a mouse","a":"توصيل الفأرة"}],"c":"A","xe":"A database is an organized collection of structured information or data, typically stored electronically in a computer system, designed for efficient storage, retrieval, and management.","xa":"قاعدة البيانات (Database) هي مجموعة منظمة من المعلومات أو البيانات المهيكلة، تُخزن عادةً إلكترونياً في نظام حاسوبي، وهي مصممة للتخزين والاسترجاع والإدارة بكفاءة."},{"n":18,"ch":1,"qe":"What is the purpose of computer networks?","qa":"ما هو الغرض من شبكات الحاسوب؟","o":[{"l":"A","e":"To allow computers and devices to communicate","a":"السماح للحواسيب والأجهزة بالتواصل"},{"l":"B","e":"To increase keyboard size","a":"زيادة حجم لوحة المفاتيح"},{"l":"C","e":"To replace algorithms","a":"استبدال الخوارزميات"},{"l":"D","e":"To eliminate data","a":"إلغاء البيانات"}],"c":"A","xe":"Computer networks are designed to enable communication and resource sharing between connected computers and devices. They do not replace algorithms or eliminate data.","xa":"صُممت شبكات الحاسوب (Computer Networks) لتمكين التواصل ومشاركة الموارد بين الحواسيب والأجهزة المتصلة. وهي لا تستبدل الخوارزميات ولا تلغي البيانات."},{"n":19,"ch":1,"qe":"Which field studies systems capable of performing tasks associated with intelligent behavior?","qa":"أي مجال يدرس الأنظمة القادرة على أداء مهام مرتبطة بالسلوك الذكي؟","o":[{"l":"A","e":"Artificial intelligence","a":"الذكاء الاصطناعي"},{"l":"B","e":"Computer architecture","a":"بنية الحاسوب"},{"l":"C","e":"File management","a":"إدارة الملفات"},{"l":"D","e":"Hardware maintenance","a":"صيانة العتاد"}],"c":"A","xe":"Artificial intelligence (AI) is the branch of computer science that studies and develops systems capable of performing tasks that typically require human intelligence, such as learning, reasoning, and problem-solving.","xa":"الذكاء الاصطناعي (Artificial Intelligence) هو فرع من علم الحاسوب يدرس ويطور أنظمة قادرة على أداء مهام تتطلب عادةً ذكاءً بشرياً، مثل التعلم والاستدلال وحل المشكلات."},{"n":20,"ch":1,"qe":"What does human-computer interaction study?","qa":"ماذا يدرس التفاعل بين الإنسان والحاسوب؟","o":[{"l":"A","e":"How people interact with computing systems","a":"كيف يتفاعل الناس مع الأنظمة الحاسوبية"},{"l":"B","e":"How processors are manufactured","a":"كيف تُصنع المعالجات"},{"l":"C","e":"How electricity is generated","a":"كيف تُولد الكهرباء"},{"l":"D","e":"How databases are physically stored","a":"كيف تُخزن قواعد البيانات مادياً"}],"c":"A","xe":"Human-computer interaction (HCI) is the study of how people interact with computers and to what extent computers are or are not developed for successful interaction with human beings.","xa":"التفاعل بين الإنسان والحاسوب (Human-Computer Interaction) هو دراسة كيفية تفاعل الناس مع الحواسيب وإلى أي مدى تُطوَّر الحواسيب لتحقيق تفاعل ناجح مع البشر."},{"n":21,"ch":1,"qe":"Why is algorithm efficiency important?","qa":"لماذا تُعد كفاءة الخوارزمية مهمة؟","o":[{"l":"A","e":"Inefficient algorithms can become impractical as data grows","a":"يمكن أن تصبح الخوارزميات غير الفعالة غير عملية مع نمو البيانات"},{"l":"B","e":"Efficient algorithms require no programming","a":"الخوارزميات الفعالة لا تتطلب برمجة"},{"l":"C","e":"Efficiency only affects computer appearance","a":"الكفاءة تؤثر فقط على مظهر الحاسوب"},{"l":"D","e":"Algorithms never process large amounts of data","a":"الخوارزميات لا تعالج أبداً كميات كبيرة من البيانات"}],"c":"A","xe":"As the size of input data increases, the resource requirements (time, memory) of an algorithm grow. Inefficient algorithms may become too slow or require too much memory to be practically useful.","xa":"مع زيادة حجم بيانات الإدخال، تنمو متطلبات الموارد (الوقت والذاكرة) للخوارزمية. قد تصبح الخوارزميات غير الفعالة بطيئة جداً أو تتطلب ذاكرة كبيرة جداً بحيث لا تكون عملية."},{"n":22,"ch":1,"qe":"Which example best demonstrates computational thinking?","qa":"أي مثال يوضح بشكل أفضل التفكير الحاسوبي؟","o":[{"l":"A","e":"Breaking a complex problem into smaller manageable parts","a":"تقسيم مشكلة معقدة إلى أجزاء أصغر قابلة للإدارة"},{"l":"B","e":"Guessing an answer without analysis","a":"تخمين إجابة دون تحليل"},{"l":"C","e":"Avoiding difficult problems","a":"تجنب المشكلات الصعبة"},{"l":"D","e":"Replacing a computer","a":"استبدال حاسوب"}],"c":"A","xe":"Decomposition, or breaking down a complex problem into smaller parts, is a core element of computational thinking. It allows for systematic analysis and solution development.","xa":"التفكيك (Decomposition)، أو تقسيم مشكلة معقدة إلى أجزاء أصغر، هو عنصر أساسي في التفكير الحاسوبي. وهو يسمح بالتحليل المنهجي وتطوير الحلول."},{"n":23,"ch":1,"qe":"Why can learning programming improve problem-solving skills?","qa":"لماذا يمكن أن يؤدي تعلم البرمجة إلى تحسين مهارات حل المشكلات؟","o":[{"l":"A","e":"Programming requires precise logical thinking","a":"البرمجة تتطلب تفكيراً منطقياً دقيقاً"},{"l":"B","e":"Programming eliminates the need for reasoning","a":"البرمجة تلغي الحاجة إلى التفكير المنطقي"},{"l":"C","e":"Programming only requires memorization","a":"البرمجة تتطلب الحفظ فقط"},{"l":"D","e":"Programming does not involve problem-solving","a":"البرمجة لا تتضمن حل المشكلات"}],"c":"A","xe":"Programming demands the ability to think logically, break problems into steps, and design precise instructions. This practice strengthens general problem-solving skills.","xa":"تتطلب البرمجة القدرة على التفكير المنطقي وتقسيم المشكلات إلى خطوات وتصميم تعليمات دقيقة. هذه الممارسة تقوي مهارات حل المشكلات العامة."},{"n":24,"ch":1,"qe":"What is one major purpose of abstraction?","qa":"ما هو أحد الأغراض الرئيسية للتجريد؟","o":[{"l":"A","e":"To simplify complex systems by concentrating on essential features","a":"تبسيط الأنظمة المعقدة من خلال التركيز على الخصائص الجوهرية"},{"l":"B","e":"To increase unnecessary complexity","a":"زيادة التعقيد غير الضروري"},{"l":"C","e":"To remove all data","a":"إزالة كل البيانات"},{"l":"D","e":"To prevent computers from communicating","a":"منع الحواسيب من التواصل"}],"c":"A","xe":"The primary purpose of abstraction is to manage complexity by hiding unnecessary details and focusing on the essential characteristics relevant to the problem at hand.","xa":"الغرض الرئيسي من التجريد (Abstraction) هو إدارة التعقيد من خلال إخفاء التفاصيل غير الضرورية والتركيز على الخصائص الجوهرية ذات الصلة بالمشكلة المطروحة."},{"n":25,"ch":1,"qe":"Which of the following is NOT a major area of computer science?","qa":"أي مما يلي ليس مجالاً رئيسياً في علم الحاسوب؟","o":[{"l":"A","e":"Cybersecurity","a":"الأمن السيبراني"},{"l":"B","e":"Artificial intelligence","a":"الذكاء الاصطناعي"},{"l":"C","e":"Algorithms","a":"الخوارزميات"},{"l":"D","e":"Hair styling","a":"تصفيف الشعر"}],"c":"D","xe":"Cybersecurity, artificial intelligence, and algorithms are all established areas within computer science. Hair styling is unrelated to the study of computation and information.","xa":"الأمن السيبراني والذكاء الاصطناعي والخوارزميات كلها مجالات راسخة ضمن علم الحاسوب. أما تصفيف الشعر فلا علاقة له بدراسة الحوسبة والمعلومات."},{"n":26,"ch":1,"qe":"Why does computer science have applications in medicine?","qa":"لماذا لعلم الحاسوب تطبيقات في الطب؟","o":[{"l":"A","e":"Computers can support medical imaging, research, records, and analysis","a":"يمكن للحواسيب دعم التصوير الطبي والبحث والسجلات والتحليل"},{"l":"B","e":"Computers replace all medical professionals","a":"تستبدل الحواسيب جميع المهنيين الطبيين"},{"l":"C","e":"Medicine does not use data","a":"الطب لا يستخدم البيانات"},{"l":"D","e":"Computers cannot process medical information","a":"لا تستطيع الحواسيب معالجة المعلومات الطبية"}],"c":"A","xe":"Computer science contributes to medicine through tools for medical imaging, electronic health records, bioinformatics, and data analysis, enhancing diagnosis and research. Computers do not replace professionals.","xa":"يساهم علم الحاسوب في الطب من خلال أدوات التصوير الطبي والسجلات الصحية الإلكترونية والمعلوماتية الحيوية وتحليل البيانات، مما يعزز التشخيص والبحث. ولا تستبدل الحواسيب المهنيين."},{"n":27,"ch":1,"qe":"What is one reason computer science is important in finance?","qa":"ما هو أحد أسباب أهمية علم الحاسوب في التمويل؟","o":[{"l":"A","e":"Computers can process transactions and analyze financial information","a":"يمكن للحواسيب معالجة المعاملات وتحليل المعلومات المالية"},{"l":"B","e":"Financial systems do not use computers","a":"الأنظمة المالية لا تستخدم الحواسيب"},{"l":"C","e":"Computers are only used for entertainment","a":"تُستخدم الحواسيب للترفيه فقط"},{"l":"D","e":"Algorithms cannot process financial data","a":"لا تستطيع الخوارزميات معالجة البيانات المالية"}],"c":"A","xe":"Computer science is vital in finance for automating transactions, analyzing market data, managing risk, and detecting fraud through algorithms and computational systems.","xa":"علم الحاسوب حيوي في التمويل لأتمتة المعاملات وتحليل بيانات السوق وإدارة المخاطر وكشف الاحتيال من خلال الخوارزميات والأنظمة الحاسوبية."},{"n":28,"ch":1,"qe":"What is the best way for a beginner to develop computer science skills?","qa":"ما هي أفضل طريقة للمبتدئ لتطوير مهارات علم الحاسوب؟","o":[{"l":"A","e":"Memorize every programming language","a":"حفظ كل لغة برمجة"},{"l":"B","e":"Practice problem-solving, programming, experimentation, and debugging","a":"ممارسة حل المشكلات والبرمجة والتجريب وتصحيح الأخطاء"},{"l":"C","e":"Avoid making mistakes","a":"تجنب ارتكاب الأخطاء"},{"l":"D","e":"Study computer brands only","a":"دراسة ماركات الحواسيب فقط"}],"c":"B","xe":"Developing computer science skills requires active practice in problem-solving, writing code, experimenting, and learning from debugging. Memorization alone or avoiding mistakes is not effective.","xa":"تطوير مهارات علم الحاسوب يتطلب ممارسة نشطة في حل المشكلات وكتابة التعليمات البرمجية والتجريب والتعلم من تصحيح الأخطاء. الحفظ وحده أو تجنب الأخطاء ليس فعالاً."},{"n":29,"ch":1,"qe":"What should a beginner understand about mistakes in programming?","qa":"ماذا يجب أن يفهم المبتدئ عن الأخطاء في البرمجة؟","o":[{"l":"A","e":"Mistakes are a normal and useful part of learning","a":"الأخطاء جزء طبيعي ومفيد من التعلم"},{"l":"B","e":"Mistakes mean someone cannot become a programmer","a":"الأخطاء تعني أن الشخص لا يمكن أن يصبح مبرمجاً"},{"l":"C","e":"Mistakes should always be ignored","a":"يجب تجاهل الأخطاء دائماً"},{"l":"D","e":"Mistakes occur only because of hardware","a":"تحدث الأخطاء فقط بسبب العتاد"}],"c":"A","xe":"Errors are an inevitable and valuable part of the learning process in programming. They provide opportunities to understand concepts better and improve problem-solving skills.","xa":"الأخطاء (Mistakes) جزء لا مفر منه وقيم في عملية تعلم البرمجة. فهي توفر فرصاً لفهم المفاهيم بشكل أفضل وتحسين مهارات حل المشكلات."},{"n":30,"ch":1,"qe":"What is the central idea emphasized in Chapter 1?","qa":"ما هي الفكرة المركزية التي تم التأكيد عليها في الفصل الأول؟","o":[{"l":"A","e":"Computer science is mainly about buying computers","a":"علم الحاسوب يتعلق بشكل أساسي بشراء الحواسيب"},{"l":"B","e":"Computer science is fundamentally about solving problems through computation","a":"علم الحاسوب هو في جوهره حل المشكلات من خلال الحوسبة"},{"l":"C","e":"Computer science is only about programming","a":"علم الحاسوب يتعلق بالبرمجة فقط"},{"l":"D","e":"Computer science is only about computer hardware","a":"علم الحاسوب يتعلق بالعتاد فقط"}],"c":"B","xe":"The central theme of Chapter 1 is that computer science is a discipline focused on computational problem-solving, encompassing algorithms, abstraction, and the study of information processes, rather than just programming or hardware.","xa":"الفكرة المركزية للفصل الأول هي أن علم الحاسوب تخصص يركز على حل المشكلات حاسوبياً، ويشمل الخوارزميات والتجريد ودراسة عمليات المعلومات، وليس مجرد البرمجة أو العتاد."},{"n":1,"ch":2,"qe":"What was one of the earliest tools used for calculation?","qa":"ما هي إحدى أقدم الأدوات المستخدمة في الحساب؟","o":[{"l":"A","e":"Smartphone","a":"هاتف ذكي"},{"l":"B","e":"Abacus","a":"المعداد (Abacus)"},{"l":"C","e":"Microprocessor","a":"معالج دقيق"},{"l":"D","e":"Laptop","a":"حاسوب محمول"}],"c":"B","xe":"The abacus is one of the earliest known calculating tools, used for arithmetic long before electronic computers. Smartphones, microprocessors, and laptops are modern technologies.","xa":"المعداد (Abacus) هو من أقدم أدوات الحساب المعروفة، واستُخدم في العمليات الحسابية قبل الحواسيب الإلكترونية بوقت طويل. أما الهاتف الذكي والمعالج الدقيق والحاسوب المحمول فهي تقنيات حديثة."},{"n":2,"ch":2,"qe":"What was the Pascaline?","qa":"ما هي آلة باسكال (Pascaline)؟","o":[{"l":"A","e":"A mechanical calculator","a":"آلة حاسبة ميكانيكية"},{"l":"B","e":"An operating system","a":"نظام تشغيل"},{"l":"C","e":"A programming language","a":"لغة برمجة"},{"l":"D","e":"A computer network","a":"شبكة حاسوب"}],"c":"A","xe":"The Pascaline was a mechanical calculator invented by Blaise Pascal. It was not an operating system, programming language, or network.","xa":"آلة باسكال (Pascaline) كانت آلة حاسبة ميكانيكية اخترعها بليز باسكال. وهي ليست نظام تشغيل ولا لغة برمجة ولا شبكة حاسوب."},{"n":3,"ch":2,"qe":"Who designed the Difference Engine?","qa":"من صمم محرك الفروق (Difference Engine)؟","o":[{"l":"A","e":"Tim Berners-Lee","a":"تيم بيرنرز لي"},{"l":"B","e":"Charles Babbage","a":"تشارلز باباج"},{"l":"C","e":"Blaise Pascal","a":"بليز باسكال"},{"l":"D","e":"Alan Turing","a":"آلان تورنغ"}],"c":"B","xe":"Charles Babbage designed the Difference Engine, an early mechanical computing device intended to calculate mathematical tables. The other individuals are associated with different contributions.","xa":"صمم تشارلز باباج محرك الفروق (Difference Engine)، وهو جهاز حوسبة ميكانيكي مبكر يهدف إلى حساب الجداول الرياضية. أما الأشخاص الآخرون فمرتبطون بإسهامات مختلفة."},{"n":4,"ch":2,"qe":"What was significant about Babbage's Analytical Engine?","qa":"ما الذي كان مميزاً في محرك باباج التحليلي (Analytical Engine)؟","o":[{"l":"A","e":"It contained ideas resembling modern computer architecture","a":"احتوى على أفكار تشبه بنية الحاسوب الحديث"},{"l":"B","e":"It was the first smartphone","a":"كان أول هاتف ذكي"},{"l":"C","e":"It used the Internet","a":"استخدم الإنترنت"},{"l":"D","e":"It was powered by solar energy","a":"كان يعمل بالطاقة الشمسية"}],"c":"A","xe":"The Analytical Engine included concepts such as a processing unit, memory, and programmability, resembling modern computer architecture. It was mechanical and did not use the Internet or solar power.","xa":"تضمن المحرك التحليلي (Analytical Engine) مفاهيم مثل وحدة المعالجة والذاكرة وقابلية البرمجة، مما يشبه بنية الحاسوب الحديث. كان ميكانيكياً ولم يستخدم الإنترنت أو الطاقة الشمسية."},{"n":5,"ch":2,"qe":"Who is widely recognized as an early pioneer of programming associated with Babbage's work?","qa":"من يُعترف به على نطاق واسع كرائد مبكر للبرمجة مرتبط بعمل باباج؟","o":[{"l":"A","e":"Ada Lovelace","a":"آدا لوفلايس"},{"l":"B","e":"Steve Jobs","a":"ستيف جوبز"},{"l":"C","e":"Bill Gates","a":"بيل غيتس"},{"l":"D","e":"Tim Berners-Lee","a":"تيم بيرنرز لي"}],"c":"A","xe":"Ada Lovelace is recognized for her work on Babbage's Analytical Engine and for writing what is often considered an early algorithm, making her an early pioneer of programming.","xa":"تُعرف آدا لوفلايس بعملها على محرك باباج التحليلي وكتابة ما يُعتبر غالباً خوارزمية مبكرة، مما يجعلها رائدة مبكرة في البرمجة."},{"n":6,"ch":2,"qe":"What major technological development replaced many vacuum-tube applications?","qa":"ما التطور التكنولوجي الرئيسي الذي حل محل العديد من تطبيقات الأنابيب المفرغة (Vacuum Tubes)؟","o":[{"l":"A","e":"Transistors","a":"الترانزستورات"},{"l":"B","e":"Mechanical gears","a":"التروس الميكانيكية"},{"l":"C","e":"Paper cards","a":"البطاقات الورقية"},{"l":"D","e":"Typewriters","a":"الآلات الكاتبة"}],"c":"A","xe":"Transistors replaced vacuum tubes in many electronic applications because they were smaller, more reliable, and more efficient. Mechanical gears, paper cards, and typewriters are not electronic replacements.","xa":"حلت الترانزستورات (Transistors) محل الأنابيب المفرغة في العديد من التطبيقات الإلكترونية لأنها أصغر وأكثر موثوقية وكفاءة. أما التروس الميكانيكية والبطاقات الورقية والآلات الكاتبة فليست بدائل إلكترونية."},{"n":7,"ch":2,"qe":"Why were transistors important?","qa":"لماذا كانت الترانزستورات مهمة؟","o":[{"l":"A","e":"They were smaller, more reliable, and more energy-efficient than vacuum tubes","a":"كانت أصغر وأكثر موثوقية وأكثر كفاءة في استهلاك الطاقة من الأنابيب المفرغة"},{"l":"B","e":"They made computers larger","a":"جعلت الحواسيب أكبر"},{"l":"C","e":"They eliminated electricity","a":"ألغت الكهرباء"},{"l":"D","e":"They prevented software development","a":"منعت تطوير البرمجيات"}],"c":"A","xe":"Transistors enabled computers to become smaller, more dependable, and less power-hungry compared with vacuum-tube systems. They did not eliminate electricity or prevent software development.","xa":"مكنت الترانزستورات الحواسيب من أن تصبح أصغر وأكثر اعتمادية وأقل استهلاكاً للطاقة مقارنة بأنظمة الأنابيب المفرغة. ولم تُلغِ الكهرباء ولم تمنع تطوير البرمجيات."},{"n":8,"ch":2,"qe":"What is an integrated circuit?","qa":"ما هي الدائرة المتكاملة (Integrated Circuit)؟","o":[{"l":"A","e":"A system that places multiple electronic components on a small semiconductor","a":"نظام يضع مكونات إلكترونية متعددة على شريحة أشباه موصلات صغيرة"},{"l":"B","e":"A type of keyboard","a":"نوع من لوحات المفاتيح"},{"l":"C","e":"A programming language","a":"لغة برمجة"},{"l":"D","e":"A computer game","a":"لعبة حاسوب"}],"c":"A","xe":"An integrated circuit (IC) combines many electronic components, such as transistors, on a single small semiconductor chip. It is not a keyboard, language, or game.","xa":"الدائرة المتكاملة (Integrated Circuit) تجمع العديد من المكونات الإلكترونية مثل الترانزستورات على شريحة أشباه موصلات صغيرة واحدة. وهي ليست لوحة مفاتيح ولا لغة برمجة ولا لعبة."},{"n":9,"ch":2,"qe":"What did the microprocessor make possible?","qa":"ماذا جعل المعالج الدقيق (Microprocessor) ممكناً؟","o":[{"l":"A","e":"Placing central processing functions on a single integrated circuit","a":"وضع وظائف المعالجة المركزية على دائرة متكاملة واحدة"},{"l":"B","e":"Eliminating computer memory","a":"إلغاء ذاكرة الحاسوب"},{"l":"C","e":"Removing electronic components","a":"إزالة المكونات الإلكترونية"},{"l":"D","e":"Replacing all software with mechanical parts","a":"استبدال كل البرمجيات بأجزاء ميكانيكية"}],"c":"A","xe":"The microprocessor placed the central processing unit functions on a single integrated circuit, enabling smaller and more affordable computers.","xa":"جعل المعالج الدقيق (Microprocessor) وظائف وحدة المعالجة المركزية على دائرة متكاملة واحدة، مما أتاح حواسيب أصغر وأقل تكلفة."},{"n":10,"ch":2,"qe":"What was a major advantage of electronic computers over mechanical computers?","qa":"ما كانت الميزة الرئيسية للحواسيب الإلكترونية على الحواسيب الميكانيكية؟","o":[{"l":"A","e":"Greater speed","a":"سرعة أكبر"},{"l":"B","e":"Larger physical size","a":"حجم مادي أكبر"},{"l":"C","e":"More manual operation","a":"تشغيل يدوي أكثر"},{"l":"D","e":"Less ability to calculate","a":"قدرة أقل على الحساب"}],"c":"A","xe":"Electronic computers could perform calculations much faster than mechanical computers. Larger size, more manual operation, and less calculation ability are disadvantages, not advantages.","xa":"كانت الحواسيب الإلكترونية قادرة على إجراء العمليات الحسابية أسرع بكثير من الحواسيب الميكانيكية. أما الحجم الأكبر والتشغيل اليدوي الأكثر والقدرة الأقل على الحساب فهي عيوب وليست مزايا."},{"n":11,"ch":2,"qe":"What is the stored-program concept?","qa":"ما هو مفهوم البرنامج المخزن (Stored-Program Concept)؟","o":[{"l":"A","e":"Storing instructions in memory so they can be executed without physically rewiring the machine","a":"تخزين التعليمات في الذاكرة بحيث يمكن تنفيذها دون إعادة توصيل الآلة مادياً"},{"l":"B","e":"Storing computers in warehouses","a":"تخزين الحواسيب في مستودعات"},{"l":"C","e":"Saving only photographs","a":"حفظ الصور الفوتوغرافية فقط"},{"l":"D","e":"Using paper instead of memory","a":"استخدام الورق بدلاً من الذاكرة"}],"c":"A","xe":"The stored-program concept means that both data and instructions are stored in memory, allowing a computer to run different programs without physical rewiring.","xa":"مفهوم البرنامج المخزن (Stored-Program Concept) يعني تخزين البيانات والتعليمات معاً في الذاكرة، مما يسمح للحاسوب بتشغيل برامج مختلفة دون إعادة توصيل مادي."},{"n":12,"ch":2,"qe":"Why was the stored-program concept important?","qa":"لماذا كان مفهوم البرنامج المخزن مهماً؟","o":[{"l":"A","e":"It allowed computers to be more flexible and programmable","a":"سمح للحواسيب بأن تكون أكثر مرونة وقابلية للبرمجة"},{"l":"B","e":"It eliminated processors","a":"ألغى المعالجات"},{"l":"C","e":"It prevented programs from changing","a":"منع البرامج من التغيير"},{"l":"D","e":"It made computers entirely mechanical","a":"جعل الحواسيب ميكانيكية بالكامل"}],"c":"A","xe":"Because instructions could be stored and changed in memory, computers became general-purpose and flexible. It did not eliminate processors or make computers mechanical.","xa":"لأن التعليمات أصبحت تُخزن وتُغير في الذاكرة، أصبحت الحواسيب عامة الغرض ومرنة. ولم يُلغِ المعالجات ولم يجعل الحواسيب ميكانيكية."},{"n":13,"ch":2,"qe":"What was ENIAC?","qa":"ما هو ENIAC؟","o":[{"l":"A","e":"An early electronic computer","a":"حاسوب إلكتروني مبكر"},{"l":"B","e":"A modern smartphone","a":"هاتف ذكي حديث"},{"l":"C","e":"A programming language","a":"لغة برمجة"},{"l":"D","e":"A web browser","a":"متصفح ويب"}],"c":"A","xe":"ENIAC was one of the earliest general-purpose electronic computers, built with vacuum tubes. It was not a smartphone, programming language, or browser.","xa":"كان ENIAC أحد أوائل الحواسيب الإلكترونية عامة الغرض، وقد بُني باستخدام الأنابيب المفرغة. ولم يكن هاتفاً ذكياً أو لغة برمجة أو متصفحاً."},{"n":14,"ch":2,"qe":"What technology was used extensively in early electronic computers?","qa":"ما التقنية التي استُخدمت على نطاق واسع في الحواسيب الإلكترونية المبكرة؟","o":[{"l":"A","e":"Vacuum tubes","a":"الأنابيب المفرغة"},{"l":"B","e":"Touchscreens","a":"شاشات اللمس"},{"l":"C","e":"Solid-state drives","a":"محركات الأقراص الصلبة (SSD)"},{"l":"D","e":"Wi-Fi","a":"الواي فاي"}],"c":"A","xe":"Early electronic computers such as ENIAC used vacuum tubes extensively. Touchscreens, SSDs, and Wi-Fi are much later technologies.","xa":"استخدمت الحواسيب الإلكترونية المبكرة مثل ENIAC الأنابيب المفرغة (Vacuum Tubes) على نطاق واسع. أما شاشات اللمس ومحركات SSD والواي فاي فهي تقنيات أحدث بكثير."},{"n":15,"ch":2,"qe":"What did the development of integrated circuits help achieve?","qa":"ماذا ساعد تطوير الدوائر المتكاملة على تحقيقه؟","o":[{"l":"A","e":"Smaller and more powerful computers","a":"حواسيب أصغر وأكثر قوة"},{"l":"B","e":"Slower computers","a":"حواسيب أبطأ"},{"l":"C","e":"Computers without electricity","a":"حواسيب بدون كهرباء"},{"l":"D","e":"Elimination of digital information","a":"إلغاء المعلومات الرقمية"}],"c":"A","xe":"Integrated circuits allowed many components to be packed onto a single chip, enabling smaller, faster, and more powerful computers.","xa":"سمحت الدوائر المتكاملة (Integrated Circuits) بحشر العديد من المكونات على شريحة واحدة، مما أتاح حواسيب أصغر وأسرع وأكثر قوة."},{"n":16,"ch":2,"qe":"What contributed to the rise of personal computers?","qa":"ما الذي ساهم في ظهور الحواسيب الشخصية؟","o":[{"l":"A","e":"The development of microprocessors and increasingly affordable computing technology","a":"تطوير المعالجات الدقيقة وتقنية الحوسبة المتزايدة الانخفاض في التكلفة"},{"l":"B","e":"The disappearance of electronic circuits","a":"اختفاء الدوائر الإلكترونية"},{"l":"C","e":"The elimination of software","a":"إلغاء البرمجيات"},{"l":"D","e":"The invention of the abacus","a":"اختراع المعداد"}],"c":"A","xe":"Microprocessors made computing power compact and affordable, which was crucial for the emergence and spread of personal computers.","xa":"جعلت المعالجات الدقيقة (Microprocessors) قوة الحوسبة مدمجة وبأسعار معقولة، مما كان حاسماً لظهور وانتشار الحواسيب الشخصية."},{"n":17,"ch":2,"qe":"What did personal computers change?","qa":"ماذا غيرت الحواسيب الشخصية؟","o":[{"l":"A","e":"They made computing increasingly accessible to individuals","a":"جعلت الحوسبة متاحة بشكل متزايد للأفراد"},{"l":"B","e":"They eliminated computer networks","a":"ألغت شبكات الحاسوب"},{"l":"C","e":"They made computers exclusively governmental","a":"جعلت الحواسيب حكومية حصراً"},{"l":"D","e":"They prevented programming","a":"منعت البرمجة"}],"c":"A","xe":"Personal computers brought computing into homes, schools, and small businesses, making it accessible to individuals rather than only large organizations.","xa":"أدخلت الحواسيب الشخصية الحوسبة إلى المنازل والمدارس والأعمال الصغيرة، وجعلتها متاحة للأفراد وليس فقط للمؤسسات الكبيرة."},{"n":18,"ch":2,"qe":"What is the Internet?","qa":"ما هو الإنترنت؟","o":[{"l":"A","e":"A global system of interconnected networks","a":"نظام عالمي من الشبكات المترابطة"},{"l":"B","e":"A type of CPU","a":"نوع من وحدات المعالجة المركزية"},{"l":"C","e":"A computer keyboard","a":"لوحة مفاتيح حاسوب"},{"l":"D","e":"A storage device","a":"جهاز تخزين"}],"c":"A","xe":"The Internet is a worldwide system of interconnected computer networks that enables communication and data exchange. It is not a CPU, keyboard, or storage device.","xa":"الإنترنت (Internet) هو نظام عالمي من شبكات الحاسوب المترابطة يتيح التواصل وتبادل البيانات. وهو ليس وحدة معالجة مركزية ولا لوحة مفاتيح ولا جهاز تخزين."},{"n":19,"ch":2,"qe":"Who developed the World Wide Web?","qa":"من طور الشبكة العنكبوتية العالمية (World Wide Web)؟","o":[{"l":"A","e":"Tim Berners-Lee","a":"تيم بيرنرز لي"},{"l":"B","e":"Charles Babbage","a":"تشارلز باباج"},{"l":"C","e":"Blaise Pascal","a":"بليز باسكال"},{"l":"D","e":"Ada Lovelace","a":"آدا لوفلايس"}],"c":"A","xe":"Tim Berners-Lee invented the World Wide Web, which made linked information accessible through browsers. The other individuals are associated with earlier computing history.","xa":"اخترع تيم بيرنرز لي الشبكة العنكبوتية العالمية (World Wide Web)، التي جعلت المعلومات المترابطة متاحة عبر المتصفحات. أما الآخرون فمرتبطون بتاريخ حوسبة أقدم."},{"n":20,"ch":2,"qe":"What did the World Wide Web make easier?","qa":"ما الذي سهّلته الشبكة العنكبوتية العالمية؟","o":[{"l":"A","e":"Accessing linked information through browsers","a":"الوصول إلى المعلومات المترابطة عبر المتصفحات"},{"l":"B","e":"Manufacturing processors","a":"تصنيع المعالجات"},{"l":"C","e":"Replacing all computer hardware","a":"استبدال كل عتاد الحاسوب"},{"l":"D","e":"Performing mechanical calculations","a":"إجراء الحسابات الميكانيكية"}],"c":"A","xe":"The World Wide Web enabled users to access and navigate linked documents and resources through web browsers, greatly simplifying information sharing.","xa":"مكّنت الشبكة العنكبوتية العالمية (World Wide Web) المستخدمين من الوصول إلى المستندات والموارد المترابطة والتنقل بينها عبر متصفحات الويب، مما سهّل مشاركة المعلومات بشكل كبير."},{"n":21,"ch":2,"qe":"What is mobile computing?","qa":"ما هي الحوسبة المتنقلة (Mobile Computing)؟","o":[{"l":"A","e":"Computing performed through portable devices such as smartphones and tablets","a":"الحوسبة التي تُجرى عبر أجهزة محمولة مثل الهواتف الذكية والأجهزة اللوحية"},{"l":"B","e":"Computing using only desktop computers","a":"الحوسبة باستخدام الحواسيب المكتبية فقط"},{"l":"C","e":"Mechanical calculation","a":"الحساب الميكانيكي"},{"l":"D","e":"Paper-based information processing","a":"معالجة المعلومات القائمة على الورق"}],"c":"A","xe":"Mobile computing refers to computing performed on portable devices that can be used while moving, such as smartphones, tablets, and laptops.","xa":"الحوسبة المتنقلة (Mobile Computing) تشير إلى الحوسبة التي تُجرى على أجهزة محمولة يمكن استخدامها أثناء التنقل، مثل الهواتف الذكية والأجهزة اللوحية والحواسيب المحمولة."},{"n":22,"ch":2,"qe":"What is cloud computing?","qa":"ما هي الحوسبة السحابية (Cloud Computing)؟","o":[{"l":"A","e":"Accessing computing resources and services through remote systems over networks","a":"الوصول إلى موارد وخدمات الحوسبة عبر أنظمة بعيدة عبر الشبكات"},{"l":"B","e":"Computing performed inside clouds","a":"الحوسبة التي تُجرى داخل السحب"},{"l":"C","e":"Using computers without networks","a":"استخدام الحواسيب بدون شبكات"},{"l":"D","e":"Storing information only on paper","a":"تخزين المعلومات على الورق فقط"}],"c":"A","xe":"Cloud computing provides on-demand access to computing resources such as storage, processing, and software over the Internet. It does not mean computing inside physical clouds.","xa":"توفر الحوسبة السحابية (Cloud Computing) وصولاً عند الطلب إلى موارد الحوسبة مثل التخزين والمعالجة والبرمجيات عبر الإنترنت. وهي لا تعني الحوسبة داخل سحب مادية."},{"n":23,"ch":2,"qe":"Why is cloud computing important?","qa":"لماذا تُعد الحوسبة السحابية مهمة؟","o":[{"l":"A","e":"It allows organizations and users to access remote computing resources","a":"تسمح للمؤسسات والمستخدمين بالوصول إلى موارد حوسبة بعيدة"},{"l":"B","e":"It eliminates all data storage","a":"تلغي كل تخزين البيانات"},{"l":"C","e":"It prevents network communication","a":"تمنع التواصل الشبكي"},{"l":"D","e":"It makes computers mechanical","a":"تجعل الحواسيب ميكانيكية"}],"c":"A","xe":"Cloud computing is important because it offers scalable, remote access to computing resources and services without requiring local physical infrastructure.","xa":"الحوسبة السحابية مهمة لأنها توفر وصولاً قابلاً للتوسع وعن بُعد إلى موارد وخدمات الحوسبة دون الحاجة إلى بنية تحتية مادية محلية."},{"n":24,"ch":2,"qe":"What has contributed to the recent growth of artificial intelligence?","qa":"ما الذي ساهم في النمو الأخير للذكاء الاصطناعي؟","o":[{"l":"A","e":"Advances in algorithms, data, hardware, and computational power","a":"التقدم في الخوارزميات والبيانات والعتاد وقوة الحوسبة"},{"l":"B","e":"Elimination of digital data","a":"إلغاء البيانات الرقمية"},{"l":"C","e":"Decline in computer processing power","a":"انخفاض قوة المعالجة الحاسوبية"},{"l":"D","e":"Return to mechanical calculators","a":"العودة إلى الآلات الحاسبة الميكانيكية"}],"c":"A","xe":"Recent AI growth is driven by better algorithms, large amounts of data, improved hardware such as GPUs, and greater computational power.","xa":"يُعزى النمو الأخير للذكاء الاصطناعي إلى خوارزميات أفضل وكميات كبيرة من البيانات وعتاد محسّن مثل وحدات GPU وقوة حوسبة أكبر."},{"n":25,"ch":2,"qe":"What does the history of computing demonstrate?","qa":"ماذا يوضح تاريخ الحوسبة؟","o":[{"l":"A","e":"Computing has evolved through continuous technological and conceptual development","a":"تطورت الحوسبة من خلال تطور تكنولوجي ومفاهيمي مستمر"},{"l":"B","e":"Computers appeared suddenly in their modern form","a":"ظهرت الحواسيب فجأة بشكلها الحديث"},{"l":"C","e":"Computing has remained unchanged","a":"بقيت الحوسبة دون تغيير"},{"l":"D","e":"Hardware is more important than ideas","a":"العتاد أهم من الأفكار"}],"c":"A","xe":"The history of computing shows gradual evolution through inventions, concepts, and technological advances rather than a sudden appearance of modern computers.","xa":"يوضح تاريخ الحوسبة تطوراً تدريجياً عبر اختراعات ومفاهيم وتقدم تكنولوجي، وليس ظهوراً مفاجئاً للحواسيب الحديثة."},{"n":26,"ch":2,"qe":"Which development came before the microprocessor?","qa":"أي تطور جاء قبل المعالج الدقيق؟","o":[{"l":"A","e":"Integrated circuits","a":"الدوائر المتكاملة"},{"l":"B","e":"Smartphones","a":"الهواتف الذكية"},{"l":"C","e":"Cloud computing","a":"الحوسبة السحابية"},{"l":"D","e":"Modern AI","a":"الذكاء الاصطناعي الحديث"}],"c":"A","xe":"Integrated circuits were developed before microprocessors. Smartphones, cloud computing, and modern AI came later.","xa":"طُورت الدوائر المتكاملة (Integrated Circuits) قبل المعالجات الدقيقة. أما الهواتف الذكية والحوسبة السحابية والذكاء الاصطناعي الحديث فقد جاءت لاحقاً."},{"n":27,"ch":2,"qe":"Which technology enabled computers to become smaller and more reliable than vacuum-tube systems?","qa":"أي تقنية مكّنت الحواسيب من أن تصبح أصغر وأكثر موثوقية من أنظمة الأنابيب المفرغة؟","o":[{"l":"A","e":"Transistors","a":"الترانزستورات"},{"l":"B","e":"Mechanical gears","a":"التروس الميكانيكية"},{"l":"C","e":"Paper files","a":"الملفات الورقية"},{"l":"D","e":"Typewriters","a":"الآلات الكاتبة"}],"c":"A","xe":"Transistors replaced vacuum tubes and made computers smaller, more reliable, and more energy-efficient.","xa":"حلت الترانزستورات (Transistors) محل الأنابيب المفرغة وجعلت الحواسيب أصغر وأكثر موثوقية وأكثر كفاءة في استهلاك الطاقة."},{"n":28,"ch":2,"qe":"What was one important idea associated with Ada Lovelace?","qa":"ما الفكرة المهمة المرتبطة بآدا لوفلايس؟","o":[{"l":"A","e":"A general-purpose machine could manipulate symbols beyond numerical calculation","a":"يمكن لآلة عامة الغرض معالجة الرموز بما يتجاوز الحساب العددي"},{"l":"B","e":"Computers should never use programs","a":"يجب ألا تستخدم الحواسيب البرامج أبداً"},{"l":"C","e":"Computers should only perform addition","a":"يجب أن تقوم الحواسيب بالجمع فقط"},{"l":"D","e":"Networks should replace processors","a":"يجب أن تستبدل الشبكات المعالجات"}],"c":"A","xe":"Ada Lovelace recognized that a general-purpose computing machine could work with symbols and more than just numbers, an important early insight into computing.","xa":"أدركت آدا لوفلايس أن آلة حوسبة عامة الغرض يمكنها التعامل مع الرموز وأكثر من مجرد الأرقام، وهي رؤية مبكرة مهمة في الحوسبة."},{"n":29,"ch":2,"qe":"Why is computing history useful to computer science students?","qa":"لماذا يُعد تاريخ الحوسبة مفيداً لطلاب علم الحاسوب؟","o":[{"l":"A","e":"It helps explain how current technologies and ideas developed","a":"يساعد في شرح كيفية تطور التقنيات والأفكار الحالية"},{"l":"B","e":"It eliminates the need to study modern computing","a":"يلغي الحاجة إلى دراسة الحوسبة الحديثة"},{"l":"C","e":"It only teaches hardware repair","a":"يعلّم إصلاح العتاد فقط"},{"l":"D","e":"It replaces programming practice","a":"يستبدل ممارسة البرمجة"}],"c":"A","xe":"Studying computing history helps students understand the origins and evolution of current technologies, concepts, and design decisions.","xa":"تساعد دراسة تاريخ الحوسبة الطلاب على فهم أصول وتطور التقنيات والمفاهيم وقرارات التصميم الحالية."},{"n":30,"ch":2,"qe":"What is likely to remain important even as computing technologies change?","qa":"ما الذي من المرجح أن يبقى مهماً حتى مع تغير تقنيات الحوسبة؟","o":[{"l":"A","e":"Fundamental concepts such as algorithms, computation, and information representation","a":"المفاهيم الأساسية مثل الخوارزميات والحوسبة وتمثيل المعلومات"},{"l":"B","e":"Specific computer brands","a":"ماركات حواسيب محددة"},{"l":"C","e":"Specific keyboard designs","a":"تصاميم لوحات مفاتيح محددة"},{"l":"D","e":"Particular screen sizes","a":"أحجام شاشات معينة"}],"c":"A","xe":"While specific technologies and products change, core concepts such as algorithms, computation, and information representation remain foundational to computer science.","xa":"على الرغم من تغير التقنيات والمنتجات المحددة، تبقى المفاهيم الأساسية مثل الخوارزميات والحوسبة وتمثيل المعلومات أساسية في علم الحاسوب."},{"n":1,"ch":3,"qe":"What is computer hardware?","qa":"ما هو عتاد الحاسوب؟","o":[{"l":"A","e":"Physical components of a computing system","a":"المكونات المادية لنظام حاسوبي"},{"l":"B","e":"Computer instructions","a":"تعليمات الحاسوب"},{"l":"C","e":"Internet websites","a":"مواقع الإنترنت"},{"l":"D","e":"Database records","a":"سجلات قواعد البيانات"}],"c":"A","xe":"Computer hardware refers to the tangible, physical parts of a computer system, such as the CPU, memory, motherboard, and storage devices. Instructions, websites, and database records are not physical hardware.","xa":"عتاد الحاسوب (Hardware) يشير إلى الأجزاء المادية الملموسة في نظام الحاسوب، مثل المعالج والذاكرة واللوحة الأم وأجهزة التخزين. أما التعليمات والمواقع وسجلات قواعد البيانات فليست عتاداً مادياً."},{"n":2,"ch":3,"qe":"What is the main function of the CPU?","qa":"ما هي الوظيفة الرئيسية لوحدة المعالجة المركزية؟ (نص السؤال ناقص في الملف؛ تم استنتاجه من الخيارات.)","o":[{"l":"A","e":"Execute instructions and perform computational operations","a":"تنفيذ التعليمات وإجراء العمليات الحسابية"},{"l":"B","e":"Store files permanently","a":"تخزين الملفات بشكل دائم"},{"l":"C","e":"Display webpages only","a":"عرض صفحات الويب فقط"},{"l":"D","e":"Connect users to social media","a":"توصيل المستخدمين بوسائل التواصل الاجتماعي"}],"c":"A","xe":"The CPU is the central processing unit responsible for executing program instructions and performing arithmetic and logical operations. Permanent storage, webpage display, and social media connectivity are handled by other components or software.","xa":"وحدة المعالجة المركزية (CPU) هي المسؤولة عن تنفيذ تعليمات البرامج وإجراء العمليات الحسابية والمنطقية. أما التخزين الدائم وعرض صفحات الويب والاتصال بوسائل التواصل فتتولاها مكونات أو برمجيات أخرى."},{"n":3,"ch":3,"qe":"What does CPU stand for?","qa":"ماذا يعني اختصار CPU؟","o":[{"l":"A","e":"Central Processing Unit","a":"وحدة المعالجة المركزية"},{"l":"B","e":"Computer Program Utility","a":"أداة برنامج الحاسوب"},{"l":"C","e":"Central Program User","a":"مستخدم البرنامج المركزي"},{"l":"D","e":"Computer Processing Utility","a":"أداة معالجة الحاسوب"}],"c":"A","xe":"CPU stands for Central Processing Unit, the main component that executes instructions. The other expansions are incorrect.","xa":"اختصار CPU يعني وحدة المعالجة المركزية (Central Processing Unit)، وهي المكون الرئيسي الذي ينفذ التعليمات. أما التوسعات الأخرى فهي غير صحيحة."},{"n":4,"ch":3,"qe":"What is the basic CPU instruction cycle?","qa":"ما هي دورة تعليمات المعالج الأساسية؟","o":[{"l":"A","e":"Fetch, decode, execute","a":"جلب، فك ترميز، تنفيذ"},{"l":"B","e":"Print, scan, copy","a":"طباعة، مسح، نسخ"},{"l":"C","e":"Save, delete, restart","a":"حفظ، حذف، إعادة تشغيل"},{"l":"D","e":"Connect, browse, disconnect","a":"اتصال، تصفح، قطع اتصال"}],"c":"A","xe":"The basic CPU instruction cycle consists of fetching an instruction from memory, decoding it to determine the operation, and executing it. The other options describe unrelated tasks.","xa":"تتكون دورة تعليمات المعالج الأساسية من جلب التعليمات من الذاكرة، ثم فك ترميزها لتحديد العملية، ثم تنفيذها. أما الخيارات الأخرى فتصف مهاماً غير مرتبطة."},{"n":5,"ch":3,"qe":"What is the purpose of the arithmetic logic unit?","qa":"ما هو الغرض من وحدة الحساب والمنطق (ALU)؟","o":[{"l":"A","e":"Performing arithmetic and logical operations","a":"إجراء العمليات الحسابية والمنطقية"},{"l":"B","e":"Storing files permanently","a":"تخزين الملفات بشكل دائم"},{"l":"C","e":"Connecting to Wi-Fi","a":"الاتصال بالواي فاي"},{"l":"D","e":"Displaying images","a":"عرض الصور"}],"c":"A","xe":"The arithmetic logic unit (ALU) is the part of the CPU that performs arithmetic calculations and logical comparisons. It does not store files permanently or handle network/display tasks.","xa":"وحدة الحساب والمنطق (ALU) هي الجزء من المعالج الذي يجري العمليات الحسابية والمقارنات المنطقية. وهي لا تخزن الملفات بشكل دائم ولا تتولى مهام الشبكة أو العرض."},{"n":6,"ch":3,"qe":"What are registers?","qa":"ما هي السجلات (Registers)؟","o":[{"l":"A","e":"Very fast temporary storage locations inside the CPU","a":"مواقع تخزين مؤقتة فائقة السرعة داخل المعالج"},{"l":"B","e":"External hard drives","a":"محركات أقراص صلبة خارجية"},{"l":"C","e":"Internet accounts","a":"حسابات إنترنت"},{"l":"D","e":"Software applications","a":"تطبيقات برمجية"}],"c":"A","xe":"Registers are small, extremely fast storage locations within the CPU used to hold data and instructions during processing. They are not external drives, accounts, or applications.","xa":"السجلات (Registers) هي مواقع تخزين صغيرة وسريعة جداً داخل المعالج تُستخدم لحفظ البيانات والتعليمات أثناء المعالجة. وهي ليست أقراصاً خارجية ولا حسابات ولا تطبيقات."},{"n":7,"ch":3,"qe":"What is RAM?","qa":"ما هي RAM؟","o":[{"l":"A","e":"Random Access Memory","a":"ذاكرة الوصول العشوائي"},{"l":"B","e":"Remote Application Manager","a":"مدير التطبيقات البعيد"},{"l":"C","e":"Readable Application Module","a":"وحدة تطبيق قابلة للقراءة"},{"l":"D","e":"Random Application Machine","a":"آلة تطبيقات عشوائية"}],"c":"A","xe":"RAM stands for Random Access Memory, a type of volatile memory used to store data and instructions currently in use. The other expansions are incorrect.","xa":"اختصار RAM يعني ذاكرة الوصول العشوائي (Random Access Memory)، وهي نوع من الذاكرة المتطايرة تُستخدم لتخزين البيانات والتعليمات قيد الاستخدام. أما التوسعات الأخرى فهي غير صحيحة."},{"n":8,"ch":3,"qe":"What is a major characteristic of RAM?","qa":"ما هي السمة الرئيسية لذاكرة RAM؟","o":[{"l":"A","e":"It is generally volatile","a":"أنها متطايرة عادةً"},{"l":"B","e":"It permanently stores information without power","a":"تخزن المعلومات بشكل دائم بدون طاقة"},{"l":"C","e":"It is a type of keyboard","a":"أنها نوع من لوحات المفاتيح"},{"l":"D","e":"It is only used for networking","a":"تُستخدم فقط للشبكات"}],"c":"A","xe":"RAM is generally volatile, meaning its contents are lost when power is removed. It is not permanent storage, a keyboard, or networking-only memory.","xa":"ذاكرة RAM متطايرة (Volatile) عادةً، أي أن محتوياتها تُفقد عند انقطاع الطاقة. وهي ليست تخزيناً دائماً ولا لوحة مفاتيح ولا ذاكرة للشبكات فقط."},{"n":9,"ch":3,"qe":"Which is an example of persistent storage?","qa":"أي مما يلي مثال على التخزين الدائم (Persistent Storage)؟","o":[{"l":"A","e":"Solid-state drive","a":"محرك أقراص الحالة الصلبة (SSD)"},{"l":"B","e":"CPU register","a":"سجل المعالج"},{"l":"C","e":"RAM","a":"ذاكرة الوصول العشوائي"},{"l":"D","e":"CPU cache only","a":"ذاكرة التخزين المؤقت للمعالج فقط"}],"c":"A","xe":"A solid-state drive is persistent storage because it retains data without power. CPU registers, RAM, and CPU cache are volatile and lose data when power is removed.","xa":"محرك أقراص الحالة الصلبة (SSD) هو تخزين دائم لأنه يحتفظ بالبيانات دون طاقة. أما سجلات المعالج وذاكرة RAM وذاكرة التخزين المؤقت للمعالج فهي متطايرة وتفقد البيانات عند انقطاع الطاقة."},{"n":10,"ch":3,"qe":"What is an SSD?","qa":"ما هو SSD؟","o":[{"l":"A","e":"Solid-State Drive","a":"محرك أقراص الحالة الصلبة"},{"l":"B","e":"Software Storage Device","a":"جهاز تخزين برمجي"},{"l":"C","e":"System Security Driver","a":"برنامج أمان النظام"},{"l":"D","e":"Standard Software Database","a":"قاعدة بيانات برمجية قياسية"}],"c":"A","xe":"SSD stands for Solid-State Drive, a storage device that uses flash memory and has no moving mechanical parts. The other expansions are incorrect.","xa":"اختصار SSD يعني محرك أقراص الحالة الصلبة (Solid-State Drive)، وهو جهاز تخزين يستخدم ذاكرة فلاش ولا يحتوي على أجزاء ميكانيكية متحركة. أما التوسعات الأخرى فهي غير صحيحة."},{"n":11,"ch":3,"qe":"What is a motherboard?","qa":"ما هي اللوحة الأم (Motherboard)؟","o":[{"l":"A","e":"A main circuit board connecting many computer components","a":"لوحة دوائر رئيسية تربط العديد من مكونات الحاسوب"},{"l":"B","e":"A software application","a":"تطبيق برمجي"},{"l":"C","e":"A type of database","a":"نوع من قواعد البيانات"},{"l":"D","e":"A web server","a":"خادم ويب"}],"c":"A","xe":"The motherboard is the main circuit board that connects and allows communication between components such as the CPU, memory, and storage. It is not software, a database, or a server.","xa":"اللوحة الأم (Motherboard) هي لوحة الدوائر الرئيسية التي تربط وتتيح التواصل بين مكونات مثل المعالج والذاكرة والتخزين. وهي ليست برمجيات ولا قاعدة بيانات ولا خادماً."},{"n":12,"ch":3,"qe":"Which is an input device?","qa":"أي مما يلي يُعد جهاز إدخال؟","o":[{"l":"A","e":"Keyboard","a":"لوحة المفاتيح"},{"l":"B","e":"Monitor","a":"الشاشة"},{"l":"C","e":"Speaker","a":"مكبر الصوت"},{"l":"D","e":"Printer","a":"الطابعة"}],"c":"A","xe":"A keyboard is an input device used to enter data and commands. Monitors, speakers, and printers are output devices.","xa":"لوحة المفاتيح (Keyboard) هي جهاز إدخال يُستخدم لإدخال البيانات والأوامر. أما الشاشة ومكبر الصوت والطابعة فهي أجهزة إخراج."},{"n":13,"ch":3,"qe":"Which is an output device?","qa":"أي مما يلي يُعد جهاز إخراج؟","o":[{"l":"A","e":"Monitor","a":"الشاشة"},{"l":"B","e":"Keyboard","a":"لوحة المفاتيح"},{"l":"C","e":"Microphone","a":"الميكروفون"},{"l":"D","e":"Scanner","a":"الماسح الضوئي"}],"c":"A","xe":"A monitor is an output device that displays information. Keyboards, microphones, and scanners are input devices.","xa":"الشاشة (Monitor) هي جهاز إخراج يعرض المعلومات. أما لوحة المفاتيح والميكروفون والماسح الضوئي فهي أجهزة إدخال."},{"n":14,"ch":3,"qe":"What was the original primary purpose of GPUs?","qa":"ما كان الغرض الأساسي الأصلي لوحدات معالجة الرسوميات (GPUs)؟","o":[{"l":"A","e":"Accelerating graphics operations","a":"تسريع عمليات الرسوميات"},{"l":"B","e":"Managing passwords","a":"إدارة كلمات المرور"},{"l":"C","e":"Storing files","a":"تخزين الملفات"},{"l":"D","e":"Running databases only","a":"تشغيل قواعد البيانات فقط"}],"c":"A","xe":"GPUs were originally designed to accelerate graphics rendering and image processing. Their use for general-purpose and AI computations came later.","xa":"صُممت وحدات معالجة الرسوميات (GPUs) في الأصل لتسريع عرض الرسوميات ومعالجة الصور. أما استخدامها في الحوسبة العامة والذكاء الاصطناعي فقد جاء لاحقاً."},{"n":15,"ch":3,"qe":"Why are GPUs useful for some AI applications?","qa":"لماذا تُعد وحدات GPU مفيدة لبعض تطبيقات الذكاء الاصطناعي؟","o":[{"l":"A","e":"They can perform many calculations in parallel","a":"يمكنها إجراء العديد من العمليات الحسابية بالتوازي"},{"l":"B","e":"They eliminate the need for data","a":"تلغي الحاجة إلى البيانات"},{"l":"C","e":"They replace all CPUs","a":"تستبدل كل وحدات المعالجة المركزية"},{"l":"D","e":"They cannot perform numerical operations","a":"لا تستطيع إجراء عمليات عددية"}],"c":"A","xe":"GPUs contain many cores and can perform large numbers of calculations in parallel, which is useful for AI workloads. They do not eliminate data or replace all CPUs.","xa":"تحتوي وحدات GPU على العديد من الأنوية ويمكنها إجراء أعداد كبيرة من العمليات الحسابية بالتوازي، مما يفيد أحمال عمل الذكاء الاصطناعي. وهي لا تلغي البيانات ولا تستبدل كل وحدات المعالجة المركزية."},{"n":16,"ch":3,"qe":"What does clock speed describe?","qa":"ماذا تصف سرعة الساعة (Clock Speed)؟","o":[{"l":"A","e":"The frequency of processor timing cycles","a":"تردد دورات توقيت المعالج"},{"l":"B","e":"The size of a hard drive","a":"حجم القرص الصلب"},{"l":"C","e":"The brightness of a screen","a":"سطوع الشاشة"},{"l":"D","e":"The number of files on a computer","a":"عدد الملفات على الحاسوب"}],"c":"A","xe":"Clock speed describes how many timing cycles a processor performs per second, usually measured in gigahertz. It does not describe storage size, screen brightness, or file count.","xa":"تصف سرعة الساعة (Clock Speed) عدد دورات التوقيت التي ينفذها المعالج في الثانية، وتُقاس عادةً بالجيجاهرتز. وهي لا تصف حجم التخزين أو سطوع الشاشة أو عدد الملفات."},{"n":17,"ch":3,"qe":"Why is clock speed alone not enough to determine CPU performance?","qa":"لماذا لا تكفي سرعة الساعة وحدها لتحديد أداء المعالج؟","o":[{"l":"A","e":"Architecture, cores, cache, and workload also affect performance","a":"تؤثر البنية والأنوية والذاكرة المؤقتة وحمل العمل أيضاً على الأداء"},{"l":"B","e":"Clock speed has no relationship to processors","a":"لا علاقة لسرعة الساعة بالمعالجات"},{"l":"C","e":"CPUs do not have architectures","a":"لا تمتلك المعالجات بنى"},{"l":"D","e":"Memory has no effect on performance","a":"لا تؤثر الذاكرة على الأداء"}],"c":"A","xe":"CPU performance depends on many factors, including microarchitecture, number of cores, cache size, and the type of workload, not just clock speed.","xa":"يعتمد أداء المعالج على عوامل عديدة، منها البنية الدقيقة وعدد الأنوية وحجم الذاكرة المؤقتة ونوع حمل العمل، وليس فقط سرعة الساعة."},{"n":18,"ch":3,"qe":"What is the purpose of cache memory?","qa":"ما هو الغرض من الذاكرة المؤقتة (Cache Memory)؟","o":[{"l":"A","e":"To provide fast access to frequently needed information","a":"توفير وصول سريع إلى المعلومات المطلوبة بشكل متكرر"},{"l":"B","e":"To permanently archive all files","a":"أرشفة جميع الملفات بشكل دائم"},{"l":"C","e":"To connect computers to printers","a":"توصيل الحواسيب بالطابعات"},{"l":"D","e":"To display webpages","a":"عرض صفحات الويب"}],"c":"A","xe":"Cache memory is a small, high-speed memory that stores frequently used data and instructions to reduce access time. It is not permanent archival storage or a connectivity/display component.","xa":"الذاكرة المؤقتة (Cache Memory) هي ذاكرة صغيرة عالية السرعة تخزن البيانات والتعليمات المستخدمة بكثرة لتقليل زمن الوصول. وهي ليست تخزيناً دائماً ولا مكون اتصال أو عرض."},{"n":19,"ch":3,"qe":"What is a memory hierarchy?","qa":"ما هو التسلسل الهرمي للذاكرة (Memory Hierarchy)؟","o":[{"l":"A","e":"A system in which different types of memory have different speeds, capacities, and costs","a":"نظام تكون فيه أنواع الذاكرة المختلفة ذات سرعات وسعات وتكاليف مختلفة"},{"l":"B","e":"A list of computer users","a":"قائمة بمستخدمي الحاسوب"},{"l":"C","e":"A programming language","a":"لغة برمجة"},{"l":"D","e":"A network protocol","a":"بروتوكول شبكة"}],"c":"A","xe":"The memory hierarchy organizes memory types from fast, small, expensive cache/registers to slower, larger, cheaper storage, balancing speed, capacity, and cost.","xa":"ينظم التسلسل الهرمي للذاكرة (Memory Hierarchy) أنواع الذاكرة من السجلات/الذاكرة المؤقتة السريعة والصغيرة والمكلفة إلى التخزين الأبطأ والأكبر والأرخص، لتحقيق توازن بين السرعة والسعة والتكلفة."},{"n":20,"ch":3,"qe":"What are embedded systems?","qa":"ما هي الأنظمة المدمجة (Embedded Systems)؟","o":[{"l":"A","e":"Computing systems integrated into larger products","a":"أنظمة حوسبة مدمجة في منتجات أكبر"},{"l":"B","e":"Computers used only for gaming","a":"حواسيب تُستخدم للألعاب فقط"},{"l":"C","e":"Computers without processors","a":"حواسيب بدون معالجات"},{"l":"D","e":"Software documentation","a":"توثيق البرمجيات"}],"c":"A","xe":"Embedded systems are specialized computing systems built into larger devices to perform dedicated functions, such as in cars or appliances.","xa":"الأنظمة المدمجة (Embedded Systems) هي أنظمة حوسبة متخصصة مدمجة في أجهزة أكبر لأداء وظائف مخصصة، مثل تلك الموجودة في السيارات أو الأجهزة
