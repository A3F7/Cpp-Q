المنزلية."},{"n":21,"ch":3,"qe":"Which device may contain an embedded computer?","qa":"أي جهاز قد يحتوي على حاسوب مدمج؟","o":[{"l":"A","e":"Automobile","a":"السيارة"},{"l":"B","e":"Paper notebook","a":"دفتر ورقي"},{"l":"C","e":"Wooden table","a":"طاولة خشبية"},{"l":"D","e":"Pencil","a":"قلم رصاص"}],"c":"A","xe":"Modern automobiles contain embedded computers for engine control, safety systems, and entertainment. Paper notebooks, wooden tables, and pencils do not contain embedded computers.","xa":"تحتوي السيارات الحديثة على حواسيب مدمجة للتحكم في المحرك وأنظمة السلامة والترفيه. أما الدفاتر الورقية والطاولات الخشبية وأقلام الرصاص فلا تحتوي على حواسيب مدمجة."},{"n":22,"ch":3,"qe":"What is a bus in computer architecture?","qa":"ما هو الناقل (Bus) في بنية الحاسوب؟","o":[{"l":"A","e":"A pathway for transferring information between components","a":"مسار لنقل المعلومات بين المكونات"},{"l":"B","e":"A public transportation system inside a computer","a":"نظام مواصلات عامة داخل الحاسوب"},{"l":"C","e":"A programming language","a":"لغة برمجة"},{"l":"D","e":"A storage device","a":"جهاز تخزين"}],"c":"A","xe":"In computer architecture, a bus is a communication pathway that transfers data, addresses, and control signals between components.","xa":"في بنية الحاسوب، الناقل (Bus) هو مسار اتصال ينقل البيانات والعناوين وإشارات التحكم بين المكونات."},{"n":23,"ch":3,"qe":"How do computers represent information at the lowest digital level?","qa":"كيف تمثل الحواسيب المعلومات في أدنى مستوى رقمي؟","o":[{"l":"A","e":"Using binary states","a":"باستخدام حالات ثنائية"},{"l":"B","e":"Using only decimal numbers","a":"باستخدام الأرقام العشرية فقط"},{"l":"C","e":"Using physical books","a":"باستخدام كتب مادية"},{"l":"D","e":"Using human language directly","a":"باستخدام اللغة البشرية مباشرة"}],"c":"A","xe":"At the lowest level, computers represent information using binary states, typically 0 and 1. They do not store information as physical books or directly as human language.","xa":"في أدنى مستوى، تمثل الحواسيب المعلومات باستخدام حالات ثنائية (Binary States)، عادةً 0 و1. وهي لا تخزن المعلومات ككتب مادية أو مباشرة كلغة بشرية."},{"n":24,"ch":3,"qe":"What are logic gates?","qa":"ما هي البوابات المنطقية (Logic Gates)؟","o":[{"l":"A","e":"Fundamental digital circuits used to implement logical operations","a":"دوائر رقمية أساسية تُستخدم لتنفيذ العمليات المنطقية"},{"l":"B","e":"Computer doors","a":"أبواب الحاسوب"},{"l":"C","e":"Storage folders","a":"مجلدات التخزين"},{"l":"D","e":"Programming languages","a":"لغات برمجة"}],"c":"A","xe":"Logic gates are basic digital circuits that perform logical operations such as AND, OR, and NOT on binary inputs. They are not physical doors, folders, or languages.","xa":"البوابات المنطقية (Logic Gates) هي دوائر رقمية أساسية تنفذ عمليات منطقية مثل AND وOR وNOT على مدخلات ثنائية. وهي ليست أبواباً مادية ولا مجلدات ولا لغات."},{"n":25,"ch":3,"qe":"Which of the following is a logic gate?","qa":"أي مما يلي يُعد بوابة منطقية؟ (نص السؤال ناقص في الملف؛ تم استنتاجه من الخيارات.)","o":[{"l":"A","e":"AND","a":"بوابة AND المنطقية"},{"l":"B","e":"CPU","a":"وحدة المعالجة المركزية"},{"l":"C","e":"RAM","a":"ذاكرة الوصول العشوائي"},{"l":"D","e":"SSD","a":"محرك أقراص الحالة الصلبة"}],"c":"A","xe":"AND is a fundamental logic gate. CPU, RAM, and SSD are hardware components, not logic gates.","xa":"AND هي بوابة منطقية أساسية. أما CPU وRAM وSSD فهي مكونات عتاد وليست بوابات منطقية."},{"n":26,"ch":3,"qe":"Why is hardware knowledge useful to programmers?","qa":"لماذا تُعد معرفة العتاد مفيدة للمبرمجين؟","o":[{"l":"A","e":"It helps explain how software interacts with physical computing resources","a":"تساعد في شرح كيفية تفاعل البرمجيات مع موارد الحوسبة المادية"},{"l":"B","e":"It eliminates the need for software","a":"تلغي الحاجة إلى البرمجيات"},{"l":"C","e":"It prevents debugging","a":"تمنع تصحيح الأخطاء"},{"l":"D","e":"It makes algorithms unnecessary","a":"تجعل الخوارزميات غير ضرورية"}],"c":"A","xe":"Understanding hardware helps programmers reason about performance, memory usage, and how software executes on physical resources. It does not eliminate software, debugging, or algorithms.","xa":"تساعد معرفة العتاد المبرمجين على فهم الأداء واستخدام الذاكرة وكيفية تنفيذ البرمجيات على الموارد المادية. وهي لا تلغي البرمجيات ولا تصحيح الأخطاء ولا الخوارزميات."},{"n":27,"ch":3,"qe":"Which storage technology uses magnetic disks?","qa":"أي تقنية تخزين تستخدم الأقراص المغناطيسية؟","o":[{"l":"A","e":"Hard disk drive","a":"محرك الأقراص الصلبة (HDD)"},{"l":"B","e":"RAM","a":"ذاكرة الوصول العشوائي"},{"l":"C","e":"CPU cache","a":"ذاكرة التخزين المؤقت للمعالج"},{"l":"D","e":"Register","a":"السجل"}],"c":"A","xe":"A hard disk drive (HDD) stores data on rotating magnetic disks. RAM, CPU cache, and registers are semiconductor-based memory, not magnetic disk storage.","xa":"يخزن محرك الأقراص الصلبة (HDD) البيانات على أقراص مغناطيسية دوارة. أما RAM وذاكرة التخزين المؤقت للمعالج والسجلات فهي ذاكرة قائمة على أشباه الموصلات وليست تخزيناً على أقراص مغناطيسية."},{"n":28,"ch":3,"qe":"What is one advantage commonly associated with SSDs?","qa":"ما هي إحدى المزايا المرتبطة عادةً بمحركات SSD؟","o":[{"l":"A","e":"Faster access and greater resistance to physical movement than traditional hard drives","a":"وصول أسرع ومقاومة أكبر للحركة المادية مقارنةً بمحركات الأقراص الصلبة التقليدية"},{"l":"B","e":"They require mechanical spinning disks","a":"تتطلب أقراصاً دوارة ميكانيكية"},{"l":"C","e":"They are always larger than hard drives","a":"تكون دائماً أكبر من محركات الأقراص الصلبة"},{"l":"D","e":"They cannot store data","a":"لا يمكنها تخزين البيانات"}],"c":"A","xe":"SSDs use flash memory and have no moving parts, so they generally offer faster access and better shock resistance than traditional HDDs.","xa":"تستخدم محركات SSD ذاكرة فلاش ولا تحتوي على أجزاء متحركة، لذلك توفر عادةً وصولاً أسرع ومقاومة أفضل للصدمات من محركات HDD التقليدية."},{"n":29,"ch":3,"qe":"Why do computers use different types of memory?","qa":"لماذا تستخدم الحواسيب أنواعاً مختلفة من الذاكرة؟","o":[{"l":"A","e":"Different memory technologies provide different balances of speed, cost, and capacity","a":"توفر تقنيات الذاكرة المختلفة توازنات مختلفة بين السرعة والتكلفة والسعة"},{"l":"B","e":"All memory has identical characteristics","a":"كل الذاكرة لها خصائص متطابقة"},{"l":"C","e":"Computers do not need memory","a":"لا تحتاج الحواسيب إلى ذاكرة"},{"l":"D","e":"Storage and memory are exactly the same","a":"التخزين والذاكرة متطابقان تماماً"}],"c":"A","xe":"Computers use a hierarchy of memory types because no single memory technology is simultaneously fastest, cheapest, and largest. Different types balance speed, cost, and capacity.","xa":"تستخدم الحواسيب تسلسلاً هرمياً من أنواع الذاكرة لأنه لا توجد تقنية ذاكرة واحدة تكون في الوقت نفسه الأسرع والأرخص والأكبر. الأنواع المختلفة توازن بين السرعة والتكلفة والسعة."},{"n":30,"ch":3,"qe":"What is the relationship between hardware and software?","qa":"ما هي العلاقة بين العتاد والبرمجيات؟","o":[{"l":"A","e":"Software provides instructions that hardware executes","a":"توفر البرمجيات تعليمات ينفذها العتاد"},{"l":"B","e":"Hardware and software are completely unrelated","a":"العتاد والبرمجيات غير مرتبطين تماماً"},{"l":"C","e":"Software is always physical","a":"البرمجيات دائماً مادية"},{"l":"D","e":"Hardware is always a program","a":"العتاد دائماً برنامج"}],"c":"A","xe":"Software consists of instructions and programs, while hardware executes those instructions. They are complementary, not unrelated or identical.","xa":"تتكون البرمجيات من تعليمات وبرامج، بينما ينفذ العتاد تلك التعليمات. وهما متكاملان وليسا غير مرتبطين أو متطابقين."},{"n":1,"ch":4,"qe":"What is a bit?","qa":"ما هو البت (Bit)؟","o":[{"l":"A","e":"A binary digit","a":"رقم ثنائي"},{"l":"B","e":"A database","a":"قاعدة بيانات"},{"l":"C","e":"A processor","a":"معالج"},{"l":"D","e":"A programming language","a":"لغة برمجة"}],"c":"A","xe":"A bit is the basic unit of digital information and represents a binary digit, typically 0 or 1. It is not a database, processor, or programming language.","xa":"البت (Bit) هو الوحدة الأساسية للمعلومات الرقمية ويمثل رقماً ثنائياً، عادةً 0 أو 1. وهو ليس قاعدة بيانات ولا معالجاً ولا لغة برمجة."},{"n":2,"ch":4,"qe":"How many bits are traditionally contained in one byte?","qa":"كم عدد البتات الموجودة تقليدياً في البايت الواحد؟","o":[{"l":"A","e":"4","a":"4"},{"l":"B","e":"8","a":"8"},{"l":"C","e":"16","a":"16"},{"l":"D","e":"32","a":"32"}],"c":"B","xe":"One byte traditionally consists of 8 bits. This grouping is standard in most modern computer systems.","xa":"يتكون البايت الواحد (Byte) تقليدياً من 8 بتات. وهذا التجميع هو المعيار في معظم أنظمة الحاسوب الحديثة."},{"n":3,"ch":4,"qe":"How many different combinations can be represented by 8 bits?","qa":"كم عدد التوليفات المختلفة التي يمكن تمثيلها باستخدام 8 بتات؟","o":[{"l":"A","e":"8","a":"8"},{"l":"B","e":"64","a":"64"},{"l":"C","e":"128","a":"128"},{"l":"D","e":"256","a":"256"}],"c":"D","xe":"With 8 bits, each bit has 2 possible states, so the number of combinations is 2^8 = 256. Options 8, 64, and 128 are incorrect powers or counts.","xa":"مع 8 بتات، كل بت له حالتان محتملتان، لذا فإن عدد التوليفات هو 2^8 = 256. الخيارات 8 و64 و128 غير صحيحة."},{"n":4,"ch":4,"qe":"What number system uses two symbols, 0 and 1?","qa":"ما هو نظام الأعداد الذي يستخدم رمزين فقط، 0 و1؟","o":[{"l":"A","e":"Decimal","a":"عشري"},{"l":"B","e":"Binary","a":"ثنائي"},{"l":"C","e":"Hexadecimal","a":"ست عشري"},{"l":"D","e":"Roman","a":"روماني"}],"c":"B","xe":"The binary number system uses only two symbols, 0 and 1. Decimal uses ten symbols, hexadecimal uses sixteen, and Roman numerals use letters.","xa":"نظام الأعداد الثنائي (Binary) يستخدم رمزين فقط هما 0 و1. أما النظام العشري فيستخدم عشرة رموز، والست عشري ستة عشر رمزاً، والأرقام الرومانية تستخدم حروفاً."},{"n":5,"ch":4,"qe":"What number does binary 1011 represent?","qa":"ما هو العدد الذي يمثله الرقم الثنائي 1011؟","o":[{"l":"A","e":"9","a":"9"},{"l":"B","e":"10","a":"10"},{"l":"C","e":"11","a":"11"},{"l":"D","e":"12","a":"12"}],"c":"C","xe":"Binary 1011 equals 1×8 + 0×4 + 1×2 + 1×1 = 8 + 0 + 2 + 1 = 11. Therefore, 9, 10, and 12 are incorrect.","xa":"الرقم الثنائي 1011 يساوي 1×8 + 0×4 + 1×2 + 1×1 = 8 + 0 + 2 + 1 = 11. لذلك فإن 9 و10 و12 غير صحيحة."},{"n":6,"ch":4,"qe":"What number system uses sixteen symbols?","qa":"ما هو نظام الأعداد الذي يستخدم ستة عشر رمزاً؟","o":[{"l":"A","e":"Binary","a":"ثنائي"},{"l":"B","e":"Decimal","a":"عشري"},{"l":"C","e":"Hexadecimal","a":"ست عشري"},{"l":"D","e":"Octal","a":"ثماني"}],"c":"C","xe":"Hexadecimal uses sixteen symbols: 0–9 and A–F. Binary uses two, decimal uses ten, and octal uses eight.","xa":"النظام الست عشري (Hexadecimal) يستخدم ستة عشر رمزاً: 0–9 وA–F. أما الثنائي فيستخدم رمزين، والعشري عشرة، والثماني ثمانية."},{"n":7,"ch":4,"qe":"Why is hexadecimal useful?","qa":"لماذا يُعد النظام الست عشري مفيداً؟","o":[{"l":"A","e":"It provides a compact representation of binary information","a":"يوفر تمثيلاً مختصراً للمعلومات الثنائية"},{"l":"B","e":"It eliminates binary","a":"يلغي النظام الثنائي"},{"l":"C","e":"It is used only for writing documents","a":"يُستخدم فقط لكتابة المستندات"},{"l":"D","e":"It cannot represent numbers","a":"لا يمكنه تمثيل الأعداد"}],"c":"A","xe":"Hexadecimal is useful because each hex digit represents four binary bits, making long binary values shorter and easier to read. It does not eliminate binary or fail to represent numbers.","xa":"يُعد النظام الست عشري مفيداً لأن كل رقم ست عشري يمثل أربع بتات ثنائية، مما يجعل القيم الثنائية الطويلة أقصر وأسهل في القراءة. وهو لا يلغي النظام الثنائي ولا يعجز عن تمثيل الأعداد."},{"n":8,"ch":4,"qe":"What is ASCII?","qa":"ما هو ASCII؟","o":[{"l":"A","e":"A character encoding system","a":"نظام ترميز الأحرف"},{"l":"B","e":"A processor","a":"معالج"},{"l":"C","e":"A database","a":"قاعدة بيانات"},{"l":"D","e":"An operating system","a":"نظام تشغيل"}],"c":"A","xe":"ASCII is a character encoding standard that assigns numeric codes to letters, digits, and symbols. It is not a processor, database, or operating system.","xa":"ASCII هو معيار لترميز الأحرف (Character Encoding) يخصص رموزاً رقمية للحروف والأرقام والرموز. وهو ليس معالجاً ولا قاعدة بيانات ولا نظام تشغيل."},{"n":9,"ch":4,"qe":"What is Unicode designed to support?","qa":"ما الذي صُمم Unicode لدعمه؟","o":[{"l":"A","e":"Characters from many writing systems","a":"أحرف من العديد من أنظمة الكتابة"},{"l":"B","e":"Only English letters","a":"الحروف الإنجليزية فقط"},{"l":"C","e":"Only numbers","a":"الأرقام فقط"},{"l":"D","e":"Only computer instructions","a":"تعليمات الحاسوب فقط"}],"c":"A","xe":"Unicode is designed to represent characters from many of the world's writing systems, unlike ASCII, which is limited mainly to English and some symbols.","xa":"صُمم Unicode لتمثيل الأحرف من العديد من أنظمة الكتابة في العالم، على عكس ASCII الذي يقتصر أساساً على الإنجليزية وبعض الرموز."},{"n":10,"ch":4,"qe":"What is a pixel?","qa":"ما هو البكسل (Pixel)؟","o":[{"l":"A","e":"A small unit of a digital image","a":"وحدة صغيرة في الصورة الرقمية"},{"l":"B","e":"A type of CPU","a":"نوع من وحدات المعالجة المركزية"},{"l":"C","e":"A network protocol","a":"بروتوكول شبكة"},{"l":"D","e":"A database table","a":"جدول في قاعدة بيانات"}],"c":"A","xe":"A pixel is the smallest individual element of a digital image, representing a single point of color or intensity. It is not a CPU, protocol, or database table.","xa":"البكسل (Pixel) هو أصغر عنصر فردي في الصورة الرقمية، ويمثل نقطة واحدة من اللون أو الشدة. وهو ليس معالجاً ولا بروتوكولاً ولا جدول قاعدة بيانات."},{"n":11,"ch":4,"qe":"What does RGB commonly represent?","qa":"ماذا يمثل RGB عادةً؟","o":[{"l":"A","e":"Red, Green, and Blue","a":"الأحمر والأخضر والأزرق"},{"l":"B","e":"Random Graphics Buffer","a":"مخزن رسوميات عشوائي"},{"l":"C","e":"Read, Generate, Build","a":"قراءة، توليد، بناء"},{"l":"D","e":"Remote Graphics Browser","a":"متصفح رسوميات بعيد"}],"c":"A","xe":"RGB stands for Red, Green, and Blue, the primary color components used in digital color representation. The other expansions are incorrect.","xa":"اختصار RGB يعني الأحمر والأخضر والأزرق (Red, Green, Blue)، وهي مكونات الألوان الأساسية المستخدمة في تمثيل الألوان الرقمية. أما التوسعات الأخرى فهي غير صحيحة."},{"n":12,"ch":4,"qe":"What generally happens when image resolution increases?","qa":"ماذا يحدث عادةً عندما تزداد دقة الصورة (Resolution)؟","o":[{"l":"A","e":"More visual detail can be represented","a":"يمكن تمثيل تفاصيل مرئية أكثر"},{"l":"B","e":"The image contains fewer pixels","a":"تحتوي الصورة على بكسل أقل"},{"l":"C","e":"The file always becomes smaller","a":"يصبح الملف أصغر دائماً"},{"l":"D","e":"The image loses all color","a":"تفقد الصورة كل الألوان"}],"c":"A","xe":"Higher resolution means more pixels, allowing more visual detail to be represented. It does not mean fewer pixels, guaranteed smaller files, or loss of color.","xa":"تعني الدقة الأعلى (Higher Resolution) وجود بكسل أكثر، مما يسمح بتمثيل تفاصيل مرئية أكثر. وهي لا تعني بكسل أقل أو ملفاً أصغر دائماً أو فقدان الألوان."},{"n":13,"ch":4,"qe":"How is digital audio commonly represented?","qa":"كيف يُ represented الصوت الرقمي عادةً؟","o":[{"l":"A","e":"Through numerical samples of sound","a":"من خلال عينات رقمية من الصوت"},{"l":"B","e":"Through photographs","a":"من خلال الصور الفوتوغرافية"},{"l":"C","e":"Through keyboard keys only","a":"من خلال مفاتيح لوحة المفاتيح فقط"},{"l":"D","e":"Through database tables","a":"من خلال جداول قواعد البيانات"}],"c":"A","xe":"Digital audio is commonly represented by sampling sound waves at regular intervals and storing numerical values. It is not represented by photographs, keyboard keys, or database tables.","xa":"يُمثل الصوت الرقمي عادةً عن طريق أخذ عينات (Samples) من موجات الصوت على فترات منتظمة وتخزين قيم رقمية. وهو لا يُمثل بالصور أو مفاتيح لوحة المفاتيح أو جداول قواعد البيانات."},{"n":14,"ch":4,"qe":"What does sampling rate describe?","qa":"ماذا يصف معدل أخذ العينات (Sampling Rate)؟","o":[{"l":"A","e":"The number of audio samples captured per second","a":"عدد عينات الصوت الملتقطة في الثانية"},{"l":"B","e":"The number of speakers connected","a":"عدد مكبرات الصوت المتصلة"},{"l":"C","e":"The size of an image","a":"حجم الصورة"},{"l":"D","e":"The number of files in a folder","a":"عدد الملفات في مجلد"}],"c":"A","xe":"Sampling rate describes how many audio samples are taken per second, often measured in hertz (Hz). It does not describe speakers, image size, or file count.","xa":"يصف معدل أخذ العينات (Sampling Rate) عدد عينات الصوت التي تُؤخذ في الثانية، ويُقاس غالباً بالهرتز (Hz). وهو لا يصف مكبرات الصوت أو حجم الصورة أو عدد الملفات."},{"n":15,"ch":4,"qe":"Why is compression important for video?","qa":"لماذا يُعد الضغط (Compression) مهماً للفيديو؟","o":[{"l":"A","e":"Video can contain enormous amounts of data","a":"يمكن أن يحتوي الفيديو على كميات هائلة من البيانات"},{"l":"B","e":"Video contains no information","a":"لا يحتوي الفيديو على معلومات"},{"l":"C","e":"Compression makes processors unnecessary","a":"يجعل الضغط المعالجات غير ضرورية"},{"l":"D","e":"Video cannot be stored digitally","a":"لا يمكن تخزين الفيديو رقمياً"}],"c":"A","xe":"Video files can be very large because they contain many frames and audio data, so compression is important to reduce storage and transmission requirements. Video does contain information and can be stored digitally.","xa":"يمكن أن تكون ملفات الفيديو كبيرة جداً لأنها تحتوي على العديد من الإطارات وبيانات الصوت، لذا يُعد الضغط مهماً لتقليل متطلبات التخزين والنقل. والفيديو يحتوي على معلومات ويمكن تخزينه رقمياً."},{"n":16,"ch":4,"qe":"What is lossless compression?","qa":"ما هو الضغط غير الفاقد (Lossless Compression)؟","o":[{"l":"A","e":"Compression that allows the original data to be reconstructed exactly","a":"ضغط يسمح بإعادة بناء البيانات الأصلية بدقة تامة"},{"l":"B","e":"Compression that permanently destroys information","a":"ضغط يدمر المعلومات بشكل دائم"},{"l":"C","e":"Compression used only for video","a":"ضغط يُستخدم للفيديو فقط"},{"l":"D","e":"Compression that increases file size","a":"ضغط يزيد حجم الملف"}],"c":"A","xe":"Lossless compression reduces file size without losing any information, so the original data can be perfectly reconstructed. Lossy compression removes some information.","xa":"الضغط غير الفاقد (Lossless Compression) يقلل حجم الملف دون فقدان أي معلومات، لذا يمكن إعادة بناء البيانات الأصلية بشكل تام. أما الضغط الفاقد فيزيل بعض المعلومات."},{"n":17,"ch":4,"qe":"What does lossy compression do?","qa":"ماذا يفعل الضغط الفاقد (Lossy Compression)؟","o":[{"l":"A","e":"Removes some information to reduce file size","a":"يزيل بعض المعلومات لتقليل حجم الملف"},{"l":"B","e":"Always preserves every bit","a":"يحافظ دائماً على كل بت"},{"l":"C","e":"Prevents files from being stored","a":"يمنع تخزين الملفات"},{"l":"D","e":"Doubles the amount of data","a":"يضاعف كمية البيانات"}],"c":"A","xe":"Lossy compression reduces file size by discarding some information, which may be acceptable for images, audio, or video. It does not preserve every bit or prevent storage.","xa":"يقلل الضغط الفاقد (Lossy Compression) حجم الملف عن طريق التخلص من بعض المعلومات، وقد يكون ذلك مقبولاً للصور أو الصوت أو الفيديو. وهو لا يحافظ على كل بت ولا يمنع التخزين."},{"n":18,"ch":4,"qe":"What is metadata?","qa":"ما هي البيانات الوصفية (Metadata)؟","o":[{"l":"A","e":"Information describing other data","a":"معلومات تصف بيانات أخرى"},{"l":"B","e":"A type of processor","a":"نوع من المعالجات"},{"l":"C","e":"A programming language","a":"لغة برمجة"},{"l":"D","e":"A network cable","a":"كابل شبكة"}],"c":"A","xe":"Metadata is data about data, such as creation time, author, or file format. It is not a processor, language, or cable.","xa":"البيانات الوصفية (Metadata) هي بيانات عن البيانات، مثل وقت الإنشاء أو المؤلف أو تنسيق الملف. وهي ليست معالجاً ولا لغة ولا كابلاً."},{"n":19,"ch":4,"qe":"Which is an example of metadata for a photograph?","qa":"أي مما يلي يُعد مثالاً على البيانات الوصفية لصورة فوتوغرافية؟","o":[{"l":"A","e":"Creation time","a":"وقت الإنشاء"},{"l":"B","e":"Keyboard layout","a":"تخطيط لوحة المفاتيح"},{"l":"C","e":"CPU temperature only","a":"درجة حرارة المعالج فقط"},{"l":"D","e":"Internet password","a":"كلمة مرور الإنترنت"}],"c":"A","xe":"Creation time is metadata because it describes the photograph rather than being part of its visual content. Keyboard layout, CPU temperature, and passwords are unrelated.","xa":"وقت الإنشاء هو بيانات وصفية (Metadata) لأنه يصف الصورة بدلاً من أن يكون جزءاً من محتواها المرئي. أما تخطيط لوحة المفاتيح ودرجة حرارة المعالج وكلمات المرور فهي غير مرتبطة."},{"n":20,"ch":4,"qe":"What is a data structure?","qa":"ما هي بنية البيانات (Data Structure)؟","o":[{"l":"A","e":"An organized way of representing and storing data","a":"طريقة منظمة لتمثيل وتخزين البيانات"},{"l":"B","e":"A computer monitor","a":"شاشة حاسوب"},{"l":"C","e":"A power supply","a":"مزود طاقة"},{"l":"D","e":"A web browser","a":"متصفح ويب"}],"c":"A","xe":"A data structure organizes data in memory so it can be accessed and manipulated efficiently. It is not a monitor, power supply, or browser.","xa":"بنية البيانات (Data Structure) تنظم البيانات في الذاكرة بحيث يمكن الوصول إليها ومعالجتها بكفاءة. وهي ليست شاشة ولا مزود طاقة ولا متصفحاً."},{"n":21,"ch":4,"qe":"Which is an example of a data structure?","qa":"أي مما يلي يُعد مثالاً على بنية بيانات؟","o":[{"l":"A","e":"Stack","a":"المكدس (Stack)"},{"l":"B","e":"Keyboard","a":"لوحة المفاتيح"},{"l":"C","e":"Monitor","a":"الشاشة"},{"l":"D","e":"Printer","a":"الطابعة"}],"c":"A","xe":"A stack is a data structure that follows last-in, first-out (LIFO) order. Keyboard, monitor, and printer are hardware devices.","xa":"المكدس (Stack) هو بنية بيانات تتبع ترتيب آخر ما يدخل أول ما يخرج (LIFO). أما لوحة المفاتيح والشاشة والطابعة فهي أجهزة عتاد."},{"n":22,"ch":4,"qe":"What can result from incorrect input?","qa":"ماذا يمكن أن ينتج عن الإدخال غير الصحيح؟","o":[{"l":"A","e":"Incorrect input can produce incorrect results","a":"يمكن أن ينتج عن الإدخال غير الصحيح نتائج غير صحيحة"},{"l":"B","e":"Computers automatically correct all errors","a":"تصحح الحواسيب جميع الأخطاء تلقائياً"},{"l":"C","e":"Computers cannot process data","a":"لا تستطيع الحواسيب معالجة البيانات"},{"l":"D","e":"Data is always accurate","a":"البيانات دائماً دقيقة"}],"c":"A","xe":"If the input data is wrong, the output is likely to be wrong as well (\"garbage in, garbage out\"). Computers do not automatically correct all errors, and data is not always accurate.","xa":"إذا كانت بيانات الإدخال خاطئة، فمن المرجح أن تكون المخرجات خاطئة أيضاً (\"مخرجات سيئة من مدخلات سيئة\"). والحواسيب لا تصحح جميع الأخطاء تلقائياً، والبيانات ليست دائماً دقيقة."},{"n":23,"ch":4,"qe":"Which is a characteristic of high-quality data?","qa":"أي مما يلي يُعد خاصية من خصائص البيانات عالية الجودة؟","o":[{"l":"A","e":"Accuracy","a":"الدقة"},{"l":"B","e":"Randomness","a":"العشوائية"},{"l":"C","e":"Irrelevance","a":"عدم الصلة"},{"l":"D","e":"Inconsistency","a":"عدم الاتساق"}],"c":"A","xe":"High-quality data should be accurate, relevant, consistent, and reliable. Randomness, irrelevance, and inconsistency are negative characteristics.","xa":"يجب أن تكون البيانات عالية الجودة دقيقة وذات صلة ومتسقة وموثوقة. أما العشوائية وعدم الصلة وعدم الاتساق فهي خصائص سلبية."},{"n":24,"ch":4,"qe":"What is data?","qa":"ما هي البيانات (Data)؟","o":[{"l":"A","e":"Recorded observations or values","a":"ملاحظات أو قيم مسجلة"},{"l":"B","e":"Only computer programs","a":"برامج الحاسوب فقط"},{"l":"C","e":"Only images","a":"الصور فقط"},{"l":"D","e":"Only numerical equations","a":"المعادلات العددية فقط"}],"c":"A","xe":"Data refers to recorded observations, facts, or values that can be processed. It is not limited to programs, images, or numerical equations.","xa":"تشير البيانات (Data) إلى الملاحظات أو الحقائق أو القيم المسجلة التي يمكن معالجتها. وهي ليست مقصورة على البرامج أو الصور أو المعادلات العددية."},{"n":25,"ch":4,"qe":"What is information?","qa":"ما هي المعلومات (Information)؟","o":[{"l":"A","e":"Data that has been organized and interpreted","a":"بيانات تم تنظيمها وتفسيرها"},{"l":"B","e":"Random bits without meaning","a":"بتات عشوائية بلا معنى"},{"l":"C","e":"Hardware components","a":"مكونات العتاد"},{"l":"D","e":"Electricity","a":"الكهرباء"}],"c":"A","xe":"Information is data that has been processed, organized, and given meaning or context. Random bits, hardware, and electricity are not information.","xa":"المعلومات (Information) هي بيانات تمت معالجتها وتنظيمها وإعطاؤها معنى أو سياقاً. أما البتات العشوائية والعتاد والكهرباء فليست معلومات."},{"n":26,"ch":4,"qe":"What is knowledge?","qa":"ما هي المعرفة (Knowledge)؟","o":[{"l":"A","e":"Understanding relationships, patterns, and implications","a":"فهم العلاقات والأنماط والآثار"},{"l":"B","e":"A type of storage device","a":"نوع من أجهزة التخزين"},{"l":"C","e":"A computer cable","a":"كابل حاسوب"},{"l":"D","e":"A binary digit","a":"رقم ثنائي"}],"c":"A","xe":"Knowledge goes beyond information by involving understanding of relationships, patterns, and implications. It is not a storage device, cable, or binary digit.","xa":"تتجاوز المعرفة (Knowledge) المعلومات من خلال تضمنها فهماً للعلاقات والأنماط والآثار. وهي ليست جهاز تخزين ولا كابلاً ولا رقماً ثنائياً."},{"n":27,"ch":4,"qe":"Why can computers process many different types of content?","qa":"لماذا تستطيع الحواسيب معالجة أنواع مختلفة كثيرة من المحتوى؟","o":[{"l":"A","e":"Many forms of information can ultimately be represented digitally","a":"يمكن تمثيل العديد من أشكال المعلومات رقمياً في النهاية"},{"l":"B","e":"Computers understand human language automatically","a":"تفهم الحواسيب اللغة البشرية تلقائياً"},{"l":"C","e":"Computers only process text","a":"تعالج الحواسيب النصوص فقط"},{"l":"D","e":"Computers cannot represent images","a":"لا تستطيع الحواسيب تمثيل الصور"}],"c":"A","xe":"Text, images, audio, and video can all be converted into digital representations, allowing computers to process many content types. Computers do not automatically understand human language.","xa":"يمكن تحويل النصوص والصور والصوت والفيديو جميعاً إلى تمثيلات رقمية، مما يسمح للحواسيب بمعالجة أنواع محتوى كثيرة. والحواسيب لا تفهم اللغة البشرية تلقائياً."},{"n":28,"ch":4,"qe":"Which unit is larger?","qa":"أي وحدة أكبر؟","o":[{"l":"A","e":"Bit","a":"بت"},{"l":"B","e":"Byte","a":"بايت"},{"l":"C","e":"Both are always the same","a":"كلاهما متساويان دائماً"},{"l":"D","e":"Neither","a":"لا هذا ولا ذاك"}],"c":"B","xe":"A byte is larger than a bit because one byte traditionally contains 8 bits. They are not always the same.","xa":"البايت (Byte) أكبر من البت (Bit) لأن البايت الواحد يحتوي تقليدياً على 8 بتات. وهما ليسا متساويين دائماً."},{"n":29,"ch":4,"qe":"What is digital representation?","qa":"ما هو التمثيل الرقمي (Digital Representation)؟","o":[{"l":"A","e":"Representing information in a form that computers can process","a":"تمثيل المعلومات بشكل يمكن للحواسيب معالجته"},{"l":"B","e":"Printing information on paper","a":"طباعة المعلومات على الورق"},{"l":"C","e":"Drawing pictures by hand","a":"رسم الصور يدوياً"},{"l":"D","e":"Speaking to another person","a":"التحدث إلى شخص آخر"}],"c":"A","xe":"Digital representation means encoding information as digital values, typically binary, so computers can store and process it. It is not printing, hand drawing, or speaking.","xa":"التمثيل الرقمي (Digital Representation) يعني ترميز المعلومات كقيم رقمية، عادةً ثنائية، حتى تتمكن الحواسيب من تخزينها ومعالجتها. وهو ليس طباعة أو رسماً يدوياً أو تحدثاً."},{"n":30,"ch":4,"qe":"Why is understanding data representation important?","qa":"لماذا يُعد فهم تمثيل البيانات مهماً؟","o":[{"l":"A","e":"It explains how computers store and process different forms of information","a":"يشرح كيف تخزن الحواسيب وتعاالج أشكالاً مختلفة من المعلومات"},{"l":"B","e":"It eliminates the need for software","a":"يلغي الحاجة إلى البرمجيات"},{"l":"C","e":"It only matters to graphic designers","a":"يهم مصممي الرسوميات فقط"},{"l":"D","e":"It has no relationship to computer science","a":"لا علاقة له بعلم الحاسوب"}],"c":"A","xe":"Understanding data representation is fundamental because it explains how all types of information—numbers, text, images, audio—are encoded, stored, and processed by computers. It is relevant across computer science, not only to designers.","xa":"فهم تمثيل البيانات أساسي لأنه يشرح كيف تُرمز جميع أنواع المعلومات—الأعداد والنصوص والصور والصوت—وتُخزن وتُعالج بواسطة الحواسيب. وهو مهم في جميع مجالات علم الحاسوب وليس لمصممي الرسوميات فقط."},{"n":1,"ch":5,"qe":"What is an operating system?","qa":"ما هو نظام التشغيل (Operating System)؟","o":[{"l":"A","e":"Software that manages computer hardware and provides services to applications","a":"برمجيات تدير عتاد الحاسوب وتوفر خدمات للتطبيقات"},{"l":"B","e":"A type of processor","a":"نوع من المعالجات"},{"l":"C","e":"A network cable","a":"كابل شبكة"},{"l":"D","e":"A database table","a":"جدول في قاعدة بيانات"}],"c":"A","xe":"An operating system is system software that acts as an intermediary between the user, applications, and hardware, managing resources and providing essential services. It is not a physical component like a processor or cable.","xa":"نظام التشغيل (Operating System) هو برمجيات نظام تعمل كوسيط بين المستخدم والتطبيقات والعتاد، وتدير الموارد وتوفر الخدمات الأساسية. وهو ليس مكوناً مادياً مثل المعالج أو الكابل."},{"n":2,"ch":5,"qe":"Which is an operating system?","qa":"أي مما يلي يُعد نظام تشغيل؟","o":[{"l":"A","e":"Linux","a":"لينكس"},{"l":"B","e":"Python","a":"بايثون"},{"l":"C","e":"HTML","a":"لغة ترميز النص التشعبي"},{"l":"D","e":"SQL","a":"لغة الاستعلامات البنيوية"}],"c":"A","xe":"Linux is a widely used open-source operating system. Python is a programming language, HTML is a markup language for web pages, and SQL is a database query language.","xa":"لينكس (Linux) هو نظام تشغيل مفتوح المصدر واسع الانتشار. أما بايثون فهي لغة برمجة، وHTML هي لغة ترميز لصفحات الويب، وSQL هي لغة استعلامات قواعد البيانات."},{"n":3,"ch":5,"qe":"What is the kernel?","qa":"ما هي النواة (Kernel)؟","o":[{"l":"A","e":"The central part of an operating system that manages fundamental resources","a":"الجزء المركزي من نظام التشغيل الذي يدير الموارد الأساسية"},{"l":"B","e":"A type of keyboard","a":"نوع من لوحات المفاتيح"},{"l":"C","e":"A database","a":"قاعدة بيانات"},{"l":"D","e":"A web browser","a":"متصفح ويب"}],"c":"A","xe":"The kernel is the core component of an operating system, responsible for managing memory, processes, and devices, and acting as the primary interface between hardware and software.","xa":"النواة (Kernel) هي المكون الأساسي لنظام التشغيل، وهي مسؤولة عن إدارة الذاكرة والعمليات والأجهزة، وتعمل كواجهة رئيسية بين العتاد والبرمجيات."},{"n":4,"ch":5,"qe":"What is a process?","qa":"ما هي العملية (Process)؟","o":[{"l":"A","e":"A running instance of a program","a":"نسخة قيد التشغيل من برنامج"},{"l":"B","e":"A computer cable","a":"كابل حاسوب"},{"l":"C","e":"A stored photograph","a":"صورة فوتوغرافية مخزنة"},{"l":"D","e":"A database table","a":"جدول في قاعدة بيانات"}],"c":"A","xe":"A process is an executing instance of a computer program, which includes the program code and its current activity. It is not a physical object like a cable or a static file.","xa":"العملية (Process) هي نسخة قيد التنفيذ من برنامج حاسوبي، وتشمل شفرة البرنامج ونشاطه الحالي. وهي ليست كائناً مادياً مثل الكابل أو ملفاً ثابتاً."},{"n":5,"ch":5,"qe":"What is multitasking?","qa":"ما هي تعدد المهام (Multitasking)؟","o":[{"l":"A","e":"Managing multiple tasks or processes so they can execute seemingly simultaneously","a":"إدارة مهام أو عمليات متعددة بحيث يمكن تنفيذها في آن واحد ظاهرياً"},{"l":"B","e":"Running only one program","a":"تشغيل برنامج واحد فقط"},{"l":"C","e":"Turning off the CPU","a":"إيقاف تشغيل المعالج"},{"l":"D","e":"Deleting applications","a":"حذف التطبيقات"}],"c":"A","xe":"Multitasking is the ability of an operating system to manage multiple processes, giving the illusion of simultaneous execution by rapidly switching between them. It is not about running only one program or turning off the CPU.","xa":"تعدد المهام (Multitasking) هو قدرة نظام التشغيل على إدارة عمليات متعددة، مما يعطي انطباعاً بالتنفيذ المتزامن عبر التبديل السريع بينها. وهو لا يتعلق بتشغيل برنامج واحد أو إيقاف المعالج."},{"n":6,"ch":5,"qe":"What does the operating system manage?","qa":"ماذا يدير نظام التشغيل؟","o":[{"l":"A","e":"Processor, memory, devices, and other resources","a":"المعالج والذاكرة والأجهزة والموارد الأخرى"},{"l":"B","e":"Only the keyboard","a":"لوحة المفاتيح فقط"},{"l":"C","e":"Only websites","a":"مواقع الويب فقط"},{"l":"D","e":"Only documents","a":"المستندات فقط"}],"c":"A","xe":"An operating system is responsible for managing all major hardware and software resources, including the CPU, memory, storage, and input/output devices.","xa":"نظام التشغيل مسؤول عن إدارة جميع موارد العتاد والبرمجيات الرئيسية، بما في ذلك المعالج والذاكرة والتخزين وأجهزة الإدخال والإخراج."},{"n":7,"ch":5,"qe":"What is virtual memory?","qa":"ما هي الذاكرة الافتراضية (Virtual Memory)؟","o":[{"l":"A","e":"An abstraction that allows programs to work with memory beyond the straightforward use of physical RAM","a":"تجريد يسمح للبرامج بالعمل مع ذاكرة تتجاوز الاستخدام المباشر لذاكرة الوصول العشوائي الفعلية"},{"l":"B","e":"A type of keyboard","a":"نوع من لوحات المفاتيح"},{"l":"C","e":"A physical monitor","a":"شاشة مادية"},{"l":"D","e":"A network protocol","a":"بروتوكول شبكة"}],"c":"A","xe":"Virtual memory is a memory management technique that provides an \"idealized abstraction of the storage resources\" that are actually available on a given machine. It allows programs to use more memory than physically installed.","xa":"الذاكرة الافتراضية (Virtual Memory) هي تقنية لإدارة الذاكرة توفر \"تجريداً مثالياً لموارد التخزين\" المتاحة فعلياً على الجهاز. وهي تسمح للبرامج باستخدام ذاكرة أكبر من الذاكرة المثبتة مادياً."},{"n":8,"ch":5,"qe":"What is a file system?","qa":"ما هو نظام الملفات (File System)؟","o":[{"l":"A","e":"A mechanism for organizing and managing files on storage","a":"آلية لتنظيم وإدارة الملفات على وحدات التخزين"},{"l":"B","e":"A processor","a":"معالج"},{"l":"C","e":"A programming language","a":"لغة برمجة"},{"l":"D","e":"A network cable","a":"كابل شبكة"}],"c":"A","xe":"A file system is a method and data structure that an operating system uses to organize, store, and retrieve files on a storage device.","xa":"نظام الملفات (File System) هو طريقة وبنية بيانات يستخدمها نظام التشغيل لتنظيم وتخزين واسترجاع الملفات على جهاز تخزين."},{"n":9,"ch":5,"qe":"What is a device driver?","qa":"ما هو برنامج تشغيل الجهاز (Device Driver)؟","o":[{"l":"A","e":"Software that helps an operating system communicate with specific hardware","a":"برمجيات تساعد نظام التشغيل على التواصل مع عتاد معين"},{"l":"B","e":"A person who operates a computer","a":"شخص يشغل حاسوباً"},{"l":"C","e":"A storage device","a":"جهاز تخزين"},{"l":"D","e":"A type of processor","a":"نوع من المعالجات"}],"c":"A","xe":"A device driver is a specialized software program that allows the operating system to interact with and control a specific hardware device.","xa":"برنامج تشغيل الجهاز (Device Driver) هو برنامج متخصص يسمح لنظام التشغيل بالتفاعل مع جهاز عتاد معين والتحكم فيه."},{"n":10,"ch":5,"qe":"Which is an example of a graphical user interface element?","qa":"أي مما يلي يُعد مثالاً على عنصر واجهة المستخدم الرسومية (GUI)؟","o":[{"l":"A","e":"Window","a":"النافذة"},{"l":"B","e":"CPU register","a":"سجل المعالج"},{"l":"C","e":"Memory address","a":"عنوان الذاكرة"},{"l":"D","e":"Network packet","a":"حزمة شبكة"}],"c":"A","xe":"A window is a visual element in a graphical user interface that displays information and allows user interaction. The other options are low-level computing concepts.","xa":"النافذة (Window) هي عنصر مرئي في واجهة المستخدم الرسومية تعرض المعلومات وتتيح تفاعل المستخدم. أما الخيارات الأخرى فهي مفاهيم حوسبة منخفضة المستوى."},{"n":11,"ch":5,"qe":"What is a command-line interface?","qa":"ما هي واجهة سطر الأوامر (Command-Line Interface)؟","o":[{"l":"A","e":"An interface where users interact through text commands","a":"واجهة يتفاعل فيها المستخدمون عبر أوامر نصية"},{"l":"B","e":"A graphical display only","a":"عرض رسومي فقط"},{"l":"C","e":"A hardware component","a":"مكون عتاد"},{"l":"D","e":"A database","a":"قاعدة بيانات"}],"c":"A","xe":"A command-line interface (CLI) is a text-based user interface where users type commands to interact with the system, as opposed to using graphical elements like windows and icons.","xa":"واجهة سطر الأوامر (CLI) هي واجهة مستخدم نصية يكتب فيها المستخدمون الأوامر للتفاعل مع النظام، على عكس استخدام العناصر الرسومية مثل النوافذ والأيقونات."},{"n":12,"ch":5,"qe":"Why are operating systems important?","qa":"لماذا تُعد أنظمة التشغيل مهمة؟","o":[{"l":"A","e":"They provide an abstraction between applications and hardware","a":"توفر تجريداً بين التطبيقات والعتاد"},{"l":"B","e":"They eliminate the need for processors","a":"تلغي الحاجة إلى المعالجات"},{"l":"C","e":"They only manage games","a":"تدير الألعاب فقط"},{"l":"D","e":"They prevent software from running","a":"تمنع تشغيل البرمجيات"}],"c":"A","xe":"Operating systems are crucial because they hide the complexity of hardware and provide a consistent, simplified interface (abstraction) for applications to use hardware resources.","xa":"أنظمة التشغيل مهمة لأنها تخفي تعقيد العتاد وتوفر واجهة متسقة ومبسطة (تجريداً) للتطبيقات لاستخدام موارد العتاد."},{"n":13,"ch":5,"qe":"What is a system call?","qa":"ما هو استدعاء النظام (System Call)؟","o":[{"l":"A","e":"A controlled interface through which applications request operating-system services","a":"واجهة خاضعة للتحكم تطلب من خلالها التطبيقات خدمات نظام التشغيل"},{"l":"B","e":"A telephone call made by a computer","a":"مكالمة هاتفية يجريها الحاسوب"},{"l":"C","e":"A programming language","a":"لغة برمجة"},{"l":"D","e":"A network cable","a":"كابل شبكة"}],"c":"A","xe":"A system call is the programmatic way in which a computer program requests a service from the kernel of the operating system it is executed on.","xa":"استدعاء النظام (System Call) هو الطريقة البرمجية التي يطلب بها برنامج حاسوبي خدمة من نواة نظام التشغيل الذي يعمل عليه."},{"n":14,"ch":5,"qe":"Which operation may require a system call?","qa":"أي عملية قد تتطلب استدعاء نظام؟","o":[{"l":"A","e":"Opening a file","a":"فتح ملف"},{"l":"B","e":"Typing on paper","a":"الكتابة على الورق"},{"l":"C","e":"Turning a chair","a":"تدوير كرسي"},{"l":"D","e":"Reading a printed book","a":"قراءة كتاب مطبوع"}],"c":"A","xe":"Opening a file is an operation that requires interacting with the file system, which is a service managed by the operating system kernel, thus requiring a system call. The other actions are physical, not computational.","xa":"فتح ملف هو عملية تتطلب التفاعل مع نظام الملفات، وهو خدمة يديرها نواة نظام التشغيل، وبالتالي يتطلب استدعاء نظام. أما الإجراءات الأخرى فهي مادية وليست حاسوبية."},{"n":15,"ch":5,"qe":"Why does an operating system isolate processes?","qa":"لماذا يعزل نظام التشغيل العمليات؟","o":[{"l":"A","e":"To help prevent programs from improperly interfering with one another","a":"للمساعدة في منع البرامج من التداخل بشكل غير لائق مع بعضها البعض"},{"l":"B","e":"To make computers slower","a":"لجعل الحواسيب أبطأ"},{"l":"C","e":"To eliminate memory","a":"لإلغاء الذاكرة"},{"l":"D","e":"To prevent multitasking","a":"لمنع تعدد المهام"}],"c":"A","xe":"Process isolation is a security and stability mechanism that ensures one process cannot access or corrupt the memory or resources of another process. It does not aim to slow down the computer or prevent multitasking.","xa":"عزل العمليات (Process Isolation) هو آلية أمنية واستقرار تضمن عدم تمكن عملية واحدة من الوصول إلى ذاكرة أو موارد عملية أخرى أو إفسادها. وهو لا يهدف إلى إبطاء الحاسوب أو منع تعدد المهام."},{"n":16,"ch":5,"qe":"What does an operating system do with memory?","qa":"ماذا يفعل نظام التشغيل بالذاكرة؟","o":[{"l":"A","e":"Allocates and manages memory for processes","a":"يخصص ويدير الذاكرة للعمليات"},{"l":"B","e":"Deletes all memory","a":"يحذف كل الذاكرة"},{"l":"C","e":"Converts memory into hardware","a":"يحول الذاكرة إلى عتاد"},{"l":"D","e":"Prevents programs from using memory","a":"يمنع البرامج من استخدام الذاكرة"}],"c":"A","xe":"The operating system's memory manager allocates memory to processes when they need it and reclaims it when they are done, ensuring efficient and safe use of memory.","xa":"مدير الذاكرة في نظام التشغيل يخصص الذاكرة للعمليات عند حاجتها إليها ويستعيدها عند انتهائها، مما يضمن استخداماً كفؤاً وآمناً للذاكرة."},{"n":17,"ch":5,"qe":"What is virtualization?","qa":"ما هي المحاكاة الافتراضية (Virtualization)؟","o":[{"l":"A","e":"Creating virtual computing environments on physical hardware","a":"إنشاء بيئات حوسبة افتراضية على عتاد مادي"},{"l":"B","e":"Printing virtual documents","a":"طباعة مستندات افتراضية"},{"l":"C","e":"Converting text into images","a":"تحويل النص إلى صور"},{"l":"D","e":"Removing operating systems","a":"إزالة أنظمة التشغيل"}],"c":"A","xe":"Virtualization is the process of creating a software-based (virtual) representation of something, such as a virtual computer system, on top of physical hardware.","xa":"المحاكاة الافتراضية (Virtualization) هي عملية إنشاء تمثيل برمجي (افتراضي) لشيء ما، مثل نظام حاسوبي افتراضي، فوق عتاد مادي."},{"n":18,"ch":5,"qe":"Why is virtualization useful?","qa":"لماذا تُعد المحاكاة الافتراضية مفيدة؟","o":[{"l":"A","e":"It allows physical resources to support multiple virtual environments","a":"تسمح للموارد المادية بدعم بيئات افتراضية متعددة"},{"l":"B","e":"It eliminates servers","a":"تلغي الخوادم"},{"l":"C","e":"It prevents resource sharing","a":"تمنع مشاركة الموارد"},{"l":"D","e":"It makes hardware unnecessary","a":"تجعل العتاد غير ضروري"}],"c":"A","xe":"Virtualization is useful because it enables better utilization of physical hardware by allowing multiple virtual machines or environments to run on a single physical machine.","xa":"المحاكاة الافتراضية مفيدة لأنها تتيح استغلالاً أفضل للعتاد المادي من خلال السماح بتشغيل أجهزة أو بيئات افتراضية متعددة على جهاز مادي واحد."},{"n":19,"ch":5,"qe":"Which operating system is commonly associated with mobile devices?","qa":"أي نظام تشغيل يرتبط عادةً بالأجهزة المحمولة؟","o":[{"l":"A","e":"Android","a":"أندرويد"},{"l":"B","e":"HTML","a":"لغة ترميز النص التشعبي"},{"l":"C","e":"SQL","a":"لغة الاستعلامات البنيوية"},{"l":"D","e":"C++","a":"لغة سي بلس بلس"}],"c":"A","xe":"Android is a mobile operating system based on the Linux kernel, designed primarily for touchscreen mobile devices such as smartphones and tablets. HTML, SQL, and C++ are not operating systems.","xa":"أندرويد (Android) هو نظام تشغيل محمول يعتمد على نواة لينكس، ومصمم أساساً للأجهزة المحمولة ذات شاشات اللمس مثل الهواتف الذكية والأجهزة اللوحية. أما HTML وSQL وC++ فليست أنظمة تشغيل."},{"n":20,"ch":5,"qe":"Which operating system is commonly associated with Apple computers?","qa":"أي نظام تشغيل يرتبط عادةً بحواسيب آبل؟","o":[{"l":"A","e":"macOS","a":"ماك أو إس"},{"l":"B","e":"Python","a":"بايثون"},{"l":"C","e":"Linux kernel only","a":"نواة لينكس فقط"},{"l":"D","e":"JavaScript","a":"جافا سكريبت"}],"c":"A","xe":"macOS is the primary operating system developed by Apple Inc. for its Mac line of desktop and laptop computers. Python and JavaScript are programming languages.","xa":"ماك أو إس (macOS) هو نظام التشغيل الأساسي الذي طورته شركة آبل لحواسيب ماك المكتبية والمحمولة. أما بايثون وجافا سكريبت فهما لغتا برمجة."},{"n":21,"ch":5,"qe":"What is resource allocation?","qa":"ما هو تخصيص الموارد (Resource Allocation)؟","o":[{"l":"A","e":"Assigning computing resources such as CPU time and memory to programs","a":"تخصيص موارد الحوسبة مثل وقت المعالج والذاكرة للبرامج"},{"l":"B","e":"Deleting all files","a":"حذف جميع الملفات"},{"l":"C","e":"Installing websites","a":"تثبيت مواقع الويب"},{"l":"D","e":"Designing graphics","a":"تصميم الرسوميات"}],"c":"A","xe":"Resource allocation is the process by which an operating system distributes available resources, such as CPU time, memory, and I/O devices, among competing processes.","xa":"تخصيص الموارد (Resource Allocation) هو العملية التي يوزع بها نظام التشغيل الموارد المتاحة، مثل وقت المعالج والذاكرة وأجهزة الإدخال/الإخراج، بين العمليات المتنافسة."},{"n":22,"ch":5,"qe":"What is authentication?","qa":"ما هي المصادقة (Authentication)؟","o":[{"l":"A","e":"Determining the identity of a user or system","a":"تحديد هوية مستخدم أو نظام"},{"l":"B","e":"Giving every user unlimited access","a":"منح كل مستخدم وصولاً غير محدود"},{"l":"C","e":"Deleting passwords","a":"حذف كلمات المرور"},{"l":"D","e":"Formatting a hard drive","a":"تهيئة قرص صلب"}],"c":"A","xe":"Authentication is the process of verifying the identity of a user, device, or system, typically through credentials like passwords, biometrics, or tokens.","xa":"المصادقة (Authentication) هي عملية التحقق من هوية مستخدم أو جهاز أو نظام، عادةً من خلال بيانات اعتماد مثل كلمات المرور أو القياسات الحيوية أو الرموز."},{"n":23,"ch":5,"qe":"What is authorization?","qa":"ما هي التخويل (Authorization)؟","o":[{"l":"A","e":"Determining what an authenticated user is allowed to access","a":"تحديد ما يُسمح للمستخدم المُصادق عليه بالوصول إليه"},{"l":"B","e":"Determining whether a computer has electricity","a":"تحديد ما إذا كان الحاسوب لديه كهرباء"},{"l":"C","e":"Identifying a CPU brand","a":"تحديد ماركة المعالج"},{"l":"D","e":"Connecting a printer","a":"توصيل طابعة"}],"c":"A","xe":"Authorization is the process of specifying and enforcing access rights and permissions for an authenticated user or system, determining what resources they can use.","xa":"التخويل (Authorization) هو عملية تحديد وإنفاذ حقوق الوصول والأذونات لمستخدم أو نظام مُصادق عليه، وتحديد الموارد التي يمكنه استخدامها."},{"n":24,"ch":5,"qe":"What is a key responsibility of an operating system?","qa":"ما هي المسؤولية الرئيسية لنظام التشغيل؟ (نص السؤال ناقص في الملف؛ تم استنتاجه من الخيارات.)","o":[{"l":"A","e":"Managing hardware resources","a":"إدارة موارد العتاد"},{"l":"B","e":"Manufacturing processors","a":"تصنيع المعالجات"},{"l":"C","e":"Writing all applications automatically","a":"كتابة جميع التطبيقات تلقائياً"},{"l":"D","e":"Creating electricity","a":"توليد الكهرباء"}],"c":"A","xe":"A core responsibility of an operating system is to manage hardware resources such as the CPU, memory, and I/O devices, allocating them to applications as needed. It does not manufacture hardware or create electricity.","xa":"من المسؤوليات الأساسية لنظام التشغيل إدارة موارد العتاد مثل المعالج والذاكرة وأجهزة الإدخال/الإخراج، وتخصيصها للتطبيقات حسب الحاجة. وهو لا يصنع العتاد ولا يولد الكهرباء."},{"n":25,"ch":5,"qe":"Why are file systems necessary?","qa":"لماذا تُعد أنظمة الملفات ضرورية؟","o":[{"l":"A","e":"They organize files and information stored on storage devices","a":"تنظم الملفات والمعلومات المخزنة على أجهزة التخزين"},{"l":"B","e":"They replace processors","a":"تستبدل المعالجات"},{"l":"C","e":"They prevent data storage","a":"تمنع تخزين البيانات"},{"l":"D","e":"They only manage websites","a":"تدير مواقع الويب فقط"}],"c":"A","xe":"File systems are necessary because they provide a structured way to store, organize, retrieve, and manage files and directories on storage media.","xa":"أنظمة الملفات ضرورية لأنها توفر طريقة منظمة لتخزين وتنظيم واسترجاع وإدارة الملفات والمجلدات على وسائط التخزين."},{"n":26,"ch":5,"qe":"What is the purpose of process scheduling?","qa":"ما هو الغرض من جدولة العمليات (Process Scheduling)؟","o":[{"l":"A","e":"Determining how processor resources are allocated among processes","a":"تحديد كيفية تخصيص موارد المعالج بين العمليات"},{"l":"B","e":"Organizing photographs","a":"تنظيم الصور الفوتوغرافية"},{"l":"C","e":"Managing passwords only","a":"إدارة كلمات المرور فقط"},{"l":"D","e":"Designing websites","a":"تصميم مواقع الويب"}],"c":"A","xe":"Process scheduling is the activity of the operating system that decides which process runs at a certain point in time, aiming to maximize CPU utilization and system efficiency.","xa":"جدولة العمليات (Process Scheduling) هي نشاط نظام التشغيل الذي يقرر أي عملية تعمل في نقطة زمنية معينة، بهدف تعظيم استخدام المعالج وكفاءة النظام."},{"n":27,"ch":5,"qe":"Which interface is particularly useful for automation and precise control?","qa":"أي واجهة تكون مفيدة بشكل خاص للأتمتة والتحكم الدقيق؟","o":[{"l":"A","e":"Command-line interface","a":"واجهة سطر الأوامر"},{"l":"B","e":"Monitor","a":"الشاشة"},{"l":"C","e":"Keyboard hardware","a":"عتاد لوحة المفاتيح"},{"l":"D","e":"Speaker","a":"مكبر الصوت"}],"c":"A","xe":"A command-line interface is highly suitable for automation and precise control because commands can be scripted, combined, and executed repeatedly with exact parameters. A monitor, keyboard, or speaker are hardware components, not interfaces for automation.","xa":"واجهة سطر الأوامر (Command-Line Interface) مناسبة جداً للأتمتة والتحكم الدقيق لأن الأوامر يمكن كتابتها في نصوص برمجية ودمجها وتنفيذها بشكل متكرر بمعاملات دقيقة. أما الشاشة ولوحة المفاتيح ومكبر الصوت فهي مكونات عتاد وليست واجهات للأتمتة."},{"n":28,"ch":5,"qe":"What does an operating system provide to application developers?","qa":"ماذا يوفر نظام التشغيل لمطوري التطبيقات؟","o":[{"l":"A","e":"Standard services and abstractions for using hardware resources","a":"خدمات وتجريدات قياسية لاستخدام موارد العتاد"},{"l":"B","e":"Free hardware","a":"عتاد مجاني"},{"l":"C","e":"Automatic programming skills","a":"مهارات برمجة تلقائية"},{"l":"D","e":"Unlimited memory","a":"ذاكرة غير محدودة"}],"c":"A","xe":"An operating system provides application developers with a set of standard services and abstractions (such as file systems, network sockets, and memory management APIs) that simplify the use of hardware resources.","xa":"يوفر نظام التشغيل لمطوري التطبيقات مجموعة من الخدمات والتجريدات القياسية (مثل أنظمة الملفات ومقابس الشبكة وواجهات برمجة إدارة الذاكرة) التي تبسط استخدام موارد العتاد."},{"n":29,"ch":5,"qe":"Which is NOT normally an operating-system responsibility?","qa":"أي مما يلي ليس عادةً من مسؤوليات نظام التشغيل؟","o":[{"l":"A","e":"Managing memory","a":"إدارة الذاكرة"},{"l":"B","e":"Managing processes","a":"إدارة العمليات"},{"l":"C","e":"Managing hardware devices","a":"إدارة أجهزة العتاد"},{"l":"D","e":"Manufacturing computer chips","a":"تصنيع شرائح الحاسوب"}],"c":"D","xe":"Manufacturing computer chips is a hardware fabrication process, not a software function of an operating system. Managing memory, processes, and hardware devices are core OS responsibilities.","xa":"تصنيع شرائح الحاسوب هو عملية تصنيع عتاد، وليس وظيفة برمجية لنظام التشغيل. أما إدارة الذاكرة والعمليات وأجهزة العتاد فهي من مسؤوليات نظام التشغيل الأساسية."},{"n":30,"ch":5,"qe":"What is the relationship between an operating system and applications?","qa":"ما هي العلاقة بين نظام التشغيل والتطبيقات؟","o":[{"l":"A","e":"The operating system provides services and manages resources used by applications","a":"يوفر نظام التشغيل الخدمات ويدير الموارد التي تستخدمها التطبيقات"},{"l":"B","e":"Applications physically manufacture the operating system","a":"التطبيقات تصنع نظام التشغيل مادياً"},{"l":"C","e":"Applications cannot use operating systems","a":"لا يمكن للتطبيقات استخدام أنظمة التشغيل"},{"l":"D","e":"They are exactly the same thing","a":"هما نفس الشيء بالضبط"}],"c":"A","xe":"The relationship is that the operating system acts as a platform and resource manager for applications, providing them with services and controlled access to hardware. They are not the same, and applications do not manufacture the OS.","xa":"العلاقة هي أن نظام التشغيل يعمل كمنصة ومدير موارد للتطبيقات، ويوفر لها الخدمات والوصول الخاضع للتحكم إلى العتاد. وهما ليسا نفس الشيء، والتطبيقات لا تصنع نظام التشغيل."},{"n":1,"ch":6,"qe":"What is a programming language?","qa":"ما هي لغة البرمجة (Programming Language)؟","o":[{"l":"A","e":"A type of computer hardware","a":"نوع من عتاد الحاسوب"},{"l":"B","e":"A language used to write instructions for computers","a":"لغة تُستخدم لكتابة تعليمات للحواسيب"},{"l":"C","e":"A storage device","a":"جهاز تخزين"},{"l":"D","e":"A network cable","a":"كابل شبكة"}],"c":"B","xe":"A programming language is a formal language comprising a set of instructions that produce various kinds of output, used to implement algorithms and communicate with computers.","xa":"لغة البرمجة (Programming Language) هي لغة رسمية تتكون من مجموعة تعليمات تنتج أنواعاً مختلفة من المخرجات، وتُستخدم لتنفيذ الخوارزميات والتواصل مع الحواسيب."},{"n":2,"ch":6,"qe":"Which of the following is a programming language?","qa":"أي مما يلي يُعد لغة برمجة؟","o":[{"l":"A","e":"Python","a":"بايثون"},{"l":"B","e":"HTML Monitor","a":"شاشة HTML"},{"l":"C","e":"RAM","a":"ذاكرة الوصول العشوائي"},{"l":"D","e":"CPU","a":"وحدة المعالجة المركزية"}],"c":"A","xe":"Python is a high-level, general-purpose programming language. The other options describe hardware components (monitor, RAM, CPU) or an incorrect combination.","xa":"بايثون (Python) هي لغة برمجة عالية المستوى عامة الغرض. أما الخيارات الأخرى فتصف مكونات عتاد (شاشة، ذاكرة وصول عشوائي، معالج) أو تركيبة غير صحيحة."},{"n":3,"ch":6,"qe":"What is a variable in programming?","qa":"ما هو المتغير (Variable) في البرمجة؟","o":[{"l":"A","e":"A physical component of a computer","a":"مكون مادي في الحاسوب"},{"l":"B","e":"A named location used to store a value","a":"موقع مسمى يُستخدم لتخزين قيمة"},{"l":"C","e":"A type of network","a":"نوع من الشبكات"},{"l":"D","e":"A computer virus","a":"فيروس حاسوب"}],"c":"B","xe":"A variable is a symbolic name associated with a value and whose associated value may be changed. It is a fundamental concept in programming for storing and manipulating data.","xa":"المتغير (Variable) هو اسم رمزي مرتبط بقيمة ويمكن تغيير القيمة المرتبطة به. وهو مفهوم أساسي في البرمجة لتخزين البيانات ومعالجتها."},{"n":4,"ch":6,"qe":"Which data type is normally used to represent whole numbers?","qa":"أي نوع بيانات يُستخدم عادةً لتمثيل الأعداد الصحيحة؟","o":[{"l":"A","e":"Integer","a":"عدد صحيح"},{"l":"B","e":"String","a":"سلسلة نصية"},{"l":"C","e":"Boolean","a":"منطقي"},{"l":"D","e":"Character","a":"حرف"}],"c":"A","xe":"The integer data type is used to represent whole numbers (numbers without a fractional component), such as -3, 0, or 42.","xa":"يُستخدم نوع البيانات الصحيح (Integer) لتمثيل الأعداد الصحيحة (الأعداد بدون جزء كسري)، مثل -3 أو 0 أو 42."},{"n":5,"ch":6,"qe":"Which data type represents text?","qa":"أي نوع بيانات يمثل النص؟","o":[{"l":"A","e":"Integer","a":"عدد صحيح"},{"l":"B","e":"Boolean","a":"منطقي"},{"l":"C","e":"String","a":"سلسلة نصية"},{"l":"D","e":"Float","a":"عدد عشري"}],"c":"C","xe":"The string data type is used to represent sequences of characters, such as words, sentences, or any textual data.","xa":"يُستخدم نوع البيانات النصي (String) لتمثيل تسلسلات من الأحرف، مثل الكلمات أو الجمل أو أي بيانات نصية."},{"n":6,"ch":6,"qe":"Which data type normally has only two possible values?","qa":"أي نوع بيانات له قيمتان محتملتان فقط عادةً؟","o":[{"l":"A","e":"String","a":"سلسلة نصية"},{"l":"B","e":"Boolean","a":"منطقي"},{"l":"C","e":"Integer","a":"عدد صحيح"},{"l":"D","e":"Array","a":"مصفوفة"}],"c":"B","xe":"The Boolean data type represents logical values and typically has only two possible values: true and false.","xa":"يمثل نوع البيانات المنطقي (Boolean) القيم المنطقية وله عادةً قيمتان محتملتان فقط: صحيح (true) وخطأ (false)."},{"n":7,"ch":6,"qe":"Which of the following is a Boolean value?","qa":"أي مما يلي يُعد قيمة منطقية (Boolean)؟","o":[{"l":"A","e":"\"Computer\"","a":"\"حاسوب\""},{"l":"B","e":"25","a":"25"},{"l":"C","e":"True","a":"صحيح"},{"l":"D","e":"4.5","a":"4.5"}],"c":"C","xe":"\"True\" is a Boolean literal representing logical truth. \"Computer\" is a string, 25 is an integer, and 4.5 is a floating-point number.","xa":"\"صحيح\" (True) هو حرف منطقي (Boolean Literal) يمثل الحقيقة المنطقية. أما \"حاسوب\" فهي سلسلة نصية، و25 عدد صحيح، و4.5 عدد عشري."},{"n":8,"ch":6,"qe":"What is an operator?","qa":"ما هو المعامل (Operator)؟ (نص السؤال ناقص في الملف؛ تم استنتاجه من الخيارات.)","o":[{"l":"A","e":"A person who repairs computers","a":"شخص يصلح الحواسيب"},{"l":"B","e":"A symbol or keyword used to perform an operation","a":"رمز أو كلمة مفتاحية تُستخدم لإجراء عملية"},{"l":"C","e":"A storage device","a":"جهاز تخزين"},{"l":"D","e":"A computer network","a":"شبكة حاسوب"}],"c":"B","xe":"An operator is a symbol (like +, -, *, /) or a keyword (like and, or, not) that specifies an operation to be performed on one or more operands.","xa":"المعامل (Operator) هو رمز (مثل +، -، *، /) أو كلمة مفتاحية (مثل and، or، not) تحدد عملية يجب إجراؤها على معامل واحد أو أكثر."},{"n":9,"ch":6,"qe":"Which operator is commonly used for addition?","qa":"أي معامل يُستخدم عادةً للجمع؟","o":[{"l":"A","e":"*","a":"الضرب"},{"l":"B","e":"/","a":"القسمة"},{"l":"C","e":"+","a":"الجمع"},{"l":"D","e":"%","a":"باقي القسمة"}],"c":"C","xe":"The plus sign (+) is the standard operator for addition in most programming languages. The asterisk (*) is for multiplication, the slash (/) for division, and the percent sign (%) for modulo.","xa":"علامة الزائد (+) هي المعامل القياسي للجمع في معظم لغات البرمجة. أما النجمة (*) فللضرب، والشرطة المائلة (/) للقسمة، وعلامة النسبة المئوية (%) لباقي القسمة."},{"n":10,"ch":6,"qe":"What is a conditional statement used for?","qa":"فيمَ تُستخدم العبارة الشرطية (Conditional Statement)؟","o":[{"l":"A","e":"Storing files permanently","a":"تخزين الملفات بشكل دائم"},{"l":"B","e":"Making decisions based on conditions","a":"اتخاذ قرارات بناءً على شروط"},{"l":"C","e":"Connecting computers physically","a":"توصيل الحواسيب مادياً"},{"l":"D","e":"Increasing monitor resolution","a":"زيادة دقة الشاشة"}],"c":"B","xe":"A conditional statement allows a program to execute different blocks of code depending on whether a specified condition evaluates to true or false.","xa":"تسمح العبارة الشرطية (Conditional Statement) للبرنامج بتنفيذ كتل مختلفة من التعليمات البرمجية اعتماداً على ما إذا كان شرط معين يقيّم إلى صحيح أو خطأ."},{"n":11,"ch":6,"qe":"Which keyword is commonly associated with conditional logic in many languages?","qa":"أي كلمة مفتاحية ترتبط عادةً بالمنطق الشرطي في العديد من اللغات؟","o":[{"l":"A","e":"if","a":"إذا"},{"l":"B","e":"print","a":"اطبع"},{"l":"C","e":"import","a":"استورد"},{"l":"D","e":"return","a":"أعد"}],"c":"A","xe":"The `if` keyword is the most common way to introduce a conditional statement in many programming languages, allowing code to execute based on a condition.","xa":"الكلمة المفتاحية `if` (إذا) هي الطريقة الأكثر شيوعاً لتقديم عبارة شرطية في العديد من لغات البرمجة، مما يسمح بتنفيذ التعليمات بناءً على شرط."},{"n":12,"ch":6,"qe":"What is a loop?","qa":"ما هي الحلقة (Loop)؟","o":[{"l":"A","e":"A way to repeat a set of instructions","a":"طريقة لتكرار مجموعة من التعليمات"},{"l":"B","e":"A computer cable","a":"كابل حاسوب"},{"l":"C","e":"A type of memory","a":"نوع من الذاكرة"},{"l":"D","e":"A programming error","a":"خطأ برمجي"}],"c":"A","xe":"A loop is a programming construct that repeats a block of code as long as a certain condition is met, enabling efficient repetition of tasks.","xa":"الحلقة (Loop) هي بنية برمجية تكرر كتلة من التعليمات البرمجية طالما تحقق شرط معين، مما يتيح تكرار المهام بكفاءة."},{"n":13,"ch":6,"qe":"Which loop is commonly used when the number of repetitions is known?","qa":"أي حلقة تُستخدم عادةً عندما يكون عدد التكرارات معروفاً؟","o":[{"l":"A","e":"for loop","a":"حلقة for"},{"l":"B","e":"if statement","a":"عبارة if"},{"l":"C","e":"variable","a":"متغير"},{"l":"D","e":"function","a":"دالة"}],"c":"A","xe":"A `for` loop is typically used when the number of iterations is known in advance, as it allows initialization, condition checking, and incrementing in a single line.","xa":"تُستخدم حلقة `for` عادةً عندما يكون عدد التكرارات معروفاً مسبقاً، لأنها تسمح بالتهيئة وفحص الشرط والزيادة في سطر واحد."},{"n":14,"ch":6,"qe":"What is a function?","qa":"ما هي الدالة (Function)؟","o":[{"l":"A","e":"A reusable block of code that performs a task","a":"كتلة تعليمات برمجية قابلة لإعادة الاستخدام تؤدي مهمة"},{"l":"B","e":"A type of CPU","a":"نوع من وحدات المعالجة المركزية"},{"l":"C","e":"A storage device","a":"جهاز تخزين"},{"l":"D","e":"A network protocol","a":"بروتوكول شبكة"}],"c":"A","xe":"A function is a named, reusable block of code designed to perform a specific task, helping to organize programs and avoid repetition.","xa":"الدالة (Function) هي كتلة تعليمات برمجية مسماة وقابلة لإعادة الاستخدام مصممة لأداء مهمة محددة، مما يساعد على تنظيم البرامج وتجنب التكرار."},{"n":15,"ch":6,"qe":"Why are functions useful?","qa":"لماذا تُعد الدوال مفيدة؟","o":[{"l":"A","e":"They make programs physically smaller","a":"تجعل البرامج أصغر حجماً مادياً"},{"l":"B","e":"They encourage code reuse and organization","a":"تشجع على إعادة استخدام التعليمات البرمجية وتنظيمها"},{"l":"C","e":"They eliminate all errors","a":"تلغي جميع الأخطاء"},{"l":"D","e":"They replace the operating system","a":"تستبدل نظام التشغيل"}],"c":"B","xe":"Functions are useful because they allow programmers to reuse code, making programs more organized, readable, and maintainable. They do not eliminate all errors or replace the OS.","xa":"الدوال مفيدة لأنها تسمح للمبرمجين بإعادة استخدام التعليمات البرمجية، مما يجعل البرامج أكثر تنظيماً وقابلية للقراءة والصيانة. وهي لا تلغي جميع الأخطاء ولا تستبدل نظام التشغيل."},{"n":16,"ch":6,"qe":"What is a parameter?","qa":"ما هي المعلمة (Parameter)؟","o":[{"l":"A","e":"A value or variable supplied to a function","a":"قيمة أو متغير يُمرر إلى دالة"},{"l":"B","e":"A hardware component","a":"مكون عتاد"},{"l":"C","e":"A type of virus","a":"نوع من الفيروسات"},{"l":"D","e":"A network connection","a":"اتصال شبكة"}],"c":"A","xe":"A parameter is a variable listed in a function's definition that receives a value when the function is called; the value actually passed is the argument. The option describes this value supplied to a function, so it is the best answer.","xa":"المعامل (Parameter) هو متغير يُعرَّف في الدالة ويستقبل قيمة عند استدعائها، والقيمة الفعلية التي تُمرَّر تسمى (Argument). الخيار الصحيح يصف القيمة المُمرَّرة للدالة، لذلك هو الأنسب."},{"n":17,"ch":6,"qe":"What does a return statement generally do?","qa":"ماذا تفعل عبارة الإرجاع (Return Statement) عموماً؟","o":[{"l":"A","e":"Stops the computer permanently","a":"توقف الحاسوب بشكل دائم"},{"l":"B","e":"Sends a result back from a function","a":"ترسل نتيجة من دالة"},{"l":"C","e":"Deletes a program","a":"تحذف برنامجاً"},{"l":"D","e":"Starts a network connection","a":"تبدأ اتصال شبكة"}],"c":"B","xe":"A return statement ends the execution of a function and sends a value back to the calling code. It does not stop the computer or delete programs.","xa":"عبارة الإرجاع (Return Statement) تنهي تنفيذ الدالة وترسل قيمة إلى الكود الذي استدعاها. وهي لا توقف الحاسوب ولا تحذف البرامج."},{"n":18,"ch":6,"qe":"What is debugging?","qa":"ما هو تصحيح الأخطاء (Debugging)؟","o":[{"l":"A","e":"Designing computer hardware","a":"تصميم عتاد الحاسوب"},{"l":"B","e":"Finding and fixing errors in programs","a":"إيجاد وإصلاح الأخطاء في البرامج"},{"l":"C","e":"Installing a monitor","a":"تثبيت شاشة"},{"l":"D","e":"Creating a database table only","a":"إنشاء جدول قاعدة بيانات فقط"}],"c":"B","xe":"Debugging is the process of identifying, analyzing, and removing errors (bugs) from computer programs to ensure they function correctly.","xa":"تصحيح الأخطاء (Debugging) هو عملية تحديد وتحليل وإزالة الأخطاء (Bugs) من برامج الحاسوب لضمان عملها بشكل صحيح."},{"n":19,"ch":6,"qe":"What is a syntax error?","qa":"ما هو خطأ الصياغة (Syntax Error)؟","o":[{"l":"A","e":"An error caused by incorrect programming-language structure","a":"خطأ ناتج عن بنية غير صحيحة في لغة البرمجة"},{"l":"B","e":"A hardware failure","a":"عطل في العتاد"},{"l":"C","e":"A network failure","a":"عطل في الشبكة"},{"l":"D","e":"A storage failure","a":"عطل في التخزين"}],"c":"A","xe":"A syntax error is a mistake in the spelling, grammar, or structure of the code that violates the rules of the programming language, preventing it from being compiled or interpreted.","xa":"خطأ الصياغة (Syntax Error) هو خطأ في تهجئة أو قواعد أو بنية التعليمات البرمجية ينتهك قواعد لغة البرمجة، مما يمنع تجميعها أو تفسيرها."},{"n":20,"ch":6,"qe":"What is a logic error?","qa":"ما هو الخطأ المنطقي (Logic Error)؟","o":[{"l":"A","e":"A problem where the program runs but produces an incorrect result","a":"مشكلة حيث يعمل البرنامج لكنه ينتج نتيجة غير صحيحة"},{"l":"B","e":"A broken keyboard","a":"لوحة مفاتيح مكسورة"},{"l":"C","e":"A missing computer cable","a":"كابل حاسوب مفقود"},{"l":"D","e":"A damaged hard drive","a":"قرص صلب تالف"}],"c":"A","xe":"A logic error occurs when a program compiles and runs without crashing but produces an incorrect or unexpected result due to a flaw in the program's logic.","xa":"يحدث الخطأ المنطقي (Logic Error) عندما يتم تجميع البرنامج وتشغيله دون انهيار لكنه ينتج نتيجة غير صحيحة أو غير متوقعة بسبب خلل في منطق البرنامج."},{"n":21,"ch":6,"qe":"What is an interpreter?","qa":"ما هو المفسر (Interpreter)؟","o":[{"l":"A","e":"A program that executes source code, often instruction by instruction","a":"برنامج ينفذ التعليمات البرمجية المصدرية، غالباً تعليمة بتعليمة"},{"l":"B","e":"A hardware memory chip","a":"شريحة ذاكرة عتاد"},{"l":"C","e":"A network router","a":"موجه شبكة"},{"l":"D","e":"A database","a":"قاعدة بيانات"}],"c":"A","xe":"An interpreter is a computer program that directly executes instructions written in a programming or scripting language without previously compiling them into a machine language program.","xa":"المفسر (Interpreter) هو برنامج حاسوبي ينفذ التعليمات المكتوبة بلغة برمجة أو لغة نصوص برمجية مباشرةً دون تجميعها مسبقاً في برنامج لغة آلة."},{"n":22,"ch":6,"qe":"What is a compiler?","qa":"ما هو المترجم (Compiler)؟","o":[{"l":"A","e":"Software that translates source code into another form, such as machine code","a":"برمجيات تترجم التعليمات البرمجية المصدرية إلى شكل آخر، مثل لغة الآلة"},{"l":"B","e":"A type of monitor","a":"نوع من الشاشات"},{"l":"C","e":"A storage device","a":"جهاز تخزين"},{"l":"D","e":"A web browser","a":"متصفح ويب"}],"c":"A","xe":"A compiler is a special program that translates a programming language's source code into machine code, bytecode, or another programming language, typically for execution.","xa":"المترجم (Compiler) هو برنامج خاص يترجم التعليمات البرمجية المصدرية للغة برمجة إلى لغة آلة أو كود بايت أو لغة برمجة أخرى، عادةً للتنفيذ."},{"n":23,"ch":6,"qe":"What is source code?","qa":"ما هي التعليمات البرمجية المصدرية (Source Code)؟","o":[{"l":"A","e":"The human-readable code written by a programmer","a":"التعليمات البرمجية القابلة للقراءة البشرية التي يكتبها المبرمج"},{"l":"B","e":"Computer electricity","a":"كهرباء الحاسوب"},{"l":"C","e":"A type of CPU cache","a":"نوع من ذاكرة التخزين المؤقت للمعالج"},{"l":"D","e":"A network cable","a":"كابل شبكة"}],"c":"A","xe":"Source code is the collection of computer instructions written using a human-readable programming language, often saved in text files, which is then compiled or interpreted.","xa":"التعليمات البرمجية المصدرية (Source Code) هي مجموعة تعليمات الحاسوب المكتوبة باستخدام لغة برمجة قابلة للقراءة البشرية، وغالباً ما تُحفظ في ملفات نصية، ثم تُترجم أو تُفسر."},{"n":24,"ch":6,"qe":"Why is indentation important in some programming languages?","qa":"لماذا يُعد الإزاحة (Indentation) مهماً في بعض لغات البرمجة؟","o":[{"l":"A","e":"It can improve readability and, in some languages, affect program structure","a":"يمكن أن يحسن القراءة، وفي بعض اللغات يؤثر على بنية البرنامج"},{"l":"B","e":"It increases CPU speed","a":"يزيد سرعة المعالج"},{"l":"C","e":"It adds physical memory","a":"يضيف ذاكرة مادية"},{"l":"D","e":"It encrypts files","a":"يشفر الملفات"}],"c":"A","xe":"Indentation improves code readability. In some languages like Python, it is syntactically significant and defines the structure and flow of the program. It does not affect CPU speed or memory.","xa":"الإزاحة (Indentation) تحسن قراءة التعليمات البرمجية. وفي بعض اللغات مثل بايثون، لها أهمية نحوية وتحدد بنية البرنامج وتدفقه. وهي لا تؤثر على سرعة المعالج أو الذاكرة."},{"n":25,"ch":6,"qe":"What is a comment in source code?","qa":"ما هو التعليق (Comment) في التعليمات البرمجية المصدرية؟","o":[{"l":"A","e":"Text intended to explain code and normally not executed as a program instruction","a":"نص يهدف إلى شرح التعليمات البرمجية ولا يُنفذ عادةً كتعليمة برنامج"},{"l":"B","e":"A hardware error","a":"خطأ في العتاد"},{"l":"C","e":"A database record","a":"سجل في قاعدة بيانات"},{"l":"D","e":"A computer virus","a":"فيروس حاسوب"}],"c":"A","xe":"Comments are annotations in the source code added by programmers to explain the code's purpose or logic. They are ignored by the compiler or interpreter and do not affect the program's execution.","xa":"التعليقات (Comments) هي شروح في التعليمات البرمجية المصدرية يضيفها المبرمجون لشرح غرض الكود أو منطقه. يتم تجاهلها بواسطة المترجم أو المفسر ولا تؤثر على تنفيذ البرنامج."},{"n":26,"ch":6,"qe":"What is an infinite loop?","qa":"ما هي الحلقة اللانهائية (Infinite Loop)؟","o":[{"l":"A","e":"A loop that never reaches its stopping condition","a":"حلقة لا تصل أبداً إلى شرط التوقف"},{"l":"B","e":"A loop that runs exactly once","a":"حلقة تعمل مرة واحدة بالضبط"},{"l":"C","e":"A function with no parameters","a":"دالة بدون معلمات"},{"l":"D","e":"A program with no variables","a":"برنامج بدون متغيرات"}],"c":"A","xe":"An infinite loop is a sequence of instructions that repeats endlessly because the loop's termination condition is never met.","xa":"الحلقة اللانهائية (Infinite Loop) هي تسلسل من التعليمات يتكرر بلا نهاية لأن شرط إنهاء الحلقة لا يتحقق أبداً."},{"n":27,"ch":6,"qe":"Which practice generally improves program quality?","qa":"أي ممارسة تحسن جودة البرنامج عموماً؟","o":[{"l":"A","e":"Avoiding testing","a":"تجنب الاختبار"},{"l":"B","e":"Writing unclear code","a":"كتابة تعليمات برمجية غير واضحة"},{"l":"C","e":"Testing and debugging regularly","a":"الاختبار وتصحيح الأخطاء بانتظام"},{"l":"D","e":"Ignoring errors","a":"تجاهل الأخطاء"}],"c":"C","xe":"Regular testing and debugging help identify and fix defects early, leading to more reliable and higher-quality software. Avoiding testing or ignoring errors has the opposite effect.","xa":"يساعد الاختبار وتصحيح الأخطاء بانتظام في تحديد وإصلاح العيوب مبكراً، مما يؤدي إلى برمجيات أكثر موثوقية وجودة أعلى. أما تجنب الاختبار أو تجاهل الأخطاء فله تأثير معاكس."},{"n":28,"ch":6,"qe":"What is an input in a program?","qa":"ما هو الإدخال (Input) في البرنامج؟","o":[{"l":"A","e":"Information supplied to the program","a":"معلومات تُقدم إلى البرنامج"},{"l":"B","e":"The final result only","a":"النتيجة النهائية فقط"},{"l":"C","e":"A computer screen","a":"شاشة حاسوب"},{"l":"D","e":"A programming language","a":"لغة برمجة"}],"c":"A","xe":"Input refers to any data or information provided to a program from an external source, such as user input, files, or other programs, for processing.","xa":"الإدخال (Input) يشير إلى أي بيانات أو معلومات تُقدم إلى البرنامج من مصدر خارجي، مثل إدخال المستخدم أو الملفات أو البرامج الأخرى، للمعالجة."},{"n":29,"ch":6,"qe":"What is output?","qa":"ما هو الإخراج (Output)؟","o":[{"l":"A","e":"Information produced by a program","a":"معلومات ينتجها البرنامج"},{"l":"B","e":"A keyboard key","a":"مفتاح في لوحة المفاتيح"},{"l":"C","e":"A programming error","a":"خطأ برمجي"},{"l":"D","e":"A network cable","a":"كابل شبكة"}],"c":"A","xe":"Output is the result or information produced by a computer program after processing input data, which can be displayed, stored, or sent to another device.","xa":"الإخراج (Output) هو النتيجة أو المعلومات التي ينتجها برنامج حاسوبي بعد معالجة بيانات الإدخال، ويمكن عرضها أو تخزينها أو إرسالها إلى جهاز آخر."},{"n":30,"ch":6,"qe":"What is one of the most important goals when learning programming?","qa":"ما هو أحد أهم الأهداف عند تعلم البرمجة؟","o":[{"l":"A","e":"Memorizing every programming language","a":"حفظ كل لغة برمجة"},{"l":"B","e":"Developing the ability to express and solve problems systematically","a":"تطوير القدرة على التعبير عن المشكلات وحلها بشكل منهجي"},{"l":"C","e":"Avoiding all experimentation","a":"تجنب كل التجريب"},{"l":"D","e":"Learning only computer hardware","a":"تعلم عتاد الحاسوب فقط"}],"c":"B","xe":"The most important goal of learning programming is to develop systematic problem-solving and computational thinking skills, not merely memorizing syntax or avoiding experimentation.","xa":"أهم هدف من تعلم البرمجة هو تطوير مهارات حل المشكلات بشكل منهجي والتفكير الحاسوبي، وليس مجرد حفظ الصياغة أو تجنب التجريب."},{"n":1,"ch":9,"qe":"Which of the following is NOT a core control structure of structured programming?","qa":"أي مما يلي ليس من هياكل التحكم الأساسية في البرمجة المهيكلة (Structured Programming)؟","o":[{"l":"A","e":"Sequence","a":"التتابع (Sequence)"},{"l":"B","e":"Selection","a":"الاختيار (Selection)"},{"l":"C","e":"Iteration","a":"التكرار (Iteration)"},{"l":"D","e":"goto","a":"عبارة الانتقال (goto)"}],"c":"D","xe":"Structured programming is built on three core control structures: sequence, selection, and iteration . The `goto` statement allows arbitrary jumps in program flow and is famously discouraged in structured programming because it breaks logical structure and leads to \"spaghetti code.\"","xa":"تعتمد البرمجة المهيكلة على ثلاثة هياكل تحكم أساسية فقط: التتابع (Sequence) والاختيار (Selection) والتكرار (Iteration) . أما عبارة `goto` فتسمح بالقفز العشوائي في مسار البرنامج، وهي مرفوضة في البرمجة المهيكلة لأنها تكسر البنية المنطقية وتؤدي إلى ما يُعرف بـ \"كود السباغيتي\" (Spaghetti Code)."},{"n":2,"ch":9,"qe":"Structured programming mainly improves code","qa":"البرمجة المهيكلة تحسن الكود بشكل أساسي من حيث","o":[{"l":"A","e":"Length","a":"الطول"},{"l":"B","e":"Readability","a":"قابلية القراءة (Readability)"},{"l":"C","e":"Randomness","a":"العشوائية"},{"l":"D","e":"Execution time only","a":"وقت التنفيذ فقط"}],"c":"B","xe":"The primary goal of structured programming is to make code easier to understand, reason about, and maintain by enforcing clear, logical control flow. This is achieved mainly through improved readability, not by minimizing length or improving execution speed.","xa":"الهدف الأساسي من البرمجة المهيكلة هو جعل الكود أسهل في الفهم والتحليل والصيانة من خلال فرض تدفق تحكم منطقي وواضح. ويتحقق ذلك بشكل أساسي عبر تحسين قابلية القراءة (Readability)، وليس عبر تقليل الطول أو زيادة سرعة التنفيذ."},{"n":3,"ch":9,"qe":"Excessive use of which statement led to \"spaghetti code\" before structured programming?","qa":"الإفراط في استخدام أي عبارة أدى إلى ظهور \"كود السباغيتي\" (Spaghetti Code) قبل البرمجة المهيكلة؟","o":[{"l":"A","e":"for","a":"حلقة for"},{"l":"B","e":"goto","a":"عبارة goto"},{"l":"C","e":"if","a":"عبارة if"},{"l":"D","e":"switch","a":"عبارة switch"}],"c":"B","xe":"Before structured programming became standard, programmers often used `goto` statements to jump around the code arbitrarily. Excessive and unstructured use of `goto` produced tangled, hard-to-follow code commonly called \"spaghetti code.\"","xa":"قبل انتشار البرمجة المهيكلة، كان المبرمجون يستخدمون عبارة `goto` بكثرة للقفز عشوائياً داخل الكود. الاستخدام المفرط وغير المنظم لـ `goto` أنتج كوداً متشابكاً وصعب المتابعة يُعرف شائعاً بـ \"كود السباغيتي\" (Spaghetti Code)."},{"n":4,"ch":9,"qe":"The process of breaking a large problem into smaller, manageable parts is called:","qa":"عملية تقسيم مشكلة كبيرة إلى أجزاء أصغر وقابلة للإدارة تسمى:","o":[{"l":"A","e":"Optimization","a":"التحسين (Optimization)"},{"l":"B","e":"Modularity","a":"التقسيم إلى وحدات (Modularity)"},{"l":"C","e":"Debugging","a":"تصحيح الأخطاء (Debugging)"},{"l":"D","e":"Compilation","a":"الترجمة (Compilation)"}],"c":"B","xe":"Modularity (or modularization) is the design principle of dividing a large, complex system into smaller, independent, and manageable components or modules . This makes the system easier to develop, test, and maintain.","xa":"التقسيم إلى وحدات (Modularity أو Modularization) هو مبدأ تصميمي يقضي بتقسيم نظام كبير ومعقد إلى مكونات أو وحدات أصغر ومستقلة وقابلة للإدارة . وهذا يسهل تطوير النظام واختباره وصيانته."},{"n":5,"ch":9,"qe":"Which is NOT a benefit of structured programming?","qa":"أي مما يلي ليس من فوائد البرمجة المهيكلة؟","o":[{"l":"A","e":"Easier maintenance","a":"صيانة أسهل"},{"l":"B","e":"Improved readability","a":"قابلية قراءة محسنة"},{"l":"C","e":"Increased logical clarity","a":"وضوح منطقي أكبر"},{"l":"D","e":"Guaranteed error-free code","a":"كود خالٍ من الأخطاء بشكل مضمون"}],"c":"D","xe":"Structured programming improves maintainability, readability, and logical clarity, making it easier to find and fix bugs. However, no programming paradigm can guarantee that code will be completely free of errors.","xa":"البرمجة المهيكلة تحسن قابلية الصيانة وقابلية القراءة والوضوح المنطقي، مما يسهل إيجاد الأخطاء وإصلاحها. لكن لا يوجد أي نمط برمجي يمكنه ضمان أن الكود سيكون خالياً من الأخطاء تماماً."},{"n":6,"ch":9,"qe":"Before learning OOP, it is recommended to master:","qa":"قبل تعلم البرمجة الكائنية التوجه (OOP)، يُنصح بإتقان:","o":[{"l":"A","e":"Functional programming","a":"البرمجة الوظيفية"},{"l":"B","e":"Structured programming","a":"البرمجة المهيكلة"},{"l":"C","e":"Database concepts","a":"مفاهيم قواعد البيانات"},{"l":"D","e":"Assembly language","a":"لغة التجميع"}],"c":"B","xe":"Structured programming teaches the fundamental control flow concepts—sequence, selection, and iteration—and the discipline of organizing code logically. Mastering these basics provides a strong foundation before moving on to the complexities of object-oriented programming.","xa":"تعلّم البرمجة المهيكلة يُرسّخ مفاهيم التحكم الأساسية—التتابع والاختيار والتكرار—وانضباط تنظيم الكود منطقياً. وإتقان هذه الأساسيات يوفر قاعدة قوية قبل الانتقال إلى تعقيدات البرمجة الكائنية التوجه (OOP)."},{"n":7,"ch":9,"qe":"Structured programming focuses on:","qa":"تركز البرمجة المهيكلة على:","o":[{"l":"A","e":"Random jumps in program flow","a":"القفزات العشوائية في مسار البرنامج"},{"l":"B","e":"Clear and logical flow of control","a":"تدفق تحكم واضح ومنطقي"},{"l":"C","e":"Only object-oriented design","a":"التصميم الكائني فقط"},{"l":"D","e":"Hardware-level coding","a":"البرمجة على مستوى العتاد"}],"c":"B","xe":"The central focus of structured programming is to design programs with a clear, logical, and predictable flow of control using only the three core structures, avoiding arbitrary jumps like `goto`.","xa":"التركيز الأساسي للبرمجة المهيكلة هو تصميم برامج ذات تدفق تحكم واضح ومنطقي وقابل للتنبؤ باستخدام الهياكل الأساسية الثلاثة فقط، مع تجنب القفزات العشوائية مثل `goto`."},{"n":8,"ch":9,"qe":"In structured programming, the three constructs are sequence, selection, and:","qa":"في البرمجة المهيكلة، الهياكل الثلاثة هي التتابع والاختيار و:","o":[{"l":"A","e":"Repetition/Iteration","a":"التكرار (Repetition/Iteration)"},{"l":"B","e":"Encapsulation","a":"التغليف (Encapsulation)"},{"l":"C","e":"Abstraction","a":"التجريد (Abstraction)"},{"l":"D","e":"Compilation","a":"الترجمة (Compilation)"}],"c":"A","xe":"The three fundamental control structures in structured programming are sequence, selection (decision), and repetition or iteration (loops) . Encapsulation and abstraction are concepts primarily associated with object-oriented programming.","xa":"هياكل التحكم الأساسية الثلاثة في البرمجة المهيكلة هي التتابع (Sequence) والاختيار (Selection) والتكرار (Repetition/Iteration) . أما التغليف (Encapsulation) والتجريد (Abstraction) فهما مفهومان يرتبطان أساساً بالبرمجة الكائنية التوجه."},{"n":9,"ch":9,"qe":"Which of these is an example of a selection structure?","qa":"أي مما يلي يُعد مثالاً على هيكل الاختيار (Selection Structure)؟","o":[{"l":"A","e":"for loop","a":"حلقة for"},{"l":"B","e":"if-else","a":"عبارة if-else"},{"l":"C","e":"sequence of statements","a":"تسلسل من التعليمات"},{"l":"D","e":"function call","a":"استدعاء دالة"}],"c":"B","xe":"A selection structure allows the program to choose between different paths of execution based on a condition. The `if-else` statement is the classic example of a selection structure, executing one block if a condition is true and another if it is false.","xa":"هيكل الاختيار (Selection Structure) يسمح للبرنامج بالاختيار بين مسارات تنفيذ مختلفة بناءً على شرط. وعبارة `if-else` هي المثال الكلاسيكي لهيكل الاختيار، حيث تنفذ كتلة إذا كان الشرط صحيحاً وكتلة أخرى إذا كان خاطئاً."},{"n":10,"ch":9,"qe":"Which of the following languages can be used for structured programming?","qa":"أي من اللغات التالية يمكن استخدامها للبرمجة المهيكلة؟","o":[{"l":"A","e":"Only C","a":"لغة C فقط"},{"l":"B","e":"Only Pascal","a"
