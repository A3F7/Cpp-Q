$('#vm').onclick=e=>{focus=!focus;document.body.classList.toggle('fm',focus);e.target.textContent=focus?'☰ List Mode':'▶ Focus Mode';e.target.classList.toggle('on',focus);render();scrollTo({top:0})};
$('#rst').onclick=()=>{if(confirm('Reset all answers? / مسح كل الإجابات؟')){st.a={};save();render()}};
function save(){store.set('eb_state',st)}

function filtered(){return order.map(i=>DATA[i]).filter(x=>(ch==='all'||x.ch==ch)&&(!onlySaved||st.m.includes(id(x)))&&(!q||(x.qe+x.qa+x.o.map(o=>o.e+o.a).join()).toLowerCase().includes(q)))}

function card(x){
  const k=id(x),done=st.a[k];
  const opts=x.o.map(o=>{let c='';if(done){if(o.l===x.c)c=' ok';else if(o.l===done)c=' no';else c=' dim'}
    return `<button class="opt${c}" data-l="${o.l}" ${done?'disabled':''}><span class="l">${o.l}</span><span class="t"><span class="e">${esc(o.e)}</span>${o.a?`<span class="a ar">${esc(o.a)}</span>`:''}</span></button>`}).join('');
  const ca=x.o.find(o=>o.l===x.c);
  const bad=!x.c||x.o.length<4;
  return `<article class="q in-wrap" data-k="${k}">
   <div class="qtop"><span class="num">Question ${x.n} · Chapter ${x.ch}</span><button class="mark${st.m.includes(k)?' on':''}" title="Save">★</button></div>
   <div class="qe">${esc(x.qe)}</div><div class="qa ar">${esc(x.qa)}</div>
   <div class="opts">${opts}</div>
   ${bad?`<div class="warn">⚠ This question is incomplete in the source file / هذا السؤال غير مكتمل في الملف الأصلي</div>`:''}
   <button class="btn showbtn">${done?'Hide explanation':'Show answer · إظهار الإجابة'}</button>
   <div class="reveal${done?' open':''}"><div><div class="ans">
     ${ca?`<div class="ok-line">✅ Correct Answer: ${ca.l}) <span class="en">${esc(ca.e)}</span> <span class="ar keep">${esc(ca.a)}</span></div>`:''}
     <div class="en"><h4>Explanation</h4><p>${esc(x.xe)}</p></div>
     <h4 class="ar" style="text-align:right">الشرح</h4><p class="ar">${esc(x.xa)}</p>
   </div></div></div></article>`}

function render(){
  const list=filtered();
  if(focus){renderFocus(list)}else{
    let h='',last=null;
    list.forEach(x=>{if(ch==='all'&&x.ch!==last&&!q){last=x.ch;h+=`<div class="chhead"><h2 class="serif">Chapter ${x.ch}</h2><div class="ln"></div><small>${DATA.filter(d=>d.ch===x.ch).length} questions</small></div>`}h+=card(x)});
    $('#list').innerHTML=h||'<div class="empty">No questions found · لا توجد نتائج</div>';
    observe();
  }
  stats();
}
function renderFocus(list){
  if(!list.length){$('#focus').innerHTML='<div class="empty">No questions found · لا توجد نتائج</div>';return}
  idx=Math.max(0,Math.min(idx,list.length-1));
  $('#focus').innerHTML=`<div class="dots"><i style="width:${(idx+1)/list.length*100}%"></i></div><div class="slide">${card(list[idx]).replace('class="q in-wrap"','class="q in"')}</div>
  <div class="fnav"><button class="btn" id="pv">← Prev</button><span class="num">${idx+1} / ${list.length}</span><button class="btn on" id="nx">Next →</button></div>`;
  $('#pv').onclick=()=>go(-1,list);$('#nx').onclick=()=>go(1,list);
}
function go(d,list){document.body.classList.toggle('back',d<0);idx+=d;renderFocus(list||filtered());stats()}
document.addEventListener('keydown',e=>{if(!focus||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);const l=e.key.toUpperCase();if('ABCD'.includes(l)&&l.length===1){const b=$(`.opt[data-l="${l}"]:not(:disabled)`);b&&b.click()}});

document.addEventListener('click',e=>{
  const card=e.target.closest('.q');if(!card||!card.dataset.k)return;const k=card.dataset.k,x=DATA.find(d=>id(d)===k);
  const o=e.target.closest('.opt');
  if(o&&!o.disabled){const r=o.getBoundingClientRect();o.style.setProperty('--x',(e.clientX-r.left)+'px');o.style.setProperty('--y',(e.clientY-r.top)+'px');
    st.a[k]=o.dataset.l;save();apply(card,x);if(o.dataset.l===x.c)confetti(e.clientX,e.clientY);return}
  if(e.target.closest('.mark')){const b=e.target.closest('.mark');const i=st.m.indexOf(k);i<0?st.m.push(k):st.m.splice(i,1);b.classList.toggle('on');save();return}
  if(e.target.closest('.showbtn')){const rv=card.querySelector('.reveal'),open=rv.classList.toggle('open');e.target.textContent=open?'Hide explanation':'Show answer · إظهار الإجابة';
    if(open&&!st.a[k]){st.a[k]='_';save();card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.add(b.dataset.l===x.c?'ok':'dim')});stats()}}
});
function apply(card,x){const k=id(x),a=st.a[k];card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.add(b.dataset.l===x.c?'ok':b.dataset.l===a?'no':'dim')});card.querySelector('.reveal').classList.add('open');card.querySelector('.showbtn').textContent='Hide explanation';stats()}

function stats(){
  const v=Object.entries(st.a).filter(([k])=>DATA.some(d=>id(d)===k));
  const ans=v.filter(([k,l])=>l!=='_'),ok=ans.filter(([k,l])=>DATA.find(d=>id(d)===k).c===l).length;
  $('#sAns').textContent=v.length;$('#sAcc').textContent=ans.length?Math.round(ok/ans.length*100)+'%':'0%';
  $('#hOk').textContent=ok;$('#hNo').textContent=ans.length-ok;
  const p=Math.round(v.length/DATA.length*100);$('#rp').textContent=p+'%';$('#rg').style.strokeDashoffset=113.1*(1-p/100);
}
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});$$('.q').forEach(c=>io.observe(c))}
addEventListener('scroll',()=>{const h=document.documentElement;$('#pbar').style.width=scrollY/(h.scrollHeight-innerHeight)*100+'%'});
// counters
$$('[data-c]').forEach(el=>{const t=+el.dataset.c;let n=0;const s=performance.now();(function f(now){const p=Math.min((now-s)/1400,1);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)});
// confetti
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];function sz(){cv.width=innerWidth;cv.height=innerHeight}sz();addEventListener('resize',sz);
function confetti(x,y){const col=['#b8893a','#e2bd6d','#3f8f5f','#f0dcb0','#d9a94c'];for(let i=0;i<36;i++)P.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,r:Math.random()*5+3,c:col[i%5],l:60+Math.random()*30,a:Math.random()*6});if(P.length<=40)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;p.l--;cx.save();cx.globalAlpha=Math.min(1,p.l/30);cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});P.length?requestAnimationFrame(loop):cx.clearRect(0,0,cv.width,cv.height)}
// ===== EXAM MODE =====
let X=null,xt=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
$('#xm').onclick=()=>{$('#exam').classList.add('on');document.body.style.overflow='hidden';xSetup()};
function xClose(){clearInterval(xt);X=null;$('#exam').classList.remove('on');document.body.style.overflow='';render()}
function xSetup(){
  const cfg=window._cfg||(window._cfg={chs:new Set(chs),n:20,mins:20,sh:true});
  const cnt=DATA.filter(d=>cfg.chs.has(d.ch)).length;
  $('#xw').innerHTML=`<div class="setup"><div class="badge">Exam Mode · وضع الامتحان</div><h2 class="serif" style="margin-top:12px">Set up your exam</h2><div class="ar" style="color:var(--mut)">جهّز امتحانك وابدأ التحدي</div>
  <h3>Chapters · الشباتر</h3><div class="grid" id="xc">${chs.map(c=>`<button class="chip${cfg.chs.has(c)?' on':''}" data-c="${c}">Ch ${c}</button>`).join('')}<button class="chip" data-c="all">All / Clear</button></div>
  <h3>Questions · عدد الأسئلة (${cnt} available)</h3><div class="grid" id="xn">${[10,20,30,50,100].map(n=>`<button class="chip${cfg.n===n?' on':''}" data-n="${n}">${n}</button>`).join('')}</div>
  <h3>Time · الوقت (minutes)</h3><div class="grid" id="xmn">${[5,10,15,20,30,45,60].map(m=>`<button class="chip${cfg.mins===m?' on':''}" data-m="${m}">${m} min</button>`).join('')}</div>
  <div style="display:flex;gap:10px;margin-top:28px;flex-wrap:wrap"><button class="btn on" id="xgo" style="padding:12px 30px;font-size:1rem">Start Exam ▶ ابدأ</button><button class="btn" id="xcl">Close · إغلاق</button></div></div>`;
  $('#xc').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const c=b.dataset.c;if(c==='all'){cfg.chs=cfg.chs.size===chs.length?new Set():new Set(chs)}else{cfg.chs.has(+c)?cfg.chs.delete(+c):cfg.chs.add(+c)}xSetup()};
  $('#xn').onclick=e=>{const b=e.target.closest('.chip');if(b){cfg.n=+b.dataset.n;cfg.mins=Math.max(5,Math.round(cfg.n*1/5)*5||5);xSetup()}};
  $('#xmn').onclick=e=>{const b=e.target.closest('.chip');if(b){cfg.mins=+b.dataset.m;xSetup()}};
  $('#xcl').onclick=xClose;
  $('#xgo').onclick=()=>{const pool=DATA.filter(d=>cfg.chs.has(d.ch)&&d.c);if(!pool.length)return alert('Select at least one chapter');
    const qsel=pool.sort(()=>Math.random()-.5).slice(0,cfg.n);X={qs:qsel,a:{},f:new Set(),i:0,total:cfg.mins*60,left:cfg.mins*60,done:false};
    xt=setInterval(()=>{if(!X||X.done)return;X.left--;const t=$('#xt');if(t){t.textContent=fmt(X.left);t.parentElement.classList.toggle('low',X.left<=60);$('#xb').style.width=X.left/X.total*100+'%'}if(X.left<=0)xSubmit()},1000);xRender()};
}
function xRender(){
  const q=X.qs[X.i];
  $('#xw').innerHTML=`<div class="xh"><div class="timer">⏱ <span id="xt">${fmt(X.left)}</span></div><div class="num">Question ${X.i+1} / ${X.qs.length} · Answered ${Object.keys(X.a).length}</div><div class="grid"><button class="btn" id="xfl">${X.f.has(X.i)?'⚑ Unflag':'⚐ Flag'}</button><button class="btn on" id="xsub">Submit ✓ تسليم</button></div></div>
  <div class="tbar"><i id="xb" style="width:${X.left/X.total*100}%"></i></div>
  <div class="nav">${X.qs.map((_,i)=>`<button class="nb${X.a[i]?' done':''}${i===X.i?' cur':''}${X.f.has(i)?' flag':''}" data-i="${i}">${i+1}</button>`).join('')}</div>
  <div class="q in slide"><div class="qtop"><span class="num">Chapter ${q.ch}</span></div><div class="qe">${esc(q.qe)}</div><div class="qa ar">${esc(q.qa)}</div>
  <div class="opts">${q.o.map(o=>`<button class="opt${X.a[X.i]===o.l?' sel':''}" data-l="${o.l}"><span class="l">${o.l}</span><span class="t"><span class="e">${esc(o.e)}</span>${o.a?`<span class="a ar">${esc(o.a)}</span>`:''}</span></button>`).join('')}</div></div>
  <div class="fnav"><button class="btn" id="xp" ${X.i?'':'disabled'}>← Prev</button><button class="btn on" id="xn2" ${X.i<X.qs.length-1?'':'disabled'}>Next →</button></div>`;
  $$('.nb').forEach(b=>b.onclick=()=>{X.i=+b.dataset.i;xRender()});
  $$('#xw .opt').forEach(b=>b.onclick=()=>{X.a[X.i]=b.dataset.l;xRender()});
  $('#xp').onclick=()=>{X.i--;xRender()};$('#xn2').onclick=()=>{X.i++;xRender()};
  $('#xfl').onclick=()=>{X.f.has(X.i)?X.f.delete(X.i):X.f.add(X.i);xRender()};
  $('#xsub').onclick=()=>{const un=X.qs.length-Object.keys(X.a).length;if(!un||confirm(`${un} unanswered. Submit? / ${un} سؤال بدون إجابة، تسليم؟`))xSubmit()};
  $('#xt').parentElement.classList.toggle('low',X.left<=60);
}
function xSubmit(){
  X.done=true;clearInterval(xt);
  const ok=X.qs.filter((q,i)=>X.a[i]===q.c).length,n=X.qs.length,p=Math.round(ok/n*100),used=X.total-Math.max(X.left,0);
  const by={};X.qs.forEach((q,i)=>{(by[q.ch]=by[q.ch]||[0,0])[1]++;if(X.a[i]===q.c)by[q.ch][0]++});
  const g=p>=90?['Excellent · ممتاز','🏆']:p>=75?['Very Good · جيد جدًا','🌟']:p>=60?['Good · جيد','👍']:p>=50?['Pass · مقبول','📘']:['Keep practicing · حاول مرة أخرى','💪'];
  const wrong=X.qs.map((q,i)=>[q,i]).filter(([q,i])=>X.a[i]!==q.c);
  $('#xw').innerHTML=`<div class="res"><div class="badge">Results · النتيجة</div><div class="big" style="margin-top:20px"><svg width="200" height="200"><circle stroke="var(--line)" cx="100" cy="100" r="88"/><circle class="fg" id="xrg" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="553"/></svg><span id="xp2">0%</span></div>
  <h2 class="serif" style="font-size:2.2rem;margin-top:14px">${g[1]} ${g[0]}</h2><p style="color:var(--mut)">${ok} / ${n} correct · ${n-ok} wrong · time ${fmt(used)}</p>
  <div style="max-width:480px;margin:20px auto">${Object.entries(by).map(([c,[a,b]])=>`<div class="bk"><b>Ch ${c}</b><div class="bb"><i data-w="${a/b*100}"></i></div><span>${a}/${b}</span></div>`).join('')}</div>
  <div class="grid" style="justify-content:center"><button class="btn on" id="xre">↺ New exam · امتحان جديد</button><button class="btn" id="xcl2">Close · إغلاق</button></div></div>
  <div class="rv"><h2 class="serif" style="font-size:1.8rem;margin-bottom:12px">${wrong.length?'Review mistakes · مراجعة الأخطاء':'Perfect score! · درجة كاملة 🎉'}</h2>
  ${wrong.map(([q,i])=>card(q).replace(/<button class="opt[^"]*" data-l="(\w)"[^>]*>/g,(m,l)=>`<button class="opt${l===q.c?' ok':l===X.a[i]?' no':' dim'}" disabled>`).replace('class="reveal"','class="reveal open"').replace('class="q in-wrap"','class="q in"')).join('')}</div>`;
  $('#exam').scrollTo({top:0});
  setTimeout(()=>{$('#xrg').style.strokeDashoffset=553*(1-p/100);$$('.bb i').forEach(i=>i.style.width=i.dataset.w+'%');let c=0;const iv=setInterval(()=>{c=Math.min(c+2,p);$('#xp2').textContent=c+'%';if(c>=p)clearInterval(iv)},25)},100);
  if(p>=60)for(let k=0;k<6;k++)setTimeout(()=>confetti(innerWidth*(.15+k*.14),innerHeight*.35),k*250);
  $('#xre').onclick=xSetup;$('#xcl2').onclick=xClose;
}
render();
</script>
</body></html>
